/* ===== 數線跳跳:青蛙在數線上,往前跳是加、往後跳是減;從 0 開始幾個一跳是乘法。點青蛙會跳到的地方 =====
   一局 6 題,不計時。答對了青蛙會一格一格跳過去;同一題點錯兩次,青蛙會示範一次再換下一題 */
Object.assign(T,{frog:['數線跳跳','ㄕㄨˋ ㄒㄧㄢˋ ㄊㄧㄠˋ ㄊㄧㄠˋ'],fDone:['全部跳完了!','ㄑㄩㄢˊ ㄅㄨˋ ㄊㄧㄠˋ ㄨㄢˊ ˙ㄌㄜ']});
const FG={at:['青蛙在','ㄑㄧㄥ ㄨㄚ ㄗㄞˋ'],fwd:['往前跳','ㄨㄤˇ ㄑㄧㄢˊ ㄊㄧㄠˋ'],back:['往後跳','ㄨㄤˇ ㄏㄡˋ ㄊㄧㄠˋ'],
  ge:['格,會跳到哪裡?','ㄍㄜˊ ㄏㄨㄟˋ ㄊㄧㄠˋ ㄉㄠˋ ㄋㄚˇ ㄌㄧˇ'],from:['從','ㄘㄨㄥˊ'],start:['開始,一次跳','ㄎㄞ ㄕˇ ㄧˊ ㄘˋ ㄊㄧㄠˋ'],
  jump:['跳','ㄊㄧㄠˋ'],times:['次,會跳到哪裡?','ㄘˋ ㄏㄨㄟˋ ㄊㄧㄠˋ ㄉㄠˋ ㄋㄚˇ ㄌㄧˇ'],
  mAdd:['加減跳跳','ㄐㄧㄚ ㄐㄧㄢˇ ㄊㄧㄠˋ ㄊㄧㄠˋ'],mSkip:['幾個一跳','ㄐㄧˇ ˙ㄍㄜ ㄧˊ ㄊㄧㄠˋ']};
const FROG_ROUNDS=6;
let F=null;
function frog(mode){
  mode=mode==='add'||mode==='skip'?mode:S.grade===1?'add':'skip';
  F={mode,round:0,miss:0,busy:false};sfx.tap();
  show('frog',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts" id="fprog"></span></div>
  <div class="row center">${mascot()}<h1>🐸 ${Z(T.frog)}</h1></div>
  <div class="row center">${[['add','➕',FG.mAdd],['skip','✖️',FG.mSkip]].map(([k,e,t])=>`<button class="kid ${k===mode?'on':''}" onclick="frog('${k}')">${e} ${Z(t)}</button>`).join('')}</div>
  <div id="gres"></div><div class="card" id="fcard" style="margin-top:12px"></div>`);
  frogNext();
}
function frogNext(){
  if(scr!=='frog')return;
  if(F.round>=FROG_ROUNDS){$('#fcard').remove();return playEnd(F.miss,`frog('${F.mode}')`,T.fDone)}
  F.round++;F.tries=0;F.busy=false;let p;
  // 數線一次只畫一段:平板畫 11 格;手機螢幕窄,畫 7 格、跳的格數也少一點,每一格才夠大、點得準
  const N=innerWidth<500?7:11,far=N-2;
  if(F.mode==='add'){ // 畫出來的這一段一定包含起點和終點
    const fwd=R(0,1),n=R(2,far),from=fwd?R(0,20-n):R(n,20),to=fwd?from+n:from-n;
    const lo=Math.min(21-N,Math.max(0,R(Math.max(from,to)-(N-1),Math.min(from,to))));
    F.vals=Array.from({length:N},(_,k)=>lo+k);F.from=from;F.to=to;F.calc=`${from} ${fwd?'+':'−'} ${n} = ${to}`;
    p=line([FG.at,from,',',fwd?'➡️ ':'⬅️ ',fwd?FG.fwd:FG.back,n,FG.ge]);
  }else{
    const st=pick([2,5,10]),n=R(2,N-1);
    F.vals=Array.from({length:N},(_,k)=>k*st);F.from=0;F.to=st*n;F.calc=`${st} × ${n} = ${st*n}`;
    p=line([FG.from,0,FG.start,st,',',FG.jump,n,FG.times]);
  }
  F.say=p.say;F.at=F.vals.indexOf(F.from);
  $('#fprog').textContent=`🐸 ${F.round} / ${FROG_ROUNDS}`;
  $('#fcard').innerHTML=`<div class="row" style="flex-wrap:nowrap"><div class="prompt sp">${p.h}</div><button class="spk" onclick="speak(F.say,true)">🔊</button></div>
    <div class="nline">${F.vals.map((v,k)=>`<button class="tk ${k===F.at?'from':''}" id="tk${k}" onclick="frogPick(${k})"><span class="fr">${k===F.at?'🐸':''}</span><i></i><b>${v}</b></button>`).join('')}</div>
    <div id="fmsg" style="text-align:center;min-height:44px"></div>`;
  speak(p.say);
}
function frogHop(k,done){ // 青蛙從現在的位置一格一格跳到第 k 格
  const d=Math.sign(k-F.at);let n=0;
  const step=()=>{
    if(scr!=='frog')return;
    if(F.at===k)return done();
    $('#tk'+F.at).querySelector('.fr').textContent='';F.at+=d;
    const f=$('#tk'+F.at).querySelector('.fr');f.textContent='🐸';f.classList.remove('hop');void f.offsetWidth;f.classList.add('hop');
    beep(440+ ++n*40,0,.1);setTimeout(step,300);
  };
  step();
}
function frogPick(k){
  if(F.busy||k===F.at)return;
  const target=F.vals.indexOf(F.to),show=()=>{$('#tk'+target).classList.add('hit');$('#fmsg').innerHTML=pp(F.calc,0,'an-sum')};
  if(k===target){
    F.busy=true;
    return frogHop(target,()=>{show();sfx.ok();const r=$('#tk'+target).getBoundingClientRect();burst(r.left+r.width/2,r.top+20,8);speak(sayOps(F.calc));setTimeout(frogNext,1500)});
  }
  F.miss++;F.tries++;sfx.bad();mascotAnim('sad');
  const t=$('#tk'+k);t.classList.remove('no');void t.offsetWidth;t.classList.add('no');
  if(F.tries>=2){F.busy=true;setTimeout(()=>frogHop(target,()=>{show();speak(sayOps(F.calc));setTimeout(frogNext,2200)}),500)} // 示範一次
  else speak(T.again[0]);
}

/* ===== 戳氣球:牌子上有一個數字,把「答案是這個數字」的氣球都戳破(一次有 2~3 顆是對的) =====
   一局 5 題,不計時。戳錯的氣球會告訴你它是多少;一年級是加減,二年級加上乘法,三年級再加上除法 */
Object.assign(T,{bln:['戳氣球','ㄔㄨㄛ ㄑㄧˋ ㄑㄧㄡˊ'],bDone:['氣球都戳破了!','ㄑㄧˋ ㄑㄧㄡˊ ㄉㄡ ㄔㄨㄛ ㄆㄛˋ ˙ㄌㄜ']});
const BLN={find1:['把答案是','ㄅㄚˇ ㄉㄚˊ ㄢˋ ㄕˋ'],find2:['的氣球都戳破!','˙ㄉㄜ ㄑㄧˋ ㄑㄧㄡˊ ㄉㄡ ㄔㄨㄛ ㄆㄛˋ'],
  left1:['還有','ㄏㄞˊ ㄧㄡˇ'],left2:['顆','ㄎㄜ'],notIt:['這一顆是','ㄓㄜˋ ㄧˋ ㄎㄜ ㄕˋ'],allOk:['全部找到了!','ㄑㄩㄢˊ ㄅㄨˋ ㄓㄠˇ ㄉㄠˋ ˙ㄌㄜ']};
const BLN_ROUNDS=5,BLN_COLORS=['#ff9ec4','#ffd166','#8fe3c0','#a9c8ff','#c9a7f5','#ffb38a'];
let BL=null;
// 做一個答案是 v 的算式(g:年級);做不出來回傳 null
function blnExpr(v,g){
  const fs=[];
  if(v>=2)fs.push(()=>{const a=R(1,v-1);return `${a} + ${v-a}`});
  const top=g===1?20:100;if(v<top)fs.push(()=>{const b=R(1,Math.min(g===1?9:30,top-v));return `${v+b} − ${b}`});
  if(g>=2){const fp=[];for(let a=2;a<=9;a++)if(v%a===0&&v/a>=2&&v/a<=9)fp.push(a);if(fp.length){const m=()=>{const a=pick(fp);return `${a} × ${v/a}`};fs.push(m,m)}}
  if(g>=3&&v>=2&&v<=9){const d=()=>{const k=R(2,9);return `${v*k} ÷ ${k}`};fs.push(d,d)}
  return fs.length?pick(fs)():null;
}
function blnRound(g){
  const tab=()=>R(2,9)*R(2,9);
  for(let n=0;n<200;n++){
    const t=g===1?R(6,18):g===2?(R(0,1)?tab():R(11,60)):(R(0,1)?R(4,9):tab());
    const want=R(2,3),set=new Map();let guard=0;
    while(set.size<want&&guard++<60){const e=blnExpr(t,g);if(e)set.set(e,t)}
    if(set.size<want)continue;
    guard=0;
    while(set.size<6&&guard++<200){const w=t+pick([-3,-2,-1,1,2,3,-10,10]);if(w<1||(g===1&&w>20))continue;const e=blnExpr(w,g);if(e&&!set.has(e))set.set(e,w)}
    if(set.size===6)return {t,items:shuffle([...set].map(([e,v])=>({e,v})))};
  }
  return {t:10,items:shuffle([['6 + 4',10],['13 − 3',10],['5 + 4',9],['8 + 3',11],['12 − 4',8],['7 + 5',12]].map(([e,v])=>({e,v})))};
}
function balloon(){
  BL={round:0,miss:0,busy:false};sfx.tap();
  show('balloon',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts" id="blprog"></span></div>
  <div class="row center">${mascot()}<h1>🎈 ${Z(T.bln)}</h1></div>
  <div id="gres"></div><div class="card" id="blcard" style="margin-top:12px"></div>`);
  blnNext();
}
function blnNext(){
  if(scr!=='balloon')return;
  if(BL.round>=BLN_ROUNDS){$('#blcard').remove();return playEnd(BL.miss,'balloon()',T.bDone,1,3)}
  BL.round++;BL.busy=false;Object.assign(BL,blnRound(S.grade));
  BL.left=BL.items.filter(x=>x.v===BL.t).length;
  const p=line([BLN.find1,BL.t,BLN.find2]),cs=shuffle(BLN_COLORS);BL.say=p.say;
  $('#blprog').textContent=`🎈 ${BL.round} / ${BLN_ROUNDS}`;
  $('#blcard').innerHTML=`<div class="row" style="flex-wrap:nowrap"><div class="prompt sp">${p.h}</div><button class="spk" onclick="speak(BL.say,true)">🔊</button></div>
    <div class="bsign">${BL.t}</div>
    <div class="blns">${BL.items.map((x,i)=>`<button class="bln" id="bln${i}" style="--c:${cs[i]};animation-delay:${-(i*.37).toFixed(2)}s" onclick="blnPick(${i})"><span>${x.e}</span></button>`).join('')}</div>
    <div id="blmsg" style="text-align:center;min-height:48px"></div>`;
  blnLeft();speak(p.say);
}
function blnLeft(){$('#blmsg').innerHTML=`<span class="hint">${Z(BLN.left1)} ${BL.left} ${Z(BLN.left2)}</span>`}
function blnPick(i){
  const x=BL.items[i],b=$('#bln'+i);
  if(BL.busy||x.done)return;
  const eq=`${x.e} = ${x.v}`;
  if(x.v===BL.t){
    x.done=true;BL.left--;sfx.ok();const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,10);b.classList.add('popped');
    if(BL.left>0){blnLeft();return speak(sayOps(eq))}
    BL.busy=true;mascotAnim('jump');$('#blmsg').innerHTML=`<span class="hint">🎉 ${Z(BLN.allOk)}</span>`;speak(sayOps(eq));
    const me=BL;return setTimeout(()=>{if(BL===me)blnNext()},1600); // 中途離開又重新開始的話,舊的這一局不可以再換題
  }
  // 戳錯:氣球不會破,直接把它的答案寫出來,下次就知道它不是
  x.done=true;BL.miss++;sfx.bad();mascotAnim('sad');
  b.classList.add('no','wrong');b.querySelector('span').textContent=eq;
  $('#blmsg').innerHTML=`<span class="hint">${Z(BLN.notIt)} ${x.v}</span>`;speak(sayOps(eq));
}

const SHOP_ITEMS=[['🍎','蘋果'],['🍌','香蕉'],['🍪','餅乾'],['🧃','果汁'],['🍞','麵包'],['✏️','鉛筆'],['🍬','糖果'],['🥛','牛奶'],['🍓','草莓'],['🎈','氣球']];

function shop(){

  const toPay=()=>{P.step=2;P.tries=0;closePad();shopDraw();speak(`客人付了${P.pay}元,要找多少元?`)};
  if(+P.val===P.total){sfx.ok();burst();return toPay()}
  P.miss++;P.tries++;sfx.bad();shopShake('#sinp');P.val='';

    P.busy=true;$('#sinp').textContent=P.total;$('#smsg').innerHTML=pp(`${P.items[0].p} + ${P.items[1].p} = ${P.total}`,0,'an-sum');

  askBig:['這一題太大了,以後再教你!','ㄓㄜˋ ㄧˋ ㄊㄧˊ ㄊㄞˋ ㄉㄚˋ ˙ㄌㄜ ㄧˇ ㄏㄡˋ ㄗㄞˋ ㄐㄧㄠ ㄋㄧˇ'],
  askMe:['我也要練習','ㄨㄛˇ ㄧㄝˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ'],
});

/* ===== 聽小朋友說話(兩個功能共用)=====
   onInterim(還沒說完時聽到的字);cb(聽到的幾種可能) 或 cb(null,原因):denied 不能用麥克風、unclear 聽不清楚、none 這台沒有語音辨識 */
function stopHear(){if(rec){try{rec.abort()}catch(e){}rec=null}}
function hear(onInterim,cb){
  if(!SR||micOff)return cb(null,'none');
  stopHear();speakSeq++;talking(false);try{speechSynthesis.cancel()}catch(e){} // 先停下正在唸的,不然會聽到自己的聲音
  const r=rec=new SR();r.lang='zh-TW';r.maxAlternatives=5;r.interimResults=true;
  let done=false,last='';const fin=(a,err)=>{if(done)return;done=true;cb(a,err)};
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    if(!res.isFinal){last=res[0].transcript;return onInterim(last)}
    fin([...res].map(a=>a.transcript));
  };
  r.onerror=e=>{
    if(e.error==='aborted'){done=true;return} // 自己按停的
    if(/not-allowed/.test(e.error))fin(null,'denied');
  };
  // iPad 有時候聽完了卻不會回報「說完了」,這時候就用最後聽到的字
  r.onend=()=>{if(rec===r)rec=null;if(last)fin([last]);else fin(null,'unclear')};
  try{r.start()}catch(e){rec=null;fin(null,'unclear')}
}
// 唸一段話,唸完以後做 done(這台不能唸、或瀏覽器沒有回報唸完,也一定會做,只做一次)
function vSay(text,done){
  let fired=false;const fin=()=>{if(!fired){fired=true;if(done)done()}};
  if(!('speechSynthesis' in window))return setTimeout(fin,400);
  speak(text,true,fin);setTimeout(fin,2500+String(text).length*450);
}
const micOn=b=>{const m=$('#vmic')||$('#amic');if(m)m.classList.toggle('on',b)};
// 口算問答、問問小老師的結果也記到弱點分析和錯題本
function statAdd(kind,ok){
  const s=S.stat[kind]=S.stat[kind]||{r:0,w:0,due:0};
  s.h=((s.h||'')+(ok?1:0)).slice(-8);
  if(ok){s.r++;s.due=Math.max(0,s.due-1)}else{s.w++;s.due=Math.min(3,s.due+2)}
  save();
}
function hintLine(q){ // 提示:解說的第一句,最後是算式就把得數蓋起來(和一題一題的提示一樣)
  if(!hintable(q))return null;
  const parts=q.teach[0],last=parts[parts.length-1],m=typeof last==='string'&&PURE.test(last)&&last.match(/^(.*= )\d+$/);
  const l=line(m?[...parts.slice(0,-1),m[1]+'?']:parts);l.say=l.say.replace(/等於\s*\?$/,'等於多少?');
  return l;
}

/* ===== 口算問答:小老師把題目唸出來 → 自動開始聽 → 小朋友說答案 → 馬上回應 =====
   一局 8 題,不計時。聽不清楚會請她再說一次;不能用麥克風的地方改用數字鍵盤 */
const VQ_KINDS={1:['add10','sub10','bond','add20','sub20','wAdd1','wSub1','seq1'],2:['mul','mul','add20','sub20','share','wMul','wBuy','seq2','wTime'],
  3:['mul','divE','divE','mulTens','wDiv','wDiv','timeConv','cmMm','divR']}; // 三年級:心算做得來的(九九乘除、整十乘法、簡單換算)
const VQ_N=8;
let V=null,vqSeq=0; // vqSeq:每問一次就加一,而且換一局也不歸零——上一局還沒到時間的事,才不會被當成這一局的
function vquiz(){
  const ks=VQ_KINDS[S.grade]||VQ_KINDS[1],qs=[],seen=new Set();let n=0;
  while(qs.length<VQ_N&&n++<200){const q=genKind(kindById(pick(ks)),'f',1);if(q.type==='f'&&!seen.has(q.say)){seen.add(q.say);qs.push(q)}}
  // ask:每問一次、每換一個狀態就加一,用來讓「唸完以後才開始聽」這種晚一點才發生的事,知道自己是不是已經過期了
  V={qs,i:-1,miss:0,ask:0,noMic:!SR||micOff};sfx.tap();
  show('vquiz',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts" id="vprog"></span></div>
  <div class="row center">${mascot()}<h1>🎤 ${Z(T.vq)}</h1></div>
  <div class="tip center">${Z(T.vqHint)}</div>
  <div id="gres"></div><div class="card" id="vcard" style="margin-top:12px"></div>`);
  vqNext();
}
const vqStat=h=>{const e=$('#vstat');if(e)e.innerHTML=h};
const vqLive=id=>scr==='vquiz'&&V.ask===id&&!V.busy&&!V.pad; // 這件事還算數嗎(沒有離開、沒有換題、沒有改用按的)
function vqNext(){
  if(scr!=='vquiz')return;V.i++;
  if(V.i>=V.qs.length){stopHear();closePad();$('#vcard').remove();return playEnd(V.miss,'vquiz()',T.vqDone)}
  V.tries=0;V.val='';V.unclear=0;V.busy=false;V.pad=false;closePad();
  const q=V.qs[V.i];$('#vprog').textContent=`🎤 ${V.i+1} / ${V.qs.length}`;
  $('#vcard').innerHTML=`
    <div class="row" style="flex-wrap:nowrap"><div class="qno sp">${Z(T.qn1)} ${V.i+1} ${Z(T.qn2)}</div><button class="spk" onclick="vqAsk()">🔊</button></div>
    <div class="prompt">${q.p}</div>${q.v?`<div class="visual">${q.v}</div>`:''}
    <div class="vbox">${V.noMic?'':`<button class="vmic" id="vmic" onclick="vqMic()">🎤</button>`}<div class="vstat" id="vstat"></div></div>
    <div class="fill"><span class="inp" id="vinp" onclick="vqPad()">?</span><span>${q.unit}</span></div>
    <div id="vfb"></div>`;
  vqAsk();
}
function vqAsk(){ // 唸題目,唸完自動開始聽
  if(V.busy)return;
  const id=(V.ask=++vqSeq);stopHear();micOn(false);V.pad=false;closePad();
  vSay(V.qs[V.i].say,()=>{if(vqLive(id)){if(V.noMic){vqStat(Z(T.vqNoMic));vqPad()}else if(V.tapOnly)vqStat(`👆 ${Z(T.vqTap)}`);else vqListen()}});
}
function vqListen(fromTap){
  if(V.busy||V.noMic)return;
  const id=V.ask,q=V.qs[V.i];micOn(true);vqStat(`👂 ${Z(T.listening)}…`);
  hear(t=>vqStat(`👂 ${esc(t)}…`),(alts,err)=>{
    micOn(false);if(!vqLive(id))return;
    if(err==='none'||(err==='denied'&&fromTap)){ // 真的不能用麥克風:收起麥克風,改用按的
      V.noMic=true;if(err==='denied')micOff=true;const b=$('#vmic');if(b)b.remove();
      vqStat(Z(T.vqNoMic));speak(T.vqNoMic[0],true);return vqPad();
    }
    // 自動開始聽卻被擋下來(iPad 常常要先按一下才肯聽):請她按麥克風
    if(err==='denied'){V.tapOnly=true;return vqStat(`👆 ${Z(T.vqTap)}`)}
    for(const a of alts||[]){const v=saidNumber(a,q);if(v!=null){vqStat(`👂 ${Z(T.heard)}:${v}`);return vqCheck(v)}}
    // 聽不出數字:第一次請她再說一次,之後請她按麥克風或用按的
    if(++V.unclear<2){const id2=(V.ask=++vqSeq);vqStat(`👂 ${Z(T.unclear)}`);return vSay(T.unclear[0],()=>{if(vqLive(id2))vqListen()})}
    vqStat(`👆 ${Z(T.vqTap)}`);
  });
}
// 從一句話裡找出小朋友說的答案:取「最後一個」數字,因為她常常會把整句唸出來(「七加五等於十二」要聽成 12,不是 7)
function saidNumber(text,q){
  const s=String(text).replace(/[\s,。,.?!?!]/g,'');
  if(/^[一二兩三四五六七八九][是事市][一二三四五六七八九]?$/.test(s))return matchAnswer(text,q); // 「二十」被聽成「二是」
  const m=norm(s).match(/\d+/g);
  return m?+m[m.length-1]:matchAnswer(text,q); // 沒有數字時,再用同音字試一次(「溜」當成六)
}
function vqMic(){ // 按麥克風:正在聽就停下來,沒在聽就開始聽
  if(V.busy)return;sfx.tap();
  if(rec){(V.ask=++vqSeq);stopHear();micOn(false);return vqStat('')}
  (V.ask=++vqSeq);V.unclear=0;V.pad=false;closePad();vqListen(true);
}
function vqPad(){ // 改用數字鍵盤回答
  if(V.busy)return;(V.ask=++vqSeq);stopHear();micOn(false);V.pad=true;
  $('#vinp').classList.add('act');$('#pad').classList.add('on');document.body.classList.add('padon');
  setTimeout(()=>{const e=$('#vinp');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})},60);
}
function vqKey(k){
  if(!V||V.busy||!V.pad)return;sfx.tap();
  if(k==='del')V.val=V.val.slice(0,-1);else if(k!=='ok'&&V.val.length<4)V.val=V.val==='0'?k:V.val+k;
  $('#vinp').textContent=V.val||'?';
  if(k==='ok'&&V.val){V.pad=false;closePad();vqCheck(+V.val)}
}
function vqCheck(v){
  if(V.busy)return;
  const q=V.qs[V.i],first=V.tries===0,inp=$('#vinp'),id=(V.ask=++vqSeq);
  const next=ms=>()=>setTimeout(()=>{if(scr==='vquiz'&&V.ask===id)vqNext()},ms);
  inp.textContent=v;
  if(v===q.ans){
    V.busy=true;if(first)statAdd(q.kind,true);
    inp.classList.add('good');sfx.ok();mascotAnim('jump');
    const r=inp.getBoundingClientRect();burst(r.left+r.width/2,Math.max(r.top,60),9);
    $('#vfb').innerHTML=q.calc?`<div class="calc"><span>🧮 ${Z(TT.formula)}:</span><b>${q.calc}</b></div>`:'';
    return vSay(pick(first?PRAISE:PRAISE2)[0],next(500));
  }
  sfx.bad();mascotAnim('sad');
  if(first){ // 第一次答錯:給一句提示,再聽一次
    V.tries=1;V.miss++;V.val='';statAdd(q.kind,false);
    const h=hintLine(q);
    $('#vfb').innerHTML=`<div class="teach"><div class="tav">${bunnySvg()}</div><div class="sp"><div class="bubble">${Z(T.again)}</div>${h?`<div class="bubble trap">💡 ${h.h}</div>`:''}</div></div>`;
    setTimeout(()=>{const e=$('#vinp');if(e&&V.ask===id)e.textContent='?'},900);
    return vSay(T.again[0]+(h?h.say:''),()=>{if(scr==='vquiz'&&V.ask===id&&!V.busy&&!V.pad){if(V.noMic)vqPad();else vqListen()}});
  }
  // 第二次還是錯:說出答案,用會動的圖解釋
  V.busy=true;inp.textContent=q.ans;inp.classList.add('good');
  $('#vfb').innerHTML=`<div class="teach"><div class="tav">${bunnySvg()}</div><div class="sp"><div class="bubble so">${Z(T.correctIs)}<span class="ans">${q.ansH}</span></div>${animHtml(q)||(q.calc?`<div class="bubble">🧮 ${q.calc}</div>`:'')}</div></div>`;
  vSay(T.correctIs[0]+q.ans+'。'+(q.calc?sayOps(plain(q.calc)):''),next(1500));
}

/* ===== 問問小老師:小朋友用說的問一題加、減、乘(例如「八加七是多少」),小老師回答,並用會動的圖解釋 =====
   不能用麥克風的時候,點畫面上的範例問題也可以 */
const QA={q:['是多少?','ㄕˋ ㄉㄨㄛ ㄕㄠˇ'],youAsk:['你問:','ㄋㄧˇ ㄨㄣˋ'],
  make10a:['先湊成 10','ㄒㄧㄢ ㄘㄡˋ ㄔㄥˊ'],make10b:['再加上剩下的','ㄗㄞˋ ㄐㄧㄚ ㄕㄤˋ ㄕㄥˋ ㄒㄧㄚˋ ˙ㄉㄜ']};
const OPW={'+':['加','ㄐㄧㄚ'],'−':['減','ㄐㄧㄢˇ'],'×':['乘以','ㄔㄥˊ ㄧˇ']};
// 「加、減、乘」常被聽成的同音字
const ASK_HOMO={家:'加',佳:'加',嘉:'加',夾:'加',剪:'減',撿:'減',簡:'減',檢:'減',成:'乘',城:'乘',程:'乘',呈:'乘',承:'乘'};
function parseAsk(text){ // 從一句話裡找出「數字 加/減/乘 數字」,找不到回傳 null
  const find=s=>{
    const t=norm(s),m=t.match(/(\d+)(加上|加|\+|＋|減去|減掉|減|-|－|−|乘以|乘上|乘|×|x|X|\*)(\d+)/);
    if(m)return {a:+m[1],op:/加|\+|＋/.test(m[2])?'+':/乘|×|x|X|\*/.test(m[2])?'×':'−',b:+m[3]};
    const g=t.match(/(\d+)個(\d+)/); // 「三個五」就是 5 × 3
    return g?{a:+g[2],op:'×',b:+g[1]}:null;
  };
  return find(text)||find([...String(text)].map(c=>ASK_HOMO[c]||c).join(''));
}
let A=null;
const aStat=h=>{const e=$('#astat');if(e)e.innerHTML=h};
function askT(){
  sfx.tap();A=null;
  show('ask',`
  <div class="row">${homeBtn()}<span class="sp"></span></div>
  <div class="row center">${mascot()}<h1>🙋 ${Z(T.askTitle)}</h1></div>
  <div class="card">
    <div class="teach" style="margin-top:0"><div class="tav">${bunnySvg()}</div><div class="sp"><div class="bubble">${Z(T.askHi)}</div></div></div>
    <div class="vbox">${SR&&!micOff?`<button class="vmic" id="amic" onclick="askMic()">🎤</button>`:''}<div class="vstat" id="astat"></div></div>
    <div class="tip center" style="margin:6px 0">👇 ${Z(T.askTry)}</div>
    <div class="kinds" id="achips" style="justify-content:center"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn ghost small" onclick="sfx.tap();askChips()">🔄 ${Z(T.askMore)}</button></div>
  </div>
  <div id="aans"></div>`);
  askChips();setTimeout(()=>{if(scr==='ask')speak(T.askHi[0])},300);
}
function askChips(){ // 幾個可以直接點的範例問題,跟著年級出
  const add=(lo,hi)=>{const s=R(lo,hi),a=R(1,s-1);return {a,op:'+',b:s-a}},sub=(lo,hi)=>{const a=R(lo,hi);return {a,op:'−',b:R(1,Math.min(a-1,9))}},mul=()=>({a:R(2,9),op:'×',b:R(2,9)});
  const ex=S.grade>=2?[mul(),mul(),{a:R(11,60),op:'+',b:R(11,39)},sub(21,99)]:[add(11,18),add(3,10),sub(11,20),sub(3,10)];
  $('#achips').innerHTML=ex.map(p=>`<button class="kindb" onclick="askAnswer({a:${p.a},op:'${p.op}',b:${p.b}})">${line([p.a,OPW[p.op],p.b,QA.q]).h}</button>`).join('');
}
function askSay(p){$('#aans').innerHTML=`<div class="card" style="margin-top:12px"><div class="teach" style="margin-top:0"><div class="tav">${bunnySvg()}</div><div class="sp"><div class="bubble">${Z(p)}</div></div></div></div>`;speak(p[0],true)}
function askMic(){
  sfx.tap();
  if(rec){stopHear();micOn(false);return aStat('')}
  micOn(true);aStat(`👂 ${Z(T.listening)}…`);
  hear(t=>aStat(`👂 ${esc(t)}…`),(alts,err)=>{
    micOn(false);if(scr!=='ask')return;
    if(err==='denied'||err==='none'){micOff=true;const b=$('#amic');if(b)b.remove();aStat('');return askSay(T.askNoMic)}
    for(const a of alts||[]){const p=parseAsk(a);if(p){aStat(`👂 ${esc(a)}`);return askAnswer(p)}}
    aStat(alts&&alts[0]?`👂 ${esc(alts[0])}`:'');askSay(T.askNo);
  });
}
function askAnswer(p){
  const {a,op,b}=p;
  if(a>999||b>999||(op==='×'&&(a>12||b>12)))return askSay(T.askBig);
  if(op==='−'&&a<b)return askSay(T.askNeg);
  const r=op==='+'?a+b:op==='−'?a-b:a*b,calc=`${a} ${op} ${b} = ${r}`,small=Math.max(a,b,r)<=20;
  // 解說用哪一種圖:乘法是一組一組、20 以內是圓點、再大就用直式;prac 是「我也要練習」會出的題型
  let kind,prac,teach;
  if(op==='×'){kind=prac='mul';teach=[[a,TT.times,b,TT.is,b,TT.ge,a,TT.addUp,'。']]}
  else if(small){
    kind=op==='+'?'add20':'sub20';prac=(op==='+'?'add':'sub')+(Math.max(a,r)<=10?10:20);
    if(op==='+'&&a<10&&b<10&&r>10){const x=Math.max(a,b),n=10-x,y=Math.min(a,b)-n;teach=[[QA.make10a,':',`${x} + ${n} = 10`],[QA.make10b,y,':',`10 + ${y} = ${r}`]]} // 湊十法:大的那個數先湊成 10(和圖一樣)
    else if(op==='−'&&a>10&&a<20&&b<10&&a%10<b)teach=[[MK.breakTen]]; // 破十法
    else teach=[[TT.from,a,op==='+'?TT.countOn:TT.takeAway,b,TT.ge,'。']];
  }else{kind=op==='+'?'add2':'sub2';prac=(op==='+'?'add':'sub')+(Math.max(a,b,r)<100?2:3);teach=[[A3.tip]]}
  const ls=teach.map(line);
  A={say:[sayOps(`${a} ${op} ${b}`)+'等於'+r,...ls.map(l=>l.say)].join('。').replace(/([。!?!?])。/g,'$1')};
  $('#aans').innerHTML=`<div class="card" style="margin-top:12px"><div class="teach" style="margin-top:0"><div class="tav">${bunnySvg()}</div><div class="sp">
    <div class="bubble trap">${Z(QA.youAsk)} ${a} ${op} ${b} = ?</div>${ls.map(l=>`<div class="bubble">${l.h}</div>`).join('')}
    ${animHtml({kind,calc})}
    <div class="bubble so">${Z(T.so)}<span class="ans">${r}</span></div>
    <div class="row"><button class="btn purple small" onclick="speak(A.say,true)">🔊 ${Z(T.hearTeach)}</button>
      <button class="btn small" onclick="start('k:${prac}')">✏️ ${Z(T.askMe)}</button></div></div></div></div>`;
  sfx.ok();mascotAnim('jump');speak(A.say,true);
  $('#aans').scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ==================== v4:三年級 ====================
   十個單元:一萬以內的數、四位數加減、乘法、除法、分數、小數、公斤和公升(含毫米)、時間、周長和面積、應用題。
   出題的方式和一、二年級一樣:每一種小題型一個產生器,回傳題目、答案和解說(解說第一句是重點,會當成提示)。
   分數和小數沒辦法用數字鍵盤打,所以那幾種是選擇題,或是只填分子、填「幾個 0.1」 */
Object.assign(T,{g3:['三年級','ㄙㄢ ㄋㄧㄢˊ ㄐㄧˊ']});

const exprSm=s=>`<div class="expr sm">${s}</div>`; // 比較長的算式用小一號的字,手機上才放得下

/* ----- 一萬以內的數 ----- */
const PLACES4=[['千','ㄑㄧㄢ'],['百','ㄅㄞˇ'],['十','ㄕˊ'],['個','ㄍㄜˋ']];
function gPlace4(type){ // 5281 的百位數字是多少
  const n=R(1001,9999),i=R(0,3),s=String(n),pl=PLACES4[i],terms=[s[0]*1000,s[1]*100,s[2]*10,+s[3]].filter(x=>x);
  return num(zy(`${n} 的${pl[0]}位數字是多少?`,`˙ㄉㄜ ${pl[1]} ㄨㄟˋ ㄕㄨˋ ㄗˋ ㄕˋ ㄉㄨㄛ ㄕㄠˇ`),expr(n),+s[i],type,
    {say:`${n} 的${pl[0]}位數字是多少`,wrong:digitOpts(+s[i],[...s].map(Number)),ex:`${n} = ${terms.join(' + ')}`,
     teach:[[n,TT.has,+s[0],G3.h1000,'、',+s[1],TT.h100,'、',+s[2],TT.h10,'、',+s[3],TT.h1,'。']]});
}
function gCmp4(){const q=gCompare(1000,9999);q.teach=[[G3.cmp4]];return q}
function gSign3(){const q=gSign(1000,9999);if(q.teach.length>1)q.teach[1]=[G3.cmp4];return q}

/* ----- 四位數加減(填數字時用直式一位一位填) ----- */
function gAdd4(type,op){
  let a,b;if(op){a=R(1000,8000);b=R(100,9999-a)}else{a=R(2000,9999);b=R(100,a-1)}
  const r=op?a+b:a-b,sym=op?'+':'−';
  return num(Z(T.calc),exprSm(`${a} ${sym} ${b} = ?`),r,type,{say:`${a} ${op?'加':'減'} ${b} 等於多少`,ds:[1,10,100,1000],calc:`${a} ${sym} ${b} = ${r}`,teach:[[A3.tip]]});
}

/* ----- 乘法 ----- */
function gMul21(type){ // 兩位數 × 一位數:把兩位數拆成幾十和幾,分開乘再加起來
  let a;do{a=R(12,99)}while(a%10===0);
  const b=R(2,9),t=a-a%10,o=a%10,r=a*b;
  return num(Z(T.calc),expr(`${a} × ${b} = ?`),r,type,{say:`${a} 乘以 ${b} 等於多少`,ds:[1,10,b],calc:`${a} × ${b} = ${r}`,
    teach:[[TT.put,a,G3.into,t,TT.and,o,'。'],[`${t} × ${b} = ${t*b}`],[`${o} × ${b} = ${o*b}`],[`${t*b} + ${o*b} = ${r}`]]});
}
function gMulTens(type){ // 整十、整百 × 一位數
  const z=pick([10,100]),k=R(1,9),a=k*z,b=R(2,9),r=a*b;
  return num(Z(T.calc),expr(`${a} × ${b} = ?`),r,type,{say:`${a} 乘以 ${b} 等於多少`,ds:[z,z*10,k],calc:`${a} × ${b} = ${r}`,
    teach:[[G3.zeroTip],[`${k} × ${b} = ${k*b}`]]});
}

/* ----- 除法 ----- */
function gDivE(type){ // 九九乘法範圍內、除得盡的
  const b=R(2,9),q=R(2,9),a=b*q;
  return num(Z(T.calc),expr(`${a} ÷ ${b} = ?`),q,type,{say:`${a} 除以 ${b} 等於多少`,ds:[1,2],calc:`${a} ÷ ${b} = ${q}`,
    teach:[[SH.think,b,SH.times,a,'?'],[`${b} × ${q} = ${a}`]]});
}
function gDivR(type){ // 有餘數:有時候問商,有時候問餘數
  const b=R(2,9),q=R(2,9),r=R(1,b-1),a=b*q+r,askQ=R(0,1);
  return num(Z(BOXT.q),exprSm(askQ?`${a} ÷ ${b} = □ … ${r}`:`${a} ÷ ${b} = ${q} … □`),askQ?q:r,type,
    {say:`${a} 除以 ${b},${askQ?'商':'餘數'}是多少`,ds:[1,2],calc:`${a} ÷ ${b} = ${q} … ${r}`,
     teach:[[G3.remTip],[`${b} × ${q} = ${b*q}`],[`${a} − ${b*q} = ${r}`]]});
}

/* ----- 分數(同分母) ----- */
const frac=(n,d)=>`<span class="fr2"><b>${n}</b><i>${d}</i></span>`,fracSay=(n,d)=>`${d}分之${n}`;
function fracBar(n,d,col='#ff9ec4'){ // 一條分成 d 份、塗了 n 份的長條
  const w=240/d;let t='';
  for(let i=0;i<d;i++)t+=`<rect x="${4+i*w}" y="4" width="${w}" height="46" fill="${i<n?col:'#fff'}" stroke="#5a4a63" stroke-width="3"/>`;
  return `<svg viewBox="0 0 248 54" style="width:100%;max-width:320px;display:block;margin:4px auto">${t}</svg>`;
}
function gFracRead(){ // 看圖說出幾分之幾
  const d=R(2,8),n=R(1,d-1),seen=new Set([n+'/'+d]),opts=[{n,d,ok:true}];
  for(const [a,b] of shuffle([[d-n,d],[n,d+1],[n+1,d+1],[1,d],[d-1,d]]))if(opts.length<3&&a>0&&a<b&&!seen.has(a+'/'+b)){seen.add(a+'/'+b);opts.push({n:a,d:b})}
  const q=lab(Z(G3.fracQ),fracBar(n,d),opts.map(o=>({h:frac(o.n,o.d),s:fracSay(o.n,o.d),ok:!!o.ok})),{say:'塗色的部分是全部的幾分之幾',teach:[[G3.fracTip]]});
  q.ansS=fracSay(n,d);return q;
}
function gFracCmp(){ // 分母一樣,比分子
  const d=R(3,9),[a,b]=shuffle(Array.from({length:d-1},(_,i)=>i+1)).slice(0,2),big=R(0,1),t=big?Math.max(a,b):Math.min(a,b);
  const q=lab(Z(big?G3.bigger:G3.smaller),`<div style="width:100%;max-width:320px">${fracBar(a,d)}${fracBar(b,d,'#9be3c9')}</div>`,
    [a,b].map(n=>({h:frac(n,d),s:fracSay(n,d),ok:n===t})),{say:`${fracSay(a,d)}和${fracSay(b,d)},哪一個比較${big?'大':'小'}`,teach:[[big?G3.sameDen:G3.sameDenS]]});
  q.ansS=fracSay(t,d);return q;
}
function gFracAdd(){ // 同分母加減:只填分子
  const d=R(3,9),add=R(0,1);let a,b;
  if(add){a=R(1,d-2);b=R(1,d-1-a)}else{a=R(2,d-1);b=R(1,a-1)}
  const r=add?a+b:a-b,sym=add?'+':'−',eq=`${a} ${sym} ${b} = ${r}`;
  return num(Z(G3.fracFill),exprSm(`${frac(a,d)} ${sym} ${frac(b,d)} = ${frac('?',d)}`),r,'f',
    {say:`${fracSay(a,d)}${add?'加':'減'}${fracSay(b,d)},答案的分子是多少`,calc:eq,teach:[[add?G3.fracAddTip:G3.fracSubTip],[eq]]});
}

/* ----- 小數(一位小數;程式裡用「幾個 0.1」來算,才不會有 0.1 + 0.2 = 0.30000000000000004 這種誤差) ----- */
const dec1=n=>(n/10).toFixed(1);
function gDecTenths(type){ // 1.3 是幾個 0.1
  const n=R(2,29);
  return num(zy(`${dec1(n)} 是幾個 0.1?`,'ㄕˋ ㄐㄧˇ ˙ㄍㄜ'),expr(dec1(n)),n,type,{unit:Z(TT.ge),say:`${dec1(n)} 是幾個零點一`,ds:[1,10],teach:[[G3.decTip]]});
}
function gDecCmp(){
  const s=new Set();while(s.size<3)s.add(R(1,39));
  const a=[...s],big=R(0,1),t=big?Math.max(...a):Math.min(...a);
  return lab(Z(big?T.max:T.min),'',a.map(n=>({h:dec1(n),ok:n===t})),{say:big?'哪一個數最大':'哪一個數最小',calc:[...a].sort((x,y)=>x-y).map(dec1).join(' &lt; '),teach:[[G3.decCmpTip]]});
}
function gDecAdd(){
  const add=R(0,1);let a,b;if(add){a=R(1,19);b=R(1,19)}else{a=R(5,29);b=R(1,a-1)}
  const r=add?a+b:a-b,sym=add?'+':'−',wrong=shuffle([dec1(r+1),dec1(Math.abs(r-1)),String(r),dec1(r+10)]).filter(x=>x!==dec1(r)).slice(0,2);
  return lab(Z(T.calc),exprSm(`${dec1(a)} ${sym} ${dec1(b)} = ?`),[dec1(r),...new Set(wrong)].map(h=>({h,ok:h===dec1(r)})),
    {say:`${dec1(a)} ${add?'加':'減'} ${dec1(b)} 等於多少`,calc:`${dec1(a)} ${sym} ${dec1(b)} = ${dec1(r)}`,teach:[[G3.decAddTip],[a,G3.tenth,` ${sym} `,b,G3.tenth,' → ',r,G3.tenth]]});
}

/* ----- 單位換算:公斤公克、公升毫升、公分毫米、時間。B 大單位、Sm 小單位、f 一個大單位是幾個小單位 ----- */
function gConv(type,B,Sm,f,e){
  const v=`<div class="story">${e}</div>`,k=R(0,2),a=R(1,9),IS=['是幾','ㄕˋ ㄐㄧˇ'],rule=[1,B,['是','ㄕˋ'],f,Sm,'。'],ds=[f,Math.max(1,f/10),1];
  if(k===0){const p=line([a,J(B,IS,Sm),'?']);return num(p.h,v,a*f,type,{unit:Z(Sm),say:p.say,ds,teach:[rule,[`${f} × ${a} = ${a*f}`]]})}
  if(k===1){const p=line([a*f,J(Sm,IS,B),'?']);return num(p.h,v,a,type,{unit:Z(B),say:p.say,ds:[1,2],teach:[rule,[`${f} × ${a} = ${a*f}`]]})}
  const b=f===10?R(1,9):R(1,9)*(f/10),p=line([a,B,b,J(Sm,IS,Sm),'?']);
  return num(p.h,v,a*f+b,type,{unit:Z(Sm),say:p.say,ds,teach:[rule,[`${a*f} + ${b} = ${a*f+b}`]]});
}

function rectSvg(w,h,grid){ // 畫長方形;grid:畫成方格(面積用),不然就標出兩個邊的長度(周長用)
  const u=Math.min(30,Math.floor(200/Math.max(w,h))),W=w*u,H=h*u;let g='';
  if(grid){
    for(let i=1;i<w;i++)g+=`<line x1="${30+i*u}" y1="10" x2="${30+i*u}" y2="${10+H}" stroke="#5a4a63" stroke-width="1"/>`;
    for(let j=1;j<h;j++)g+=`<line x1="30" y1="${10+j*u}" x2="${30+W}" y2="${10+j*u}" stroke="#5a4a63" stroke-width="1"/>`;
  }else g=`<text x="${30+W/2}" y="${H+34}" text-anchor="middle" font-size="18" font-weight="700" fill="#5a4a63">${w} 公分</text>
    <text x="${W+38}" y="${10+H/2+6}" font-size="18" font-weight="700" fill="#5a4a63">${h} 公分</text>`;
  return `<svg viewBox="0 0 ${W+110} ${H+44}" style="width:100%;max-width:${W+110}px"><rect x="30" y="10" width="${W}" height="${H}" fill="${grid?'#fff3c9':'#c9f3e2'}" stroke="#5a4a63" stroke-width="3"/>${g}</svg>`;

/* ==================== 難度分層:每一種題型都混「基本、標準、挑戰」三種難度,分數才有鑑別度 ====================
   大約 1/4 基本(讓孩子有把握)、1/2 標準(該年級應該會的)、1/4 挑戰(真的熟練才答得對)。
   二年級特別調整:進位/借位為主、九九乘法以 3、4、6、7、8、9 為主、比大小的數字很接近、數列會跨過整百或倒著數、
   寫功課的時間要算到「幾點幾分」。三年級:除法用大一點的數、小數要進位/借位、四位數比大小很接近 */
const tier=()=>{const r=Math.random();return r<.25?0:r<.75?1:2};
const setGen=(id,f)=>{const k=kindById(id);if(k)k.gen=f};
const until=(f,ok,n=80)=>{let q;for(let i=0;i<n;i++){q=f();if(ok(q))return q}return q}; // 重出到符合條件為止(最多 n 次)
const opsOf=q=>{const m=String(q.calc||'').match(/(\d+(?:\.\d)?) ([+−×÷]) (\d+(?:\.\d)?)/);return m?[+m[1],m[2],+m[3]]:null};
const DF={eachLess:['每次都少','ㄇㄟˇ ㄘˋ ㄉㄡ ㄕㄠˇ'],dian:['點','ㄉㄧㄢˇ'],fen:['分','ㄈㄣ'],minutes:['分鐘','ㄈㄣ ㄓㄨㄥ'],
  startAt:['分開始寫功課','ㄈㄣ ㄎㄞ ㄕˇ ㄒㄧㄝˇ ㄍㄨㄥ ㄎㄜˋ'],doneAt:['點幾分寫完?','ㄉㄧㄢˇ ㄐㄧˇ ㄈㄣ ㄒㄧㄝˇ ㄨㄢˊ'],
  hourTip:['一小時是 60 分鐘,超過 60 分就進到下一點。','ㄧˋ ㄒㄧㄠˇ ㄕˊ ㄕˋ ㄈㄣ ㄓㄨㄥ ㄔㄠ ㄍㄨㄛˋ ㄈㄣ ㄐㄧㄡˋ ㄐㄧㄣˋ ㄉㄠˋ ㄒㄧㄚˋ ㄧˋ ㄉㄧㄢˇ']};
// 比大小用的數:基本題隨便抽;標準題最高位一樣;挑戰題前兩位一樣,再放一個「後兩位對調」的陷阱(46 和 64)
function nearNums(lo,hi,k){
  const tr=tier(),d=String(hi-1).length-1,s=new Set(),a=R(Math.max(lo,10**d),hi-1);s.add(a);
  if(tr===2){const t=String(a),sw=+(t.slice(0,-2)+t.slice(-1)+t.slice(-2,-1));if(sw!==a&&sw>=lo&&sw<=hi&&String(sw).length===t.length)s.add(sw)}
  const unit=tr===0?0:10**(tr===2&&d>=2?d-1:d);let g=0;
  while(s.size<k&&g++<200){const b=unit?Math.floor(a/unit)*unit+R(0,unit-1):R(lo,hi);if(b>=lo&&b<=hi)s.add(b)}
  while(s.size<k)s.add(R(lo,hi));
  return shuffle([...s]).slice(0,k);
}
function gCompareX(lo,hi,tip){
  const a=nearNums(lo,hi,3),big=R(0,1),t=big?Math.max(...a):Math.min(...a);
  return lab(Z(big?T.max:T.min),'',a.map(n=>({h:String(n),ok:n===t})),{say:big?'哪一個數最大':'哪一個數最小',calc:[...a].sort((x,y)=>x-y).join(' &lt; '),teach:[[tip]]});
}
function gSignX(lo,hi,tip){
  const [x,y]=nearNums(lo,hi,2),a=x,b=R(0,9)<2?a:y,sym=a>b?'&gt;':a<b?'&lt;':'=';
  const q=lab(Z(SG.q),expr(`${a} ○ ${b}`),[['&gt;',SG.big],['&lt;',SG.small],['=',SG.eq]].map(([s,n])=>({h:`${s} ${Z(n)}`,s:n[0],ok:s===sym})),
    {say:`${a} 和 ${b},圈圈裡面要填大於、小於,還是等於`,calc:`${a} ${sym} ${b}`,teach:a===b?[[SG.same]]:[[SG.tip],[tip]]});
  q.ansS=q.opts.find(o=>o.ok).s;return q;
}
// 數列:基本題整十整百往上數;標準題 5、25、50 一跳,而且會跨過整百(整千);挑戰題有一半倒著數
function gSeqX(type,max,big){
  const tr=tier(),down=tr===2&&R(0,1),unit=big?1000:100,st=tr===0?pick(big?[100,1000]:[10,100]):pick(big?[25,50,250]:[5,25,50]);
  let a,ans;
  if(down){const r=R(3*st,max);a=r-r%5;if(a-3*st<0)a=3*st;ans=a-3*st}
  else if(tr===0){a=R(0,Math.floor((max-3*st)/st))*st;ans=a+3*st}
  else{a=R(1,Math.floor((max-3*st)/unit))*unit-st*R(1,2);if(a<0)a=st;ans=a+3*st}
  const s=down?[a,a-st,a-2*st]:[a,a+st,a+2*st],e=(ans>=1000||big?exprSm:expr)(`${s.join(', ')}, ?`);
  return num(Z(T.seq),e,ans,type,{say:`${s.join('、')},接下來是多少`,ds:[st,2*st,1],
    teach:[[down?DF.eachLess:TT.eachMore,st,'。'],[down?`${s[2]} − ${st} = ${ans}`:`${s[2]} + ${st} = ${ans}`]]});
}

const D10=(x,k)=>Math.floor(x/10**k)%10;
function addSubSteps(a,op,b){ // 直式加減:回傳 teach 的每一行
  const r=op==='+'?a+b:a-b,n=Math.max(String(a).length,String(b).length),L=[];let c=0;
  for(let k=0;k<n;k++){
    const da=D10(a,k),hasB=b>=10**k||k===0,db=hasB?D10(b,k):0,P=PL[k],Pn=PL[k+1]||PL[k];

      L.push([P,':',hasB?`${hasA?da:0} + ${db}${c?' + 1':''} = ${s}`:`${da} + 1 = ${s}`]);
      c=s>=10?1:0;if(c)L.push([AS.write,s%10,',',AS.carry1,Pn]);

      else if(c)L.push([P,':',da,AS.lent,`${da} − 1 = ${da-1}`]);
      else if(need)L.push([P,':',da,AS.notEnough,db,',',AS.toward,Pn,AS.borrow1,P,AS.become,`${da} + 10 = ${da+10}`]);
      const t=top+need*10;

}
function tenSteps(a,op,b){ // 一年級:湊十(9 + 5)、破十(13 − 8);不適用就回傳 null

    return [[x,AS.need,n,AS.make10,AS.split,y,AS.into,n,AS.and,m],[AS.first10,`${x} + ${n} = 10`],[AS.then,`10 + ${m} = ${a+b}`]]}

    return [[AS.split,a,AS.into,10,AS.and,o],[AS.from10,`10 − ${b} = ${10-b}`],[AS.join,o,AS.joinB,`${10-b} + ${o} = ${a-b}`]]}

function longDiv(a,b){ // 直式除法的每一步(從最高位一位一位除)
  const ds=String(a).split('').map(Number),st=[];let cur=0,qs='';
  ds.forEach((d,i)=>{cur=cur*10+d;if(!st.length&&cur<b&&i<ds.length-1)return;const qd=Math.floor(cur/b),p=qd*b;st.push({i,cur,qd,p,r:cur-p});qs+=qd;cur-=p});

  const D=longDiv(a,b),L=[];

    L.push([s.cur,LD.h1,b,'? ',LD.think,`${b} × ${s.qd} = ${s.p}`]);
    L.push([LD.sub,`${s.cur} − ${s.p} = ${s.r}`]);

function longDivHtml(a,b){ // 直式除法的圖:商在上面,除數在左邊,下面一層一層是乘出來的數和剩下的數

function stepify(q,id){ // 出完題目後,把解說換成一步一步的算法

  const m=String(q.calc||'').replace(/\s/g,'').match(/^(\d+)([+−÷])(\d+)=(\d+)(?:…(\d+))?$/);if(!m)return;
  const a=+m[1],op=m[2],b=+m[3],keep=/^w/.test(id)&&q.teach[0]?[q.teach[0]]:[]; // 應用題保留第一句提示(例如「合起來要用加的」)
  let L=null;
  if(STEP_DIV.test(id)&&op==='÷'){L=divSteps(a,b);q.ex=longDivHtml(a,b)}
  else if(STEP_TEN.test(id)&&op!=='÷')L=tenSteps(a,op,b);
  else if(STEP_AS.test(id)&&op!=='÷'&&Math.max(a,b)>=10)L=addSubSteps(a,op,b);
  if(!L)return;
  q.teach=[...keep,...L];q.full=true;
}
function stepTeachHtml(q,i,right){ // 步驟卡:每一步都列出來,不收起來
  const ls=q.teach.map(line),open=right?T.teachOpenOk:T.teachOpen,trap=right?null:TRAP[(q.traps||{})[givenVal(i)]];
  const an=animHtml(q),pic=an||(q.ex?`<div class="explain">${q.ex}</div>`:'');
  q.teachSay=[open[0],trap&&trap.tip[0],...ls.map(l=>l.say),T.so[0]+(q.ansS||plain(q.ansH))].filter(Boolean).join('。').replace(/([。!?!?])。/g,'$1');
  q.moreSay='';
  return `<div class="teach"><div class="tav">${bunnySvg()}</div><div class="sp">
    ${trap?`<div class="bubble trap">💡 ${Z(trap.tip)}</div>`:''}${pic}
    <ol class="stepcard">${ls.map(l=>`<li>${l.h}</li>`).join('')}</ol>
    <div class="bubble so">${Z(T.so)}<span class="ans">${q.ansH}</span></div>

const FB={q:['照著算法,□ 裡要填多少?','ㄓㄠˋ ˙ㄓㄜ ㄙㄨㄢˋ ㄈㄚˇ ㄌㄧˇ ㄧㄠˋ ㄊㄧㄢˊ ㄉㄨㄛ ㄕㄠˇ']};
function stepFill(head,L,pickable){ // L:步驟;pickable:可以挖空的那幾行(最後是「= 數字」)
  const idx=L.map((l,k)=>k).filter(k=>pickable(L[k])),k=pick(idx),last=L[k][L[k].length-1],mm=last.match(/^(.*= )(\d+)$/),ans=+mm[2];
  const shown=[...L.slice(0,k),[...L[k].slice(0,-1),mm[1]+'□']];
  return {ans,eq:last,v:`${head}<ol class="stepcard fill">${shown.map(l=>`<li>${line(l).h}</li>`).join('')}</ol>`};
}
const eqEnd=l=>{const x=l[l.length-1];return typeof x==='string'&&/= \d+$/.test(x)};
function gTenFill(){ // 一年級:湊十、破十的步驟填空
  let a,b,op,L;do{op=R(0,1)?'+':'−';if(op==='+'){a=R(2,9);b=R(11-a,9)}else{a=R(11,18);b=R(a-9,9)}L=tenSteps(a,op,b)}while(!L);
  const f=stepFill(expr(`${a} ${op} ${b} = ?`),L,eqEnd);
  return num(Z(FB.q),f.v,f.ans,'f',{say:`${a} ${op==='+'?'加':'減'} ${b},照著算法,框框裡要填多少`,ds:[1,2],teach:L,calc:f.eq}); // 答對時列出她填的那一步
}
function gColFill(op){ // 二年級:進位、借位的步驟填空(大多是兩位數,偶爾三位數)

  const L=addSubSteps(a,op,b),f=stepFill(`<div class="expr">${a} ${op} ${b} = ?</div>`,L.slice(0,-1),eqEnd);

}
function gDivFill(){ // 三年級:直式除法的步驟填空
  const b=R(3,9),q=R(4,9),r=R(0,b-1),a=b*q+r,L=divSteps(a,b),f=stepFill(`<div class="expr">${a} ÷ ${b}</div>`,L.slice(0,-1),eqEnd);

function e2Add(type,h){ // 10 以內加法:難題是連加、□ 填空、交換相加
  if(!h)return gAdd(type,2,10,1);
  const k=R(0,2);
  if(k===0){let a,b,c;do{a=R(1,6);b=R(1,5);c=R(1,5)}while(a+b+c>10);const s=a+b+c;
    return e2Fx(`${a} + ${b} + ${c} = ?`,s,type,`${a} 加 ${b} 加 ${c} 等於多少`,'',[[E2.inOrder],[`${a} + ${b} = ${a+b}`],[`${a+b} + ${c} = ${s}`]])}
  if(k===1){const c=R(3,10),a=R(1,c-1),b=c-a,left=R(0,1),v=left?`□ + ${b} = ${c}`:`${a} + □ = ${c}`,ans=left?a:b;
    return e2Fx(v,ans,type,`${v.replace('□','框框')},框框是多少`,`${c} − ${left?b:a} = ${ans}`,[[E2.boxTip],[`${c} − ${left?b:a} = ${ans}`]])}
  const a=R(1,8),b=R(1,10-a); // a + b = b + □
  return e2Fx(`${a} + ${b} = ${b} + □`,a,type,`${a} 加 ${b} 等於 ${b} 加框框`,'',[[E2.swapTip],[`${a} + ${b} = ${a+b}`],[`${b} + ${a} = ${a+b}`]]);
}
function e2Sub(type,h){ // 10 以內減法:難題是連減、加減混合、□ 填空
  if(!h)return gAdd(type,2,10,0);
  const k=R(0,2);
  if(k===0){let a,b,c;do{a=R(5,10);b=R(1,5);c=R(1,5)}while(a-b-c<0);const r=a-b-c;
    return e2Fx(`${a} − ${b} − ${c} = ?`,r,type,`${a} 減 ${b} 減 ${c} 等於多少`,'',[[E2.inOrder],[`${a} − ${b} = ${a-b}`],[`${a-b} − ${c} = ${r}`]])}
  if(k===1){let a,b,c;do{a=R(1,7);b=R(1,6);c=R(1,9)}while(a+b>10||c>a+b);const r=a+b-c;
    return e2Fx(`${a} + ${b} − ${c} = ?`,r,type,`${a} 加 ${b} 減 ${c} 等於多少`,'',[[E2.inOrder],[`${a} + ${b} = ${a+b}`],[`${a+b} − ${c} = ${r}`]])}
  const a=R(3,10),b=R(1,a-1),c=a-b,left=R(0,1),v=left?`□ − ${b} = ${c}`:`${a} − □ = ${c}`,ans=left?a:b,calc=left?`${c} + ${b} = ${a}`:`${a} − ${c} = ${b}`;
  return e2Fx(v,ans,type,`${v.replace('□','框框')},框框是多少`,calc,[[left?BOXT.back:BOXT.whole],[calc]]);
}
function e2Word(type,h){ // 10 以內的加減應用題:難題是兩步驟、比多幾個

function e2Num(type,h){ // 30 以內的數:十位和個位、數的順序、比大小

  return num(p.h,'',mids.length,type,{say:p.say,ds:[1,2],wrong:[mids.length+1],teach:[[mids.join('、')]]});
}
function e2Clock(type,h){ // 整點和半點:難題是不看圖、用長短針的位置判斷,或再過 1 小時
  if(!h)return gClock1(type);

function e2TF(){ // 二段是非題:算式對不對、十位和個位、下一個數、形狀的邊、時鐘
  const truth=R(0,1)===1,hard=Math.random()<E1_HARD,k=R(0,5);let parts,v='',teach;
  if(k<=1){let a,b,r,s;if(k===0){a=R(1,8);b=R(1,10-a);r=a+b;s=`${a} + ${b}`}else{a=R(2,10);b=R(1,a);r=a-b;s=`${a} − ${b}`}
    let m=r;if(!truth){do{m=r+(hard?pick([-1,1]):pick([-2,2,3]))}while(m===r||m<0||m>10)}
    parts=[E2.formula];v=expr(`${s} = ${m}`);teach=[[`${s} = ${r}`]]}
  else if(k===2){const a=R(1,2),b=R(1,9),n=a*10+b;let [x,y]=[a,b];if(!truth){if(hard&&a!==b)[x,y]=[b,a];else x=a===1?2:1}
    parts=[n,E2.is,x,E2.ten,y,E2.one];teach=[[n,TT.has,a,TT.h10,'、',b,TT.h1,'。']]}
  else if(k===3){const n=R(9,29);let m=n+1;if(!truth){do{m=n+1+(hard?pick([-1,1]):pick([-2,2]))}while(m===n+1)}parts=[n,EXAM_T.next,m];teach=[[`${n} + 1 = ${n+1}`]]}
  else if(k===4){const s=pick(SHAPES.filter(x=>x.sides));let m=s.sides;if(!truth){do{m=s.sides+pick([-1,1])}while(m===s.sides)}

  else{const t=R(1,12),half=hard?R(0,1):0;let [x,hf]=[t,half];if(!truth){if(hard&&!half)hf=1;else x=t%12+1}
    parts=[E2.clockIs,x,T.dian,...(hf?[T.ban]:[])];v=clockSvg(t,half?30:0);teach=[[half?TT.half:TT.whole],[TT.shortHand]]}

}

  return num(p.h,`<div class="expr sm subst">${v}</div>`,ans,type,{say:'每一種水果代表一個數,問號是多少',ds:[1,2,3],teach});

  const c=R(3,4),d=c===3?R(2,3):R(2,3),digs=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,c).sort(),f=Array.from({length:d},(_,i)=>c-i),ans=f.reduce((x,y)=>x*y,1);

function duelTap(e,i,j){

  const freeze=()=>{p.frz=Date.now()+DUEL_FREEZE;sfx.bad();duelDraw(i);setTimeout(()=>{if(DU&&DU.p[i]===p)duelDraw(i)},DUEL_FREEZE+30)};
  if(DU.game==='bln'){
    const x=p.r.items[j];if(!x||x.done)return;x.done=true;
    if(x.v!==p.r.t){duelDraw(i);return freeze()}

  if(p.q.opts[j]!==p.q.a)return freeze();
  sfx.ok();DU.pos+=i?-1:1;duelMid();
  if(Math.abs(DU.pos)>=DUEL_WIN)return duelEnd(DU.pos>0?0:1);
  p.q=duelQ(p.lv);duelDraw(i);DU.p.forEach((_,k)=>{const h=$('#dh'+k);if(h&&k!==i)h.querySelector('.dhead').outerHTML=duelHead(k)});
}

  const bonus=S.gamePaid!==dk;if(bonus){S.gamePaid=dk;S.owed++}save(); // 和其他小遊戲共用每天 1 張

}

/* ==================== 每日暖身:10 題基本功 ====================

Object.assign(T,{warm:['每日暖身','ㄇㄟˇ ㄖˋ ㄋㄨㄢˇ ㄕㄣ'],wDone:['暖身做完了!','ㄋㄨㄢˇ ㄕㄣ ㄗㄨㄛˋ ㄨㄢˊ ˙ㄌㄜ'],

// 每一類基本算式。g:幾年級開始出;w:出現的比重;gen 回傳 {e 算式(? 是要填的地方), a 答案, add/sub 答錯時用十格板示範}
const WARM_FAM=[
  {g:1,w:3,gen(){const a=R(1,9);return {e:`${a} + ? = 10`,a:10-a}}},                                   // 湊 10
  {g:1,w:2,gen(){const b=R(1,9);return {e:`10 + ${b} = ?`,a:10+b}}},                                   // 10 加幾
  {g:1,w:2,gen(){const a=R(2,9);return {e:`${a} + ${a} = ?`,a:2*a,add:[a,a]}}},                        // 一樣的兩個數
  {g:1,w:1,gen(){const a=R(1,8),b=R(1,9-a);return {e:`${a} + ${b} = ?`,a:a+b}}},                       // 10 以內的加法
  {g:1,w:4,gen(){const a=R(2,9),b=R(11-a,9);return {e:`${a} + ${b} = ?`,a:a+b,add:[a,b]}}},            // 進位加法
  {g:1,w:3,gen(){const a=R(11,18),b=R(a-9,9);return {e:`${a} − ${b} = ?`,a:a-b,sub:[a,b]}}},           // 退位減法
  {g:1,w:2,gen(){const a=R(2,9),s=R(Math.max(11,a+2),a+9);return {e:`${a} + ? = ${s}`,a:s-a}}},        // 加法反過來想
  {g:2,w:1,gen(){const a=R(1,8),b=R(1,9-a);return R(0,1)?{e:`${a*10} + ${b*10} = ?`,a:(a+b)*10}:{e:`${(a+b)*10} − ${b*10} = ?`,a:a*10}}}, // 整十的加減
  {g:2,w:3,gen(){const a=R(2,9),b=R(2,9);return {e:`${a} × ${b} = ?`,a:a*b}}},                         // 九九乘法
  {g:3,w:2,gen(){const b=R(2,9),q=R(2,9);return {e:`${b*q} ÷ ${b} = ?`,a:q}}},                         // 除法用乘法想
];
const warmFix=w=>w&&w.f&&typeof w.f==='object'?w:{f:{},day:''};
// 這一題還要多練的程度:答錯過的最高,答得慢的其次,沒做過的中等,又快又對的偶爾出一次
function warmNeed(e){const s=S.warm.f[e];return !s?2:!s.ok?5:s.ms>WARM_SLOW?4:s.ms>WARM_FAST?2:.6}
function warmPick(){
  const fams=WARM_FAM.filter(f=>f.g<=S.grade),tot=fams.reduce((a,f)=>a+f.w,0),cand=new Map();
  for(let n=0;n<80&&cand.size<40;n++){let r=Math.random()*tot,f=fams[0];for(const x of fams){r-=x.w;if(r<=0){f=x;break}}const q=f.gen();if(!cand.has(q.e))cand.set(q.e,q)}
  const pool=[...cand.values()].map(q=>({q,w:warmNeed(q.e)})),out=[];
  while(out.length<WARM_N&&pool.length){let r=Math.random()*pool.reduce((a,p)=>a+p.w,0),i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(i,1)[0].q)}
  return out;
}

  const st=`fill="${f.c}" stroke="${f.s}" stroke-width="1.2"`,k=f.k||'#ffd24d';
  const pet=(n,rx,ry,d)=>Array.from({length:n},(_,i)=>`<ellipse cx="${x}" cy="${y-d}" rx="${rx}" ry="${ry}" ${st} transform="rotate(${i*360/n} ${x} ${y})"/>`).join('');
  if(f.shape==='tulip')return `<ellipse cx="${x-r*.45}" cy="${y}" rx="${r*.5}" ry="${r}" ${st} transform="rotate(-16 ${x-r*.45} ${y})"/><ellipse cx="${x+r*.45}" cy="${y}" rx="${r*.5}" ry="${r}" ${st} transform="rotate(16 ${x+r*.45} ${y})"/><ellipse cx="${x}" cy="${y+r*.1}" rx="${r*.55}" ry="${r}" ${st}/>`;
  if(f.shape==='rose')return `<circle cx="${x}" cy="${y}" r="${r}" ${st}/><circle cx="${x}" cy="${y}" r="${r*.68}" fill="none" stroke="${f.s}" stroke-width="1.6"/><path d="M${x-r*.36} ${y} a${r*.36} ${r*.36} 0 1 1 ${r*.5} ${r*.3}" fill="none" stroke="${f.s}" stroke-width="1.6" stroke-linecap="round"/>`;
  if(f.shape==='spike')return Array.from({length:6},(_,i)=>{const yy=y+r*.8-i*r*.38,rr=r*(.32-i*.025);return i<5?`<circle cx="${x-r*.22}" cy="${yy}" r="${rr}" ${st}/><circle cx="${x+r*.22}" cy="${yy-r*.12}" r="${rr}" ${st}/>`:`<circle cx="${x}" cy="${yy}" r="${rr}" ${st}/>`}).join('');
  if(f.shape==='star')return pet(6,r*.3,r*.75,r*.6)+`<circle cx="${x}" cy="${y}" r="${r*.25}" fill="${k}"/>`;
  if(f.shape==='daisy')return pet(f.np||12,r*.22,r*.6,r*.62)+`<circle cx="${x}" cy="${y}" r="${r*.42}" fill="${k}"/>`;
  return pet(5,r*.55,r*.6,r*.6)+`<circle cx="${x}" cy="${y}" r="${r*.32}" fill="${k}"/>`;
}
// st:0 種子在土裡、1 發芽、2 長葉子、3 含苞、4 開花;pot:要不要畫花盆(花園和圖鑑裡的不畫)
function flowerSvg(id,st,pot=true){
  const f=FLOWERS.find(x=>x.id===id)||FLOWERS[0],gr='#58b874',b=pot?103:138,top=[b,b-20,b-48,b-62,b-66][st];let s='';
  if(st>=1){
    const leaf=(y,dir,sz)=>`<ellipse cx="${50+dir*sz*.9}" cy="${y}" rx="${sz}" ry="${sz*.45}" fill="${gr}" transform="rotate(${-dir*28} ${50+dir*sz*.9} ${y})"/>`;
    s+=`<path d="M50 ${b} Q${st>1?44:50} ${(b+top)/2} 50 ${top}" stroke="${gr}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    s+=st===1?leaf(top+2,-1,8)+leaf(top+2,1,8):leaf(b-16,-1,13)+leaf(b-27,1,13)+(st>=3?leaf(b-41,-1,10):'');
  }
  if(st===3)s+=`<ellipse cx="50" cy="${top-8}" rx="8" ry="12" fill="${gr}"/><ellipse cx="50" cy="${top-14}" rx="5" ry="7" fill="${f.c}" stroke="${f.s}" stroke-width="1"/>`;
  if(st===4)s+=flowerHead(f,50,top-12,17);
  const potH=pot?`<path d="M26 108 h48 l-6 28 h-36 z" fill="#e58f5a"/><rect x="22" y="100" width="56" height="11" rx="5.5" fill="#f2a672"/><ellipse cx="50" cy="103" rx="23" ry="3.5" fill="#8a5a3c"/>${st===0?'<ellipse cx="50" cy="101" rx="5" ry="3.2" fill="#d9b382"/>':''}`:'';
  return `<svg viewBox="${pot?'0 0 100 140':'0 38 100 102'}" aria-hidden="true">${potH}${s}</svg>`;
}
// st:0 完整的蛋、1 有裂痕、2 只剩下半邊蛋殼(寶寶從上面探出頭)
function eggSvg(i,st){
  const [c,d]=EGGS[i%EGGS.length],egg=`<ellipse cx="50" cy="64" rx="36" ry="46" fill="${c}" stroke="${d}" stroke-width="2.5"/><circle cx="36" cy="52" r="6" fill="${d}"/><circle cx="62" cy="40" r="4.5" fill="${d}"/><circle cx="64" cy="78" r="7" fill="${d}"/><circle cx="40" cy="90" r="4" fill="${d}"/>`;
  if(st>=2)return `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><clipPath id="eggClip${i}"><path d="M0 66 l10 -9 10 9 10 -9 10 9 10 -9 10 9 10 -9 10 9 10 -9 10 9 V120 H0z"/></clipPath></defs><g clip-path="url(#eggClip${i})">${egg}</g></svg>`;
  return `<svg viewBox="0 0 100 120" aria-hidden="true">${egg}${st===1?'<path d="M22 62 l9 -7 8 8 9 -8 8 8 9 -7 9 7" fill="none" stroke="#7a6a80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':''}</svg>`;
}
function petStageHtml(p){
  if(p.step<=1)return `<div class="gegg ${p.step?'wob':''}">${eggSvg(p.egg,p.step)}</div>`;
  if(p.step===2)return `<div class="ghatch"><div class="gpetb" style="font-size:96px">${bunnySvg(p.id)}</div><div class="gshell">${eggSvg(p.egg,2)}</div></div>`;
  return `<div class="gpetb" style="font-size:110px">${bunnySvg(p.id)}<span class="gacc b3">🍼</span></div>`;
}
const growBar=(g,need)=>`<div class="gbar"><i style="width:${Math.round(g/need*100)}%"></i></div><div class="gnum">${g} / ${need}</div>`;
const heartsRow=t=>gw().hearts?`<div class="row center" style="margin-top:10px"><button class="btn ghost" onclick="careHearts('${t}')"><span>💗 ${Z(GW.useHearts)} × ${gw().hearts}</span></button></div>`:`<div class="gnum" style="margin-top:8px">💗 ${Z(GW.heartsFrom)}</div>`;
const careBtns=(t,list)=>`<div class="hgrid" style="--n:${list.length};--m:${list.length};margin-top:8px">${list.map(([e,h],i)=>`<button class="btn ${['','mint','purple'][i]}" onclick="careAsk('${t}','${e}')">${hb(e,h)}</button>`).join('')}</div>`;

/* ----- 我的小花園 ----- */
function growGarden(quiet){
  if(!GROW_READY)return;
  const g=gw(),p=g.plant,uniq=[...new Set(g.garden)],size=uniq.length>=9?2:uniq.length>=3?1:0;if(!quiet)sfx.tap();
  let top;
  if(p){
    const f=FLOWERS.find(x=>x.id===p.kind);
    top=`<div class="gname">${Z(f.n)}・${Z(GW.pstage[p.step])}</div><div class="gpot gart" id="gart">${flowerSvg(p.kind,p.step)}</div>${growBar(p.g,FLOWER_NEED[p.step])}
      <div class="tip center">${Z(GW.careHint)}</div>${careBtns('plant',[['💧',Z(GW.water)],['☀️',Z(GW.sun)],['🌿',Z(GW.fert)]])}${heartsRow('plant')}`;
  }else{
    // 選種子:還沒開過的花優先
    const have=new Set(g.garden),list=[...shuffle(FLOWERS.filter(f=>!have.has(f.id))),...shuffle(FLOWERS.filter(f=>have.has(f.id)))].slice(0,3);
    top=`<div class="gname">🌰 ${Z(GW.pickSeed)}</div><div class="gseeds">${list.map(f=>`<button class="gseed" onclick="plantSeed('${f.id}')">${flowerSvg(f.id,4,false)}<span>${Z(f.n)}</span></button>`).join('')}</div>`;
  }
  show('ggarden',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts">💗 × ${g.hearts}</span></div>
  <div class="row center">${mascot()}<h1>🌷 ${Z(GW.garden)}</h1></div>
  <div class="card gstage">${top}</div>
  <h2>🏡 ${Z(GW.sizes[size])}　🌸 × ${g.garden.length}</h2>
  <div class="gfield">${uniq.length>=9?'<span class="grb">🌈</span>':''}${uniq.length>=6?'<span class="gbf">🦋</span>':''}${uniq.length>=FLOWERS.length?'<span class="gbf b">🐝</span>':''}
    <div class="gfl">${g.garden.length?g.garden.slice(-24).map((id,i)=>`<span style="animation-delay:${-(i*.3).toFixed(1)}s">${flowerSvg(id,4,false)}</span>`).join(''):`<div class="gnum">${Z(GW.noneYet)}</div>`}</div></div>
  <h2>📖 ${Z(GW.book)}　${uniq.length} / ${FLOWERS.length}</h2>
  <div class="gdex">${FLOWERS.map(f=>{const ok=uniq.includes(f.id);return `<div class="${ok?'':'lock'}">${flowerSvg(f.id,4,false)}<small>${ok?Z(f.n):'?'}</small></div>`}).join('')}</div>`);
}
function plantSeed(id){
  const g=gw(),f=FLOWERS.find(x=>x.id===id);if(g.plant||!f)return;
  g.plant={kind:id,step:0,g:0};save();growGarden(true);sfx.ok();speak(`種下${f.n[0]}的種子了!答對題目,它就會長大喔!`);
}

/* ----- 我的寵物 ----- */
function growPet(quiet){
  if(!GROW_READY)return;
  const g=gw(),p=g.pet;if(!quiet)sfx.tap();
  let top;
  if(p){
    const a=PETS[p.id],born=p.step>=2;
    top=`<div class="gname">${born?Z(a.kind)+'・':''}${Z(GW.estage[p.step])}</div><div class="gart" id="gart">${petStageHtml(p)}</div>${growBar(p.g,PET_NEED[p.step])}
      <div class="tip center">${Z(GW.careHint)}</div>${careBtns('pet',born?[['🍽️',Z(J(GW.feed,a.food))],['🛁',Z(GW.bath)],['🎾',Z(GW.play)]]:[['🤗',Z(GW.hug)],['🎵',Z(GW.sing)]])}${heartsRow('pet')}`;
  }else{
    const eggs=shuffle(EGGS.map((_,i)=>i)).slice(0,3);
    top=`<div class="gname">🥚 ${Z(GW.pickEgg)}</div><div class="gseeds">${eggs.map(i=>`<button class="gseed" onclick="eggPick(${i})">${eggSvg(i,0)}</button>`).join('')}</div>`;
  }
  const ids=Object.keys(PETS);
  show('gpet',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts">💗 × ${g.hearts}</span></div>
  <div class="row center">${mascot()}<h1>🐾 ${Z(GW.pet)}</h1></div>
  <div class="card gstage">${top}</div>
  <h2>🏠 ${Z(GW.myPets)}　${g.pets.length} / ${ids.length}</h2>
  <div class="gpets">${ids.map(id=>g.pets.includes(id)
    ?`<div><div class="gpetb">${bunnySvg(id)}<span class="gacc b4">🎀</span></div><div>${Z(PETS[id].kind)}</div>${g.buddy===id?`<div class="gbud">⭐ ${Z(GW.isBuddy)}</div>`:`<button class="btn ghost small" onclick="setBuddy('${id}')">${Z(GW.buddy)}</button>`}</div>`
    :`<div class="lock"><div class="gq">?</div></div>`).join('')}</div>`);
}
function eggPick(i){
  const g=gw();if(g.pet)return;
  const left=Object.keys(PETS).filter(id=>!g.pets.includes(id)); // 還沒養過的優先
  g.pet={id:pick(left.length?left:Object.keys(PETS)),egg:i,step:0,g:0};save();growPet(true);sfx.ok();speak('選好了!答對題目,蛋就會慢慢孵出來喔!');
}
function setBuddy(id){const g=gw();if(!g.pets.includes(id))return;g.buddy=id;save();newPet();sfx.ok();growPet(true);speak(`${PETS[id].kind[0]}${PETS[id].name[0]}現在是你的小夥伴了!`)}

/* ----- 照顧:出一題,第一次就答對才長大 ----- */
let CQ=null;
function careQ(){ // 現在這個年級的選擇題;錯題本裡還要練的題型比較常出
  const ks=KINDS.filter(k=>UNITS[S.grade].some(u=>u.id===k.u)&&k.types.includes('c')),due=ks.filter(k=>(S.stat[k.id]||{}).due>0);
  for(let n=0;n<80;n++){const q=genKind(due.length&&Math.random()<.4?pick(due):pick(ks),'c',1);if(q&&q.type==='c'&&q.opts&&q.opts.length)return q}
  return null;
}
function careAsk(target,emo){
  const g=gw();if(!(target==='plant'?g.plant:g.pet))return;
  const q=careQ();if(!q)return;
  CQ={target,emo,q,done:false};sfx.tap();
  modal(`<div class="careq">
    <div class="row" style="flex-wrap:nowrap"><div class="prompt sp">${q.p}</div><button class="spk" onclick="speak(qSay(CQ.q),true)">🔊</button></div>
    ${q.v?`<div class="visual">${q.v}</div>`:''}
    <div class="opts ${q.opts.some(o=>o.h.includes('class="zc"')||/ [+−×] /.test(o.h))?'long':''}">${q.opts.map((o,j)=>`<button class="opt" onclick="careAns(${j})">${o.h}</button>`).join('')}</div>
    <div id="careFb"></div>
    <div class="row center" id="careBtn" style="margin-top:10px"><button class="btn ghost small" onclick="closeModal()">${Z(GW.later)}</button></div></div>`);
  speak(qSay(q));
}
function careAns(j){
  const c=CQ;if(!c||c.done||!c.q.opts[j])return;c.done=true; // 一題只能答一次,連點不會算兩次
  const ok=!!c.q.opts[j].ok,bs=document.querySelectorAll('#modalBody .opt');
  statAdd(c.q.kind,ok); // 也記到弱點分析和錯題本
  if(ok){closeModal();return growAdd(c.target,1,c.emo)}
  sfx.bad();mascotAnim('sad');bs.forEach((b,k)=>b.classList.add(c.q.opts[k].ok?'sel':'bad'));
  const t=c.q.teach&&Array.isArray(c.q.teach[0])?line(c.q.teach[0]):null;
  $('#careFb').innerHTML=`<div class="tip">${Z(GW.ansIs)} <b>${c.q.ansH}</b>${t?`<br>💡 ${t.h}`:''}</div>`;
  $('#careBtn').innerHTML=`<button class="btn" onclick="careAsk('${c.target}','${c.emo}')">🔁 ${Z(GW.nextQ)}</button><button class="btn ghost small" onclick="closeModal()">${Z(GW.later)}</button>`;
  speak(GW.wrongNext[0]);
}
// 用練習得到的愛心照顧:一次最多用到升上下一個階段為止
function careHearts(target){
  const g=gw(),o=target==='plant'?g.plant:g.pet;if(!o||g.hearts<=0)return;
  const k=Math.min(g.hearts,(target==='plant'?FLOWER_NEED:PET_NEED)[o.step]-o.g);if(k<=0)return;
  g.hearts-=k;growAdd(target,k,'💗');
}
function growAdd(target,n,emo){
  const g=gw(),isP=target==='plant',o=isP?g.plant:g.pet,need=isP?FLOWER_NEED:PET_NEED;if(!o)return;
  o.g+=n;let up=false,done=false;
  while(!done&&o.g>=need[o.step]){o.g-=need[o.step];o.step++;up=true;if(o.step>=4)done=true}
  if(done){
    if(isP){g.garden.push(o.kind);g.plant=null}
    else{if(!g.pets.includes(o.id))g.pets.push(o.id);if(!g.buddy)g.buddy=o.id;g.pet=null;newPet()} // 第一隻養大的自動當小夥伴
  }
  save();(isP?growGarden:growPet)(true);
  const art=$('#gart');
  if(art){art.insertAdjacentHTML('beforeend',`<span class="gfx">${emo}</span>`);const r=art.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,up?14:6)}
  if(done){
    sfx.win();confetti(200);
    if(isP){
      const f=FLOWERS.find(x=>x.id===o.kind);speak(`哇!${f.n[0]}開花了!種到花園裡了!再選一包種子吧!`);
      modal(`<div class="gpot" style="width:170px">${flowerSvg(o.kind,4)}</div><h2>🌸 ${Z(f.n)}</h2><div>${Z(GW.bloom)}</div><button class="btn mint" onclick="closeModal()">${Z(T.yes)}</button>`);
    }else{
      const a=PETS[o.id];speak(`哇!${a.kind[0]}${a.name[0]}長大了!變成你的寵物了!`);
      modal(`<div class="gpetb" style="font-size:150px">${bunnySvg(o.id)}<span class="gacc b4">🎀</span></div><h2>${Z(a.kind)} ${Z(a.name)}</h2><div>${Z(GW.grown)}</div><button class="btn mint" onclick="closeModal()">${Z(T.yes)}</button>`);
    }
  }else if(up){
    sfx.win();confetti(60);mascotAnim('jump');
    speak(isP?GW.pstage[o.step][0]+'!':o.step===2?`哇!蛋裂開了!是${PETS[o.id].kind[0]}!`:GW.estage[o.step][0]+'!');
  }else sfx.ok();
}

/* 實體鍵盤也可以作答 */
document.addEventListener('keydown',e=>{
  if($('#modalBox').classList.contains('on')){if(e.key==='Enter'){if($('#gateIn'))gateCheck();else if($('#kidIn'))addKid();else if($('#pin1'))pinSave()}return}
  if((scr==='lesson'&&L&&L.wait)||(scr==='shop'&&P&&P.step===1)||(scr==='vquiz'&&V&&V.pad)||(scr==='warm'&&WM&&!WM.busy)){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok');return}
  if(scr!=='play')return;
  if(G.done||G.act==null)return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok');
});
boot(3); // 全部讀完,準備畫首頁
try{home();$('#appRoot').setAttribute('data-ok','1')}catch(e){showErr(e.message+' '+(e.stack||''))} // data-ok:啟動成功(上面的檢查看這個)
// 請瀏覽器盡量不要自動清掉這個網站的資料(不一定會答應,所以還是要備份)
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
if(!S.pin)pinSetup(); // 第一次使用(或還沒有家長密碼):先請爸媽設定
</script>
