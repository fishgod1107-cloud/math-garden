<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>自然小探險</title>
<style>
:root{--bg:#f3fbef;--card:#fff;--ink:#23412b;--sub:#5b7a62;--pri:#3e9b5a;--pri2:#2f7d47;--sun:#ffcf4d;--sky:#7cc6ef;--rose:#ff8a8a;--okc:#d8f5d9;--bad:#ffe0e0;--line:#cfe6cf;--shadow:0 4px 0 rgba(40,90,50,.18)}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.5}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(circle at 10% 0%,#e3f7d9 0,transparent 40%),radial-gradient(circle at 100% 30%,#e0f2ff 0,transparent 35%),var(--bg);background-attachment:fixed;min-height:100vh}

.heroT{flex:1}.hero h1{margin:0;font-size:30px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.15)}

.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.ol{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#eef7ee;color:var(--pri2);font-weight:800;font-size:18px;margin-right:10px;flex:none}

.tile.unit{border:0;box-shadow:0 5px 0 rgba(40,90,50,.15)}.tile.unit .em{font-size:48px}

.qcard{border-top:8px solid var(--pri)}.qcard.boss{border-top-color:#8a5cf6}

.score{text-shadow:0 3px 0 #d8f5d9}
h2{color:var(--pri2)}
#appRoot{max-width:780px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:28px;margin:6px 0}h2{font-size:24px;margin:8px 0}h3{font-size:21px;margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:56px;min-width:56px;padding:8px 18px;border:0;border-radius:18px;background:var(--pri);color:#fff;font-size:21px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--pri2);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#5a3d00}.btn.sky{background:var(--sky);color:#083a55}.btn.rose{background:var(--rose)}
.btn.small{min-height:56px;font-size:17px;padding:6px 12px;border-radius:14px}.pz .btn.small{min-height:44px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.center{justify-content:center;text-align:center}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(40,90,50,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border-radius:20px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--line);cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;position:relative;font-family:inherit;color:var(--ink)}
.tile .em{font-size:40px;line-height:1.1}.tile small{font-weight:400;color:var(--sub);font-size:15px}
.tile .badge{position:absolute;top:6px;right:8px;background:var(--rose);color:#fff;border-radius:12px;padding:0 8px;font-size:15px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top .sp{flex:1}
.mascot{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.mascot .owl{font-size:52px;line-height:1;animation:blink 5s infinite}
.bubble{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:1;position:relative}

.warn{background:#ffe1e1;border:2px solid #e55;color:#900;border-radius:16px;padding:12px;margin:10px 0;font-weight:700}
.note{background:#fff7d6;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:17px}
.tasks{display:flex;gap:8px;flex-wrap:wrap}.task{flex:1;min-width:150px;background:#fff;border-radius:16px;padding:8px 10px;border:2px dashed var(--line);font-size:16px}.task.ok{border-style:solid;border-color:var(--pri);background:var(--okc)}
.qhead{display:flex;align-items:center;gap:10px}.qhead .sp{flex:1}

.qpic{font-size:56px;text-align:center;line-height:1.2}
.stem{font-size:23px;font-weight:700;margin:6px 0 12px}
.hints{margin:6px 0 10px;padding-left:0;list-style:none}.hints li{background:#eef8ff;border-radius:12px;padding:6px 12px;margin:4px 0}
.opts{display:grid;gap:10px}
.opt{min-height:60px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:21px;padding:10px 14px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}

.opts.two{grid-template-columns:1fr 1fr}

.fb b{display:block;font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:56px;display:inline-flex;align-items:center;padding:6px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:19px;font-family:inherit;color:var(--ink);cursor:pointer}

.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.basket{border:3px dashed var(--pri);border-radius:18px;min-height:110px;padding:8px;background:#f7fff4;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);font-size:18px}
.basket .bn{font-weight:700;display:block;margin-bottom:4px}
.seq{display:flex;flex-direction:column;gap:6px;margin:8px 0}.seq .chip{text-align:left}
.spots{display:grid;gap:8px}.spot{display:flex;gap:8px;align-items:center;border:3px dashed var(--line);border-radius:16px;padding:8px 10px;background:#fff;cursor:pointer;font-family:inherit;font-size:18px;color:var(--ink);text-align:left;min-height:56px}
.spot .slot{margin-left:auto;min-width:80px;border-radius:12px;background:#f0f6f0;padding:4px 10px;text-align:center;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bars{width:100%;max-width:420px;display:block;margin:6px auto}
.score{font-size:64px;font-weight:800;color:var(--pri2);text-align:center}
.stk{font-size:40px;display:inline-block;margin:4px}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border-radius:18px;padding:10px}
.album span{font-size:34px;text-align:center;background:#f6fbf4;border-radius:12px;aspect-ratio:1;min-height:44px;display:flex;align-items:center;justify-content:center}
.album span.empty{opacity:.25}
.lesson{background:#fff;border-radius:18px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}.lesson .em{font-size:40px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dexc{background:#fff;border-radius:18px;padding:10px;text-align:center;border:2px solid var(--line);font-family:inherit;color:var(--ink);font-size:17px;cursor:pointer;min-height:120px}
.dexc .em{font-size:44px}.dexc.lock{background:#eee;color:#999}
.arena{position:relative;height:420px;background:linear-gradient(#bfe6ff,#e9f9e4);border-radius:22px;overflow:hidden;touch-action:manipulation}
.fall{position:absolute;top:-80px;width:23%;min-height:60px;padding:6px 4px;word-break:break-all;border-radius:18px;border:3px solid #fff;background:rgba(255,255,255,.92);font-size:18px;font-weight:700;font-family:inherit;color:var(--ink);animation:fall linear infinite;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.fall.got{background:var(--okc);border-color:var(--pri);animation-play-state:paused}.fall.miss{background:var(--bad);border-color:var(--rose);animation-play-state:paused}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(540px)}}
.scene{background:#eaf6ff;border-radius:20px;min-height:170px;padding:14px;text-align:center;font-size:40px;position:relative;overflow:hidden}
.scene .cap{font-size:18px;margin-top:8px}
.scene .mv{display:inline-block;transition:transform 1.4s ease,opacity 1.4s ease}
.scene.run .pull{transform:translateY(-34px)}.scene.run .sink{transform:translateY(40px)}.scene.run .fade{opacity:0}.scene.run .show{opacity:1}.scene .show{opacity:0}
.reels{display:flex;justify-content:center;gap:10px;font-size:54px;margin:10px 0}.reel{background:#fff;border-radius:16px;padding:6px 12px;border:3px solid var(--sun)}
#modalBox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,40,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBox.on{display:flex}
.mcard{background:#fff;border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
#toastBox{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140px);background:#234;color:#fff;border-radius:16px;padding:10px 18px;font-size:18px;z-index:60;transition:transform .3s;max-width:90vw;text-align:center}
#toastBox.on{transform:translateX(-50%) translateY(0)}
#bootErr{display:none;background:#ffe1e1;color:#900;padding:12px;margin:12px;border-radius:12px;font-weight:700}
input,select,textarea{font-size:20px;font-family:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);max-width:100%}
textarea{width:100%;min-height:120px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.pz section{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0}
.pz h3{margin-top:0}
.muted{color:var(--sub);font-size:16px}
.rev{border-left:6px solid var(--line);padding:6px 10px;margin:8px 0;background:#fff;border-radius:10px}.rev.ok{border-color:var(--pri)}.rev.no{border-color:var(--rose)}
.boss{border:4px solid #8a5cf6;background:#f4efff}
.myth{border:3px dashed #8a5cf6;border-radius:14px;padding:6px 10px;background:#fff}
@media (max-width:420px){html,body{font-size:18px}.stem{font-size:21px}.grid{grid-template-columns:repeat(2,1fr)}.album{grid-template-columns:repeat(5,1fr)}.opt.tf{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fall{position:static;display:inline-block;margin:6px;transform:none}.arena{height:auto;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start}}

/* 難詞注音（和數學小花園同樣式：注音直排在字的右邊） */
.zw{white-space:nowrap}
.zc{display:inline-flex;align-items:center;vertical-align:middle}
.z{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:.4em;line-height:1;width:1em;margin:0 .6em 0 .1em;font-weight:700;opacity:.9;color:#7a5a20}
.z i{font-style:normal;display:block}
.z i.zn{position:absolute;left:.92em;bottom:.28em;font-weight:400;display:inline}
.hero .z{color:#fff;opacity:1}

</style>

<div id="bootErr"></div>
<div id="appRoot"><p style="text-align:center;margin-top:40px">🦉 載入中……</p></div>
<div id="modalBox"></div>
<div id="toastBox"></div>
<script>
var bootStep=0;function boot(n){bootStep=n}
function showErr(m){var b=document.getElementById('bootErr');if(b){b.style.display='block';b.textContent='⚠️ 遊戲出錯了（步驟 '+bootStep+'）：'+m+'。請截圖給爸爸媽媽。'}}
window.onerror=function(m,s,l,c){showErr(m+' @'+l+':'+c);return false};
setTimeout(function(){if(!document.body.getAttribute('data-ok'))showErr('遊戲沒有正常啟動。'+navigator.userAgent)},4000);
boot(1);
</script>
<script>
/* ===== CORE ===== */
boot(2);
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 難詞注音：把 TERMS 裡的詞換成直排注音（和數學小花園同樣式），其他文字照常跳脫。整段包一個 span，放進 flex 按鈕時不會被拆開。 */
let zyRe=null;
function zyH(s){s=String(s==null?'':s);
 if(zyRe===null){const ks=Object.keys(typeof TERMS==='object'?TERMS:{}).sort((a,b)=>b.length-a.length);zyRe=ks.length?new RegExp(ks.join('|'),'g'):false}
 if(!zyRe)return esc(s);
 let out='',last=0;s.replace(zyRe,(m,off)=>{out+=esc(s.slice(last,off))+zyRuby(m);last=off+m.length;return m});
 return '<span class="zt">'+out+esc(s.slice(last))+'</span>'}
function zyRuby(w){const z=TERMS[w].w[1].split(' ');
 return '<span class="zw">'+Array.from(w).map((c,i)=>{let s=z[i]||'',light=false,tone='';
  if(s[0]==='˙'){light=true;s=s.slice(1)}if('ˊˇˋ'.includes(s.slice(-1))){tone=s.slice(-1);s=s.slice(0,-1)}
  return `<span class="zc">${esc(c)}<span class="z">${light?'<i>˙</i>':''}${Array.from(s).map(x=>`<i>${x}</i>`).join('')}${tone?`<i class="zn">${tone}</i>`:''}</span></span>`}).join('')+'</span>'}
/* 畫面上其他文字（首頁、按鈕、選單、小遊戲）也自動加注音：掃過文字節點，已經加過的、家長區、輸入框都跳過。 */
function zyDom(root){if(!root)return;zyH('');if(!zyRe)return;
 const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentNode;
  if(!p||p.closest('.zw,.pz,.nozy,script,style,textarea,select,option,svg'))return NodeFilter.FILTER_REJECT;
  zyRe.lastIndex=0;const hit=zyRe.test(n.nodeValue);zyRe.lastIndex=0;return hit?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
 const L=[];while(tw.nextNode())L.push(tw.currentNode);
 for(const n of L){const s=document.createElement('span');s.innerHTML=zyH(n.nodeValue);n.parentNode.replaceChild(s.firstChild,n)}}
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>dstr(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sumN=a=>a.reduce((s,x)=>s+(+x.n||0),0);
const CAN_DL=(()=>{try{return window.self===window.top}catch(e){return false}})();
const KID_FIELDS={id:()=>uid(),nm:()=>'',grade:()=>3,earned:()=>[],stk:()=>[],spent:()=>[],prizes:()=>[],wrong:()=>({'2':[],'3':[]}),stat:()=>({}),seen:()=>({}),dex:()=>[],dexDay:()=>({d:'',n:0}),uday:()=>({}),labs:()=>[],best:()=>({}),flags:()=>({}),log:()=>[],prog:()=>null,progAt:()=>0};
let saveFailed=false,storageOff=false,spinning=false,persisted=null,scr='home',G=null,GM=null,askFn=null,homeG=null,actx=null;

/* ---- 存檔 ---- */
function fresh(){return {v:1,kids:[],cur:0,pin:'',mode:'step',slotOff:false,spinCost:5,gifts:DEFAULT_GIFTS.map(g=>Object.assign({},g)),reports:[],rate:0.9,voice:'',quiet:false,mute:false,autoRead:true,lastBak:0,created:Date.now()}}
function blankKid(nm,grade){const k={};for(const f in KID_FIELDS)k[f]=KID_FIELDS[f]();k.nm=nm||'小探險家';k.grade=+grade===2?2:3;return k}
function normKid(k){
 k.grade=+k.grade===2?2:3;
 if(k.best&&typeof k.best==='object')for(const u in k.best)k.best[u]=+k.best[u];
 for(const f in KID_FIELDS){const z=KID_FIELDS[f]();const v=k[f];
  if(v===undefined||v===null&&z!==null||(z!==null&&(typeof v!==typeof z||Array.isArray(v)!==Array.isArray(z))))k[f]=z}
 if(k.prog!==null&&!Array.isArray(k.prog))k.prog=null;
 k.grade=+k.grade===2?2:3;
 for(const g of ['2','3'])k.wrong[g]=(Array.isArray(k.wrong[g])?k.wrong[g]:[]).filter(w=>w&&BYID[w.id]&&!RETIRED.includes(w.id)).slice(0,60);
 for(const id in k.seen)if(!BYID[id]||RETIRED.includes(id))delete k.seen[id];
 for(const a of ['earned','stk','spent','prizes'])k[a]=k[a].filter(x=>x&&typeof x==='object'&&typeof x.id==='string');
 for(const a of ['earned','spent'])k[a]=k[a].filter(x=>(+x.n)>=0&&(+x.n)<=300).map(x=>Object.assign(x,{n:+x.n,t:+x.t||0}));
 const slots=slotIds(k),sset=new Set(slots),used=new Set(k.stk.filter(s=>sset.has(s.id)).map(s=>s.id)),free=slots.filter(x=>!used.has(x));
 // 舊格式（隨機 id）的貼紙依時間搬進空格子，不讓已領的貼紙消失
 k.stk=k.stk.slice().sort((a,b)=>(+a.t||0)-(+b.t||0)).map(s=>sset.has(s.id)?s:(free.length?Object.assign({},s,{id:free.shift()}):null)).filter(Boolean)
  .filter((s,j,a)=>a.findIndex(x=>x.id===s.id)===j).map(s=>({id:s.id,e:STICKERS.includes(s.e)?s.e:'⭐',t:+s.t||0}));
 k.spent=k.spent.map(x=>Object.assign(x,{coin:+x.coin===1?1:0}));
 k.prizes=k.prizes.map(p=>Object.assign(p,{e:String(p.e||'🎁').slice(0,4),n:String(p.n||'禮物').slice(0,20),coin:+p.coin||0,t:+p.t||0}));

  if(!test&&(st.done||(q.type==='tw'&&ph===1&&st.ph===2))){if(o.ok&&st.done)c='ok';else if(j===chosen)c=o.ok?'ok':'bad'}
  if(test&&j===chosen)c='sel';
  if(!test&&!st.done&&st.pick.includes(j)&&ph===st.ph)c='off';
  if(q.type==='tw'&&ph===1&&st.ph===2&&!st.done)c=j===chosen?'sel':'';
  return `<button class="opt ${tf?'tf':''} ${c}" onclick="${lock?'':`choose(${i},${j})`}">${tf?'':`<span class="ol">${'ABCDE'[j]}</span>`}${zyH(o.h)}</button>`}).join('')}</div>`}
function barsSvg(q){const b=q.bars,mx=Math.max(...b.map(x=>x[1]));const W=60*b.length+40,H=200;
 return `<svg class="bars" viewBox="0 0 ${W} ${H+40}" role="img" aria-label="長條圖">${b.map((x,j)=>{const h=Math.round(x[1]/mx*(H-30));const xx=30+j*60;return `<rect x="${xx}" y="${H-h}" width="40" height="${h}" rx="6" fill="#7cc6ef"/><text x="${xx+20}" y="${H-h-6}" text-anchor="middle" font-size="16">${x[1]}</text><text x="${xx+20}" y="${H+24}" text-anchor="middle" font-size="18">${esc(x[0])}</text>`}).join('')}<line x1="20" y1="${H}" x2="${W-10}" y2="${H}" stroke="#555"/></svg><div class="muted center">單位：${esc(q.unit||'')}</div>`}
function qCard(P,i){if(!G)return;const q=P.q,st=G.st[i],n=G.qs.length,W=WIDGETS[q.type];
 let body='';
 if(q.hints&&q.hints.length)body+=`<ul class="hints">${q.hints.slice(0,st.done?q.hints.length:st.hintN).map(h=>`<li>💡 ${zyH(h)}</li>`).join('')}</ul>${!st.done&&st.hintN<q.hints.length?`<button class="btn small sky" onclick="wHint(${i})">再給我一個提示</button>`:''}`;
 if(q.bars)body+=barsSvg(q);
 if(q.type==='c'||q.type==='tf')body+=optsHtml(P,i,st,P.o,1);
 else if(q.type==='tw'){body+=optsHtml(P,i,st,P.o,1);if(st.ph===2)body+=`<div style="margin-top:12px"><b>為什麼？選一個理由：</b></div>`+optsHtml(P,i,st,P.r,2)}
 else if(W){body+=W.draw(P,i,st,st.done);if(!st.done)body+=`<div class="row center" style="margin-top:10px"><button class="btn" onclick="wDone(${i})">✔ 完成</button></div>`}
 const fb=st.fbHtml||'';
 const tag=(q.tag?`<span class="qtag">${esc(q.tag)}</span> `:'')+(q.adv?'<span class="qtag adv">進階</span> ':'')+(q.fill?'<span class="qtag">補充題</span> ':'')+`<span class="qtag" style="background:#e3f1e3;color:#2f7d47">${TYPE_NAME[q.type]||''}</span>`;
 const isTF=q.type==='tf'||q.type==='tw';
 paint(`<div class="qhead"><button class="btn small ghost" onclick="quitQuiz()">✖</button><b class="sp">${esc(G.title)}</b><span>${i+1} / ${n}</span></div>
 <div class="prog"><i style="width:${Math.round(i/n*100)}%"></i></div>
 <div class="qcard ${G.kind==='boss'?'boss':''}">${tag}
 ${q.pic&&!(q.type==='label'&&q.ans.pic)?`<div class="qpic">${esc(q.pic)}</div>`:''}
 ${isTF?`<div class="muted">${G.kind==='boss'?'👾 迷思怪說：':'有人說了一句話：'}${/[？?]$/.test(q.stem)?'':'這句話是真的嗎？'}</div><div class="stem ${G.kind==='boss'?'myth':''}">${zyH(q.stem)}</div>`:`<div class="stem">${zyH(q.stem)}</div>`}
 ${body}<div id="fbArea">${fb}</div>
 <div class="tools"><button class="btn small ghost" onclick="readQ(${i})">🔊 唸題目</button>${P.o?`<button class="btn small ghost" onclick="readOpts(${i})">👂 聽選項</button>`:''}<button class="btn small ghost" onclick="report(${i})">🐞 這題怪怪的</button><span style="flex:1"></span>${st.done?`<button class="btn" onclick="nextQ()">${i+1<n?'下一題 ➡':'看結果 🎉'}</button>`:''}</div></div>`);
 if(!st.read){st.read=1;if(S.autoRead!==false&&scr==='quiz'){if(isTF)speak((G.kind==='boss'?'迷思怪說了一句話':'有人說了一句話')+'，這句話是真的嗎？');else speak(q.hints&&q.hints.length?q.stem+'。'+q.hints[0]:q.stem)}}}
function readQ(i){const P=G.qs[i];speak(P.q.stem+(P.q.hints?'。'+P.q.hints.slice(0,G.st[i].hintN).join('。'):''))}
function readOpts(i){const P=G.qs[i],st=G.st[i];const L=P.q.type==='tw'&&st.ph===2?P.r:P.o;speak(L.map((o,j)=>(j+1)+'，'+o.h).join('。'))}
function wHint(i){G.st[i].hintN++;qCard(G.qs[i],i);const q=G.qs[i].q;speak(q.hints[G.st[i].hintN-1])}
function report(i){const q=G.qs[i].q;S.reports.unshift({id:q.id,d:today(),k:kid().nm});S.reports=S.reports.slice(0,100);save();toast('謝謝你！已經記下來給大人看。')}
function quitQuiz(){ask('<h2>要離開嗎？</h2><p>這一回合不會計分，也不會得到貼紙；已經答錯的題目還是會放進錯題本。'+(G&&G.kind==='boss'?'<br><b>迷思怪今天已經挑戰過，離開後要明天才能再來。</b>':'')+'</p>',()=>home())}
function choose(i,j){const P=G.qs[i],st=G.st[i],q=P.q;if(st.done)return;sfx('tap');
 if(q.type==='tw'&&st.ph===2){st.ans2=j;if(G.mode==='test'){st.done=true;return nextQ()}return settle(i)}
 if(st.pick.includes(j))return;
 st.ans=j;
 if(G.mode==='test'){if(q.type==='tw'){st.ph=2;return qCard(P,i)}st.done=true;return nextQ()}
 const o=P.o[j];
 if(q.type==='tw'){st.ph=2;st.fbHtml='';qCard(P,i);speak('為什麼？選一個理由');return}
 if(o.ok){st.pts=st.tries?5:10;return settle(i)}
 if(q.type==='tf'||st.tries>=1){st.pts=0;return settle(i)}
 st.tries++;st.pick.push(j);sfx('no');st.fbHtml=`<div class="fb try"><b>🤔 ${pick(CHAT.retry)}</b>${zyH(o.wy||'')}</div>`;qCard(P,i);speak(o.wy||'再想一次')}
function wAct(i,k,x){const P=G.qs[i],st=G.st[i];if(st.done)return;st.bad=null;WIDGETS[P.q.type].act(P,st,k,x);sfx('tap');qCard(P,i)}
function wDone(i){const P=G.qs[i],st=G.st[i],W=WIDGETS[P.q.type];if(st.done)return;if(!W.ready(P,st))return toast('還有沒放好的喔！');
 const r=W.check(P,st);
 if(G.mode==='test'){st.done=true;st.ok=r.ok;st.pts=r.ok?10:0;return nextQ()}
 if(r.ok){st.pts=st.tries?5:10;return settle(i)}
 if(st.tries>=1){st.pts=0;st.bad=r.bad;return settle(i)}
 st.tries++;st.bad=r.bad;sfx('no');st.fbHtml=`<div class="fb try"><b>🤔 ${pick(CHAT.retry)}</b>紅色的地方不太對，改一改再按完成。</div>`;qCard(P,i)}
function twPts(P,st){const a=P.o[st.ans],b=P.r[st.ans2];return a&&a.ok?(b&&b.ok?10:5):0}
function settle(i){const P=G.qs[i],st=G.st[i],q=P.q;st.done=true;
 if(q.type==='tw')st.pts=twPts(P,st);
 st.ok=st.pts>0&&(q.type!=='tw'||st.pts===10);
 rec(P,st.pts===10||(st.pts===5&&q.type!=='tw'));
 st.fbHtml=fbHtml(P,st);if(st.pts===10){sfx('ok')}else if(st.pts===0)sfx('no');
 qCard(P,i);speak((st.pts?pick(CHAT.ok)+'。':'')+(q.right?q.right+'。':'')+q.why.cause)}
function fbHtml(P,st){const q=P.q,w=q.why||{};let h='';
 const good=st.pts===10,half=st.pts===5;
 h+=`<b>${good?'🎉 '+pick(CHAT.ok)+' +10':half?(q.type==='tw'?'👍 結論對了，理由再想想 +5':'👍 第二次答對 +5'):'💡 '+pick(CHAT.lose)}</b>`;
 if(q.type==='c'||q.type==='tf'||q.type==='tw'){const o=P.o[st.ans];if(o&&!o.ok&&o.wy)h+=`<div>❌ ${zyH(o.wy)}</div>`;
  if(q.type==='tw'){const r=P.r[st.ans2];if(r&&!r.ok&&r.wy)h+=`<div>❌ ${zyH(r.wy)}</div>`;h+=`<div>✅ 正確理由：${zyH(P.r.find(x=>x.ok).h)}</div>`}
  if(!good&&q.type==='c')h+=`<div>✅ 正確答案：${zyH(P.o.find(x=>x.ok).h)}</div>`}
 else if(!st.ok&&WIDGETS[q.type])h+=`<div>✅ 正確答案：<br>${WIDGETS[q.type].answer(P)}</div>`;
 if(q.right)h+=`<div>📣 ${zyH(q.right)}</div>`;
 if(w.see)h+=`<div>👀 ${zyH(w.see)}</div>`;
 h+=`<div>🔍 ${zyH(w.cause)}</div>`;
 if(w.myth&&!good)h+=`<div>🦉 ${zyH(w.myth)}</div>`;
 return `<div class="fb ${good?'good':half?'try':'lose'}">${h}</div>`}
function rec(P,ok){const k=kid(),q=P.q,ty=q.otype||q.type;const s=k.stat[ty]||(k.stat[ty]={n:0,ok:0});s.n++;if(ok)s.ok++;k.seen[q.id]=(k.seen[q.id]||0)+1;
 const g=String(q.g),W=k.wrong[g]||(k.wrong[g]=[]);const ix=W.findIndex(w=>w.id===q.id);
 if(!ok&&G.kind!=='warm'){if(ix>=0)W.splice(ix,1);W.unshift({id:q.id,d:today()});k.wrong[g]=W.slice(0,60)}
 else if(ok&&G.kind==='review'&&ix>=0)W.splice(ix,1)}

function finish(){if(!G||G.fin)return;G.fin=1;const k=kid(),n=G.qs.length;
 if(G.mode==='test')G.qs.forEach((P,i)=>{const st=G.st[i],q=P.q;if(q.type==='c'||q.type==='tf')st.pts=P.o[st.ans]&&P.o[st.ans].ok?10:0;else if(q.type==='tw')st.pts=twPts(P,st);st.ok=st.pts===10;rec(P,st.ok);st.fbHtml=fbHtml(P,st)});
 const sum=G.st.reduce((s,x)=>s+(x.pts||0),0),score=Math.round(sum/(n*10)*100),right=G.st.filter(x=>x.ok).length;
 let got=0,notes=[];const base=score===100?2:score>=80?1:0,eff=score>=50&&score<100;
 if(G.kind==='unit'||G.kind==='mix'){got=base;const prev=k.best[G.id];if(prev==null||score>prev){k.best[G.id]=score;if(eff&&!gotToday(k,'eff_'+G.id)&&prev!=null){got++;setFlag(k,'eff_'+G.id);notes.push('刷新紀錄努力獎 +1')}}setFlag(k,'unit');
  if(G.kind==='unit'&&score>=70){const d=k.uday[G.id]||(k.uday[G.id]=[]);if(!d.includes(today()))d.push(today())}}
 else if(G.kind==='exam'){if(gotToday(k,'exam_'+G.id))notes.push('今天已經領過這份段考的貼紙，這次只練習。');else{got=base;setFlag(k,'exam_'+G.id)}if(k.best[G.id]==null||score>k.best[G.id])k.best[G.id]=score;setFlag(k,'unit')}
 else if(G.kind==='review'){setFlag(k,'rev');if(score>=50&&!gotToday(k,'eff_rev')){got=1;setFlag(k,'eff_rev');notes.push('完成錯題再練努力獎 +1')}}
 else if(G.kind==='boss'){if(right>=8){got=1;notes.push('打倒迷思怪 +1')}else notes.push('迷思怪還在！答對 8 題就能打倒它，明天再來挑戰。')}
 else if(G.kind==='warm'){setFlag(k,'warm')}
 else if(G.kind==='quick'){setFlag(k,'game');if(score>=60&&!gotToday(k,'gamePaid')){got=1;setFlag(k,'gamePaid');notes.push('小遊戲貼紙 +1')}}
 if(got)award(k,got,G.kind);
 const nd=dexCheck(k);
 const tk=taskCheck(k);if(tk)notes.push('今日任務全部完成 +1');
 k.log.unshift({t:Date.now(),u:G.id,s:score,k:G.kind,n:got+(tk?1:0)});k.log=k.log.slice(0,300);
 save();setScr('result');if(score>=80)confetti();sfx(score>=80?'win':'ok');
 const stars=score===100?'⭐⭐⭐':score>=80?'⭐⭐':score>=50?'⭐':'💪';
 const total=got+(tk?1:0);
 paint(`<h1 class="center">${esc(G.title)}</h1><div class="score">${G.kind==='boss'?right+' / '+n:score+' 分'}</div><div class="center" style="font-size:40px">${stars}</div>
 ${owlSay(score===100?'全對！你真是小科學家！':score>=80?'好棒！只差一點點就全對了！':score>=50?'不錯喔！看看解說，下次會更好。':'沒關係，看看解說，我們再試一次！')}
 ${total?`<div class="card center"><b>得到 ${total} 張貼紙！</b><div>${'<span class="stk">⭐</span>'.repeat(total)}</div><button class="btn sun" onclick="stickerPage()">去領貼紙</button></div>`:''}
 ${notes.length?`<div class="note">${notes.map(esc).join('<br>')}</div>`:''}
 ${nd.length?`<div class="card center"><b>📒 新的圖鑑卡！</b><div>${nd.map(d=>`<span class="stk">${d[0]}</span>`).join('')}</div><button class="btn ghost small" onclick="dexPage()">去看看</button></div>`:''}
 ${G.mode==='test'?`<h2>📋 每一題</h2>${G.qs.map((P,i)=>`<div class="rev ${G.st[i].ok?'ok':'no'}"><b>${i+1}. ${G.st[i].ok?'✅':'❌'}</b> ${zyH(P.q.stem)}<details><summary>看解說</summary>${G.st[i].fbHtml}</details></div>`).join('')}`:''}
 <div class="row center" style="margin-top:14px">${['unit','mix','exam'].includes(G.kind)?`<button class="btn" onclick="start('${G.id}')">🔁 再玩一次</button>`:''}<button class="btn ghost" onclick="home()">🏠 回首頁</button></div>`);
 speak(score===100?'全對！太厲害了！':'你得到'+score+'分')}
function taskCheck(k){if(gotToday(k,'task'))return false;if(gotToday(k,'warm')&&gotToday(k,'unit')&&(gotToday(k,'rev')||gotToday(k,'game')||gotToday(k,'lab'))){setFlag(k,'task');award(k,1,'task');return true}return false}
function dexCheck(k){const out=[];if(k.dexDay.d!==today())k.dexDay={d:today(),n:0};

/* ---- 小遊戲 ---- */
function gameMenu(){setScr('games');const k=kid();paint(`<div class="top"><button class="btn small ghost" onclick="home()">⬅ 回首頁</button></div><h1>🎮 小遊戲</h1>
 ${owlSay(gotToday(k,'gamePaid')?'今天的小遊戲貼紙已經拿過了，還是可以繼續玩喔！':'小遊戲玩得好，一天可以拿 1 張貼紙。')}
 <div class="grid"><button class="tile" onclick="catchGame()"><span class="em">🥅</span>自然捕捉網<small>照規則抓東西</small></button><button class="tile" onclick="start('quick')"><span class="em">⚡</span>閃電是非<small>10 題 ○ ✕</small></button></div>`)}
function stopGame(){if(GM){GM.timers.forEach(clearTimeout);GM=null}}
function catchGame(){const g=kid().grade;setScr('catch');GM={rules:shuffle(CATCH_RULES.filter(r=>r.g.includes(g))).slice(0,5),ri:0,hit:0,miss:0,all:0,timers:[]};catchRound()}
function catchRound(){if(scr!=='catch'||!GM)return;const r=GM.rules[GM.ri];const yes=shuffle(r.yes).slice(0,4),no=shuffle(r.no).slice(0,4);
 GM.items=shuffle(yes.map(t=>({t,y:1})).concat(no.map(t=>({t,y:0}))));GM.left=yes.length;GM.all+=yes.length;
 paint(`<div class="qhead"><button class="btn small ghost" onclick="home()">✖</button><b class="sp">🥅 第 ${GM.ri+1} / ${GM.rules.length} 關</b><span>抓到 ${GM.hit}</span></div>
 <div class="card center" style="font-size:24px"><b>${esc(r.t)}</b></div>
 <div class="arena" id="arenaBox">${GM.items.map((it,j)=>`<button class="fall" id="fallItem${j}" style="left:${(j%4)*24+2}%;animation-duration:${R(70,100)/10}s;animation-delay:${(j*0.9).toFixed(1)}s" onclick="catchTap(${j})">${esc(it.t)}</button>`).join('')}</div>`);
 speak(r.t);GM.timers.push(setTimeout(()=>catchNext(),16000))}
function catchTap(j){if(scr!=='catch'||!GM)return;const it=GM.items[j];if(!it||it.got)return;it.got=1;const el=document.getElementById('fallItem'+j);
 if(it.y){GM.hit++;GM.left--;sfx('ok');if(el)el.classList.add('got');if(GM.left<=0){GM.timers.push(setTimeout(()=>catchNext(),700))}}
 else{GM.miss++;sfx('no');if(el)el.classList.add('miss');toast('「'+it.t+'」'+GM.rules[GM.ri].why)}
 const b=document.querySelector('.qhead span');if(b)b.textContent='抓到 '+GM.hit}
function catchNext(){if(scr!=='catch'||!GM)return;GM.timers.forEach(clearTimeout);GM.timers=[];GM.ri++;if(GM.ri<GM.rules.length)return catchRound();catchEnd()}
function catchEnd(){const k=kid(),sc=Math.max(0,Math.round((GM.hit-GM.miss*0.5)/GM.all*100));let got=0;setFlag(k,'game');
 if(sc>=60&&!gotToday(k,'gamePaid')){got=1;setFlag(k,'gamePaid');award(k,1,'game')}const tk=taskCheck(k);
 k.log.unshift({t:Date.now(),u:'catch',s:sc,k:'game',n:got+(tk?1:0)});k.log=k.log.slice(0,300);save();
 const h=GM.hit,m=GM.miss;stopGame();setScr('result');if(sc>=60)confetti();
 paint(`<h1 class="center">🥅 捕捉網結束！</h1><div class="score">${sc} 分</div><p class="center">抓對 ${h} 個，抓錯 ${m} 個</p>${got||tk?`<div class="card center"><b>得到 ${got+(tk?1:0)} 張貼紙！</b><br><button class="btn sun" onclick="stickerPage()">去領貼紙</button></div>`:''}<div class="row center"><button class="btn" onclick="catchGame()">🔁 再玩一次</button><button class="btn ghost" onclick="home()">🏠 回首頁</button></div>`)}

/* ---- 實驗室 ---- */
let LB=null;
function labRoom(){setScr('lab');const k=kid();paint(`<div class="top"><button class="btn small ghost" onclick="home()">⬅ 回首頁</button></div><h1>🧪 實驗室</h1>${owlSay('先猜猜看，再看實驗，最後想想原因。猜錯沒關係，科學家也常常猜錯！')}
 <div class="grid">${LABS.filter(l=>l.g.includes(k.grade)).map(l=>`<button class="tile" onclick="labGo('${l.id}')"><span class="em">${l.e}</span>${esc(l.n)}<small>${k.labs.includes(l.id)?'✅ 做過了':'還沒做'}</small></button>`).join('')}</div>`)}
function labGo(id){const L=LABS.find(x=>x.id===id);LB={L,step:1,pred:null,x:shuffle(L.x.o),tries:0,pick:[]};labDraw()}
function labDraw(){if(!LB)return;const L=LB.L;let h=`<div class="top"><button class="btn small ghost" onclick="labRoom()">⬅ 實驗室</button></div><h1>${L.e} ${esc(L.n)}</h1>`;
 if(LB.step===1)h+=`<div class="card"><b>① 先猜猜看</b><div class="stem">${zyH(L.p.q)}</div><div class="opts">${L.p.o.map((o,j)=>`<button class="opt" onclick="LB.pred=${j};LB.step=2;labDraw()">${zyH(o)}</button>`).join('')}</div><div class="muted">猜的不計分。</div></div>`;
 else{h+=`<div class="card"><b>② 看實驗</b><div class="muted">你猜：${esc(L.p.o[LB.pred])}</div><div class="scene ${LB.ran?'run':''}" id="sceneBox">${L.scene}</div><div class="cap">${LB.step>=3?zyH(L.cap):''}</div>${LB.step===2&&!LB.playing?`<div class="row center"><button class="btn" onclick="labPlay()">▶ 開始實驗</button></div>`:''}${LB.playing?'<div class="center muted">👀 仔細看……</div>':''}</div>`;
  if(LB.step>=3)h+=`<div class="card"><b>③ 想想原因</b><div class="stem">${zyH(L.x.q)}</div><div class="opts">${LB.x.map((o,j)=>`<button class="opt ${LB.done&&o.ok?'ok':LB.pick.includes(j)?'off':''}" onclick="labAns(${j})">${zyH(o.h)}</button>`).join('')}</div><div id="labFb">${LB.fb||''}</div>${LB.done?`<div class="row center" style="margin-top:10px"><button class="btn" onclick="labRoom()">完成 ✅</button></div>`:''}</div>`}
 paint(h)}
function labPlay(){if(!LB||LB.playing)return;LB.playing=true;labDraw();const L0=LB;setTimeout(()=>{if(LB===L0&&scr==='lab'){LB.step=3;LB.playing=false;labDraw();speak(LB.L.cap)}},1700);setTimeout(()=>{const s=$('#sceneBox');if(s&&LB&&scr==='lab'){void s.offsetWidth;s.classList.add('run');LB.ran=true}},60)}
function labAns(j){if(!LB||LB.done||LB.pick.includes(j))return;const o=LB.x[j];if(o.ok){LB.done=true;LB.fb=`<div class="fb good"><b>🎉 答對了！</b>${zyH(o.h)}</div>`;sfx('ok');const k=kid();if(!k.labs.includes(LB.L.id))k.labs.push(LB.L.id);setFlag(k,'lab');const tk=taskCheck(k);save();labDraw();speak('答對了！'+o.h);if(tk)toast('今日任務全部完成！得到 1 張貼紙')}
 else{LB.pick.push(j);LB.fb=`<div class="fb try"><b>🤔 再想想</b>${zyH(o.wy)}</div>`;sfx('no');labDraw();speak(o.wy)}}

 ${[2,3].map(g=>UNITS[g].map(u=>`<h3>${u.e} ${esc(u.n)}</h3><div class="dex">${(DEX[u.id]||[]).map((c,j)=>k.dex.includes(u.id+'#'+j)?`<button class="dexc" onclick="dexShow('${u.id}',${j})"><div class="em">${c[0]}</div><b>${zyH(c[1])}</b></button>`:`<div class="dexc lock"><div class="em">❔</div>還沒翻開</div>`).join('')}</div>`).join('')).join('')}`)}

function pinChangeOk(){if($('#pinOld').value!==S.pin)return toast('舊密碼不對');const a=$('#pinA').value,b=$('#pinB').value;if(!/^\d{4,8}$/.test(a))return toast('請輸入 4～8 位數字');if(a!==b)return toast('兩次不一樣');S.pin=a;save();closeModal();toast('密碼已更改')}

 const unitRows=k?[2,3].flatMap(g=>UNITS[g].map(u=>{const L=k.log.filter(x=>x.u===u.id);return `<tr><td>${u.e} ${esc(u.n)}</td><td>${L.length}</td><td>${k.best[u.id]!=null?k.best[u.id]:'—'}</td><td>${L.length?Math.round(L.reduce((s,x)=>s+x.s,0)/L.length):'—'}</td></tr>`})).join(''):'';
 const pend=S.kids.flatMap((kk,ki)=>kk.prizes.map((p,pi)=>[kk,ki,p,pi])).filter(x=>!x[2].given);
 paint(`<div class="top"><button class="btn small ghost" onclick="home()">⬅ 回首頁</button><span class="sp"></span><b>👪 家長區</b></div><div class="pz">
 <section><h3>👧 孩子</h3><table><tr><th>名字</th><th>年級</th><th>可用貼紙</th><th>金幣</th><th></th></tr>${S.kids.map((x,i)=>`<tr><td>${esc(x.nm)}${i===S.cur?' ⭐':''}</td><td><select onchange="kidGrade(${i},this.value)"><option value="2" ${x.grade===2?'selected':''}>二年級</option><option value="3" ${x.grade===3?'selected':''}>三年級</option></select></td><td>${pts(x)}</td><td>${coins(x)}</td><td><button class="btn small ghost" onclick="kidRename(${i})">改名</button> <button class="btn small rose" onclick="kidDel(${i})">刪除</button></td></tr>`).join('')}</table>${S.kids.length<6?'<button class="btn small" onclick="kidSetup()">➕ 新增孩子</button>':''}</section>
 ${k?`<section><h3>🏫 ${esc(k.nm)} 的學校進度</h3><p class="muted">勾選學校已經教過的單元，綜合練習和段考只會從勾選的單元出題。全部不勾＝全部都出。</p>${[2,3].map(g=>`<div><b>${GRADE_NAME[g]}</b><div class="chips">${UNITS[g].map(u=>`<label class="chip ${Array.isArray(k.prog)&&k.prog.includes(u.id)?'on':''}"><input type="checkbox" ${Array.isArray(k.prog)&&k.prog.includes(u.id)?'checked':''} onchange="progSet('${u.id}',this.checked)"> ${u.e} ${esc(u.n)}</label>`).join('')}</div></div>`).join('')}</section>
 <section><h3>📊 ${esc(k.nm)} 的學習分析</h3><table><tr><th>單元</th><th>次數</th><th>最高</th><th>平均</th></tr>${unitRows}</table>
 <p><b>各題型答對率：</b>${Object.keys(k.stat).filter(t=>TYPE_NAME[t]&&k.stat[t].n>0).map(t=>`${TYPE_NAME[t]}${Math.round(k.stat[t].ok/k.stat[t].n*100)}%（${k.stat[t].n} 題）`).join('、')||'還沒有資料'}</p>
 <p><b>錯題本：</b>${['2','3'].map(g=>GRADE_NAME[g]+' '+(k.wrong[g]||[]).length+' 題').join('、')}</p>
 ${(()=>{const my=['2','3'].flatMap(g=>k.wrong[g]||[]).map(w=>BYID[w.id]).filter(q=>q&&isMyth(q)).slice(0,5);return my.length?`<p><b>最近卡住的想法：</b></p><ul>${my.map(q=>`<li>${esc(q.stem)} → ${esc(q.right||'')}</li>`).join('')}</ul>`:''})()}</section>`:''}
 <section><h3>📅 這 7 天的貼紙來源</h3>${Object.keys(src).length?Object.entries(src).map(([a,b])=>`<div>${esc(a)}：${b} 張</div>`).join(''):'<p class="muted">這 7 天還沒有得到貼紙。</p>'}</section>
 <section><h3>🎁 獎品</h3>${pend.length?`<p><b>等待兌現：</b></p>${pend.map(([kk,ki,p,pi])=>`<div class="row">${esc(kk.nm)}：${esc(p.e)} ${esc(p.n)} <button class="btn small" onclick="giveGift(${ki},${pi})">✅ 已兌現</button></div>`).join('')}`:'<p class="muted">沒有等待兌現的獎品。</p>'}
 <p><b>禮物清單：</b></p>${S.gifts.map((g,j)=>`<div class="row">${esc(g.e)} ${esc(g.n)}（${g.coin?'💰 '+g.coin:'🌟 '+g.c}） <button class="btn small ghost" onclick="giftDel(${j})">刪除</button></div>`).join('')}

 <p><label><input type="checkbox" ${S.slotOff?'':'checked'} onchange="S.slotOff=!this.checked;save()"> 顯示神祕拉霸（一次 ${S.spinCost} 張貼紙；85% 體驗券、15% 貼紙禮物，抽不到金幣大獎）</label></p></section>
 ${k?`<section><h3>➕➖ 調整 ${esc(k.nm)} 的貼紙</h3><div class="row"><input id="adjN" type="number" min="1" max="50" value="1" style="width:90px"><input id="adjWhy" maxlength="20" placeholder="原因（例如：幫忙做家事）"><button class="btn small" onclick="adjSticker(1)">加貼紙</button><button class="btn small rose" onclick="adjSticker(-1)">扣貼紙</button></div></section>`:''}
 <section><h3>💾 備份與還原</h3><p>${persistInfo()}</p><p>上次備份：${S.lastBak?new Date(S.lastBak).toLocaleString('zh-TW'):'還沒有'}</p><p class="muted">⚠️ 備份檔裡有家長密碼和孩子的紀錄，請不要傳給別人。</p>
 <div class="row"><button class="btn small" onclick="exportBackup()">⬇️ 下載備份檔</button>${navigator.share?'<button class="btn small sky" onclick="shareBackup()">📤 分享備份檔</button>':''}<button class="btn small ghost" onclick="showBackupText()">📋 顯示備份文字</button></div>

 <p>語速：<input type="range" min="0.6" max="1.2" step="0.1" value="${S.rate||0.9}" onchange="S.rate=+this.value;save();speak('這是現在的語速')"> 聲音：<select onchange="S.voice=this.value;save();speak('你好，我是咕咕博士')"><option value="">自動選擇</option>${voiceList().map(v=>`<option ${v===S.voice?'selected':''}>${esc(v)}</option>`).join('')}</select></p>
 <p><button class="btn small ghost" onclick="pinChange()">🔑 更改家長密碼</button></p></section>

 <section><h3>📘 說明</h3>${guideHtml()}</section></div>`)}
function voiceList(){try{return speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang)).map(v=>v.name)}catch(e){return []}}
function guideHtml(){return `<ul><li><b>年級：</b>二年級入門是生活情境題（108 課綱一、二年級是生活課程，題目借用三年級自然的主題，難度較淺）；三年級對應三上的植物、磁鐵、空氣與風、溶解。</li>
 <li><b>貼紙規則：</b>10 題練習 100 分得 2 張、80 分以上得 1 張；刷新單元紀錄或完成錯題再練有努力獎 1 張（每局最多 1 張）；打倒魔王、小遊戲、今日任務各每天 1 張；段考同一份每天只計一次。實驗室、晨間觀察、圖鑑不發貼紙。</li>
 <li><b>金幣與禮物：</b>30 張貼紙可以換 1 枚金幣，3 枚金幣換大獎；也可以直接用貼紙換小禮物。這個遊戲的貼紙簿和數學小花園、國語小農場分開。</li>
 <li><b>錯題再練：</b>答錯的題目隔天才會出現；在錯題再練答對就會移出錯題本。</li>
 <li><b>是非題：</b>題目常是錯誤的說法，所以不會自動唸出來，孩子按 🔊 才唸；答完一定顯示正確說法。</li>
 <li><b>備份：</b>Safari 太久沒開可能清掉資料，請每週備份一次。兩台裝置可以用「合併」，貼紙不會重複算。</li></ul>

function unionBy(a,b,key){const m=new Map();for(const x of (a||[]).concat(b||[]))if(x&&!m.has(key(x)))m.set(key(x),x);return [...m.values()]}
function mergeKid(a,b){
 for(const f of ['earned','stk','spent'])a[f]=unionBy(a[f],b[f],x=>x.id).sort((x,y)=>x.t-y.t);
 const giv=new Set(a.prizes.concat(b.prizes).filter(p=>p.given).map(p=>p.id));a.prizes=unionBy(a.prizes,b.prizes,x=>x.id).sort((x,y)=>x.t-y.t);a.prizes.forEach(p=>{if(giv.has(p.id))p.given=true});
 for(const g of ['2','3']){const m=new Map();for(const w of (a.wrong[g]||[]).concat(b.wrong[g]||[])){if(!BYID[w.id]||RETIRED.includes(w.id))continue;const o=m.get(w.id);if(!o||w.d>o.d)m.set(w.id,w)}a.wrong[g]=[...m.values()].sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0).slice(0,60)}
 for(const t in b.stat){const x=a.stat[t],y=b.stat[t];if(!x||y.n>x.n)a.stat[t]=Object.assign({},y)}
 for(const id in b.seen)a.seen[id]=Math.max(a.seen[id]||0,b.seen[id]);
 a.dex=[...new Set(a.dex.concat(b.dex))];a.labs=[...new Set(a.labs.concat(b.labs))];
 for(const u in b.uday)a.uday[u]=[...new Set((a.uday[u]||[]).concat(b.uday[u]))].sort();
 for(const u in b.best)a.best[u]=Math.max(a.best[u]==null?-1:a.best[u],b.best[u]);
 for(const f in b.flags)if(!a.flags[f]||b.flags[f]>a.flags[f])a.flags[f]=b.flags[f];
 if(b.dexDay.d>a.dexDay.d||(b.dexDay.d===a.dexDay.d&&b.dexDay.n>a.dexDay.n))a.dexDay=Object.assign({},b.dexDay);
 a.log=unionBy(a.log,b.log,x=>x.t+'|'+x.u+'|'+x.s).sort((x,y)=>y.t-x.t).slice(0,300);
 if(b.progAt>a.progAt){a.prog=b.prog;a.progAt=b.progAt}
 return a}
