v":1,"code":"INe-Ⅱ-10","stem":"看平板很久，眼睛累了，要怎麼做？","pic":"📱👀","opts":[{"h":"停下來看看遠方","ok":true},{"h":"眼睛再靠近螢幕","wy":"靠越近，眼睛越要用力，會更累。"},{"h":"揉一揉眼睛繼續看","wy":"手上的髒東西可能跑進眼睛，而且眼睛還是沒有休息。"}],"why":{"cause":"眼睛也要休息，停下來看看遠方，眼睛會比較舒服。"},"note":"來源：G2-19"},{"id":"g2-play-039","u":"g2-play","type":"tf","lv":1,"code":"LIFE","stem":"打雷時，躲到空曠地方的大樹下最安全。","pic":"⚡🌳","opts":[{"h":"✕","ok":true},{"h":"○","wy":"很多人會想到樹下躲雨，可是高高的樹容易被雷打到。"}],"right":"打雷時要進到房子或車子裡，不要躲在大樹下。","why":{"cause":"打雷時要進到房子或車子裡，不要站在大樹下。"},"note":"來源：G2-20（改）"},{"id":"g2-play-040","u":"g2-play","type":"order","lv":1,"code":"INf-Ⅱ-6","stem":"教室裡發生地震，排出正確的順序。","pic":"🏫","ans":["感覺到地面搖晃","馬上趴下、躲到桌子下","抓穩桌腳，等搖晃停下來","聽老師指示，到空曠的地方"],"why":{"cause":"地震時先「趴下、掩護、穩住」，停了再聽老師的話離開。"},"note":"來源：G2-21（改） 常見錯誤：先跑出教室：搖晃時跑動容易被掉下來的東西打到，要先趴下、掩護。還在搖就離開桌子：要等搖晃停了才移動。"}],"passages":[]},"3":{"items":[{"id":"n3-air-001","u":"n3-air","type":"tw","lv":2,"code":"INa-Ⅱ-2","stem":"「把空寶特瓶蓋緊，裡面什麼都沒有。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"很多小朋友會這樣想，其實瓶子裡有空氣。"}],"reasons":[{"h":"瓶子裡裝滿看不見的空氣，捏一下還會彈回來","ok":true},{"h":"蓋緊後，空氣就被擋在外面了","wy":"蓋蓋子之前，空氣就已經在瓶子裡了。"},{"h":"看不到東西，就是什麼都沒有","wy":"空氣看不見，但會佔空間。"}],"right":"「空」的瓶子其實裝滿空氣，蓋緊後空氣就關在裡面。","why":{"cause":"「空」的瓶子其實裝滿空氣，蓋緊後空氣就關在裡面。"},"note":"依據：INa-Ⅱ-2：空氣佔有空間。"},{"id":"n3-air-002","u":"n3-air","type":"c","lv":2,"code":"INa-Ⅱ-2","stem":"杯底塞紙團，杯口朝下直直壓進水盆，紙團會濕嗎？","pic":"🥛📄","tag":"先猜再看","opts":[{"h":"不會濕，杯子裡的空氣擋住了水","ok":true},{"h":"會濕，水會灌滿杯子","wy":"杯子裡的空氣跑不出去，水進不到杯底。"},{"h":"只濕一半","wy":"只要直直壓下去，水只進到杯口附近一點點，碰不到紙團。"}],"why":{"cause":"杯子裡的空氣佔住位置，水進不去，紙團就是乾的。"},"note":"依據：INa-Ⅱ-2：空氣佔有空間。"},{"id":"n3-air-003","u":"n3-air","type":"c","lv":2,"code":"pa-Ⅱ-2","stem":"四組把塞了紙團的杯子倒扣、壓進水裡，只有一組紙團濕了，最可能是為什麼？","pic":"🥛📄","tag":"怪怪的實驗","opts":[{"h":"那組把杯子壓歪了，空氣跑出去","ok":true},{"h":"那組的紙比較會吸水","wy":"紙再會吸水，碰不到水也不會濕。"},{"h":"那組的水比較冷","wy":"水冷不冷，和水會不會跑進杯子無關。"},{"h":"那組壓得比較慢","wy":"只要直直往下壓，慢慢壓紙團一樣是乾的。"}],"why":{"cause":"杯子一歪，空氣冒出去，水就跑進來佔位置。"},"note":"依據：pa-Ⅱ-2、INa-Ⅱ-2：杯中空氣佔住空間，水才進不去；空氣跑掉，水就進來。"},{"id":"n3-air-004","u":"n3-air","type":"c","lv":2,"code":"INa-Ⅱ-2","stem":"漏斗插進瓶口，用黏土把縫封緊，從漏斗倒水，水會怎樣？","pic":"💧","tag":"先猜再看","opts":[{"h":"很難流進瓶子","ok":true},{"h":"一下就流進去","wy":"瓶子裡的空氣沒有地方跑，會擋住水。"},{"h":"從瓶底漏出來","wy":"瓶底沒有洞，水不會漏出來。"}],"why":{"cause":"瓶子不是空的，裡面的空氣沒地方跑，水就很難進去。"},"note":"依據：INa-Ⅱ-2：空氣佔有空間。"},{"id":"n3-air-005","u":"n3-air","type":"c","lv":1,"code":"INa-Ⅱ-2","stem":"包裝用的泡泡紙，為什麼能保護容易破的東西？","pic":"📦","opts":[{"h":"小泡泡裡包著空氣，壓下去像軟墊","ok":true},{"h":"泡泡紙很黏，可以黏住東西","wy":"泡泡紙不黏，是靠小泡泡保護東西。"},{"h":"泡泡紙很硬，像盒子一樣","wy":"泡泡紙一捏就扁，是軟軟的，不是硬的。"}],"why":{"cause":"小泡泡裡的空氣被壓時會撐回來，像小墊子一樣。"},"note":"依據：INa-Ⅱ-2：空氣可以被壓縮，壓縮後會回彈。"},{"id":"n3-air-006","u":"n3-air","type":"c","lv":2,"code":"INa-Ⅱ-2","stem":"堵住沒有針頭的針筒口，一支裝空氣、一支裝水，哪支的活塞推得進去？","opts":[{"h":"裝空氣的","ok":true},{"h":"裝水的","wy":"水很難被壓縮，活塞幾乎推不動。"},{"h":"兩支都推得進去","wy":"裝水的那支推不太動。"},{"h":"兩支都推不動","wy":"裝空氣的那支可以推進去一段。"}],"why":{"cause":"空氣可以被壓縮，水很難被壓縮。"},"note":"依據：INa-Ⅱ-2：空氣可以被壓縮；水不容易被壓縮。"},{"id":"n3-air-007","u":"n3-air","type":"c","lv":2,"code":"INa-Ⅱ-2","stem":"兩個蓋緊的寶特瓶，一瓶只有空氣、一瓶裝滿水，哪瓶比較容易捏凹？","pic":"💧","opts":[{"h":"只有空氣的那瓶","ok":true},{"h":"裝滿水的那瓶","wy":"水很難被壓縮，蓋緊後瓶子幾乎捏不下去。"},{"h":"兩瓶一樣難捏","wy":"空氣可以被壓小一些，所以那瓶捏得下去。"}],"why":{"cause":"空氣可以被壓縮，水很難被壓縮。"},"note":"依據：INa-Ⅱ-2：空氣佔空間、可以被壓縮；水不容易被壓縮。"},{"id":"n3-air-008","u":"n3-air","type":"tw","lv":2,"code":"INa-Ⅱ-2","stem":"「坐在充氣床墊上會凹下去，站起來後，床墊又鼓回來。」對嗎？","pic":"🛏️","opts":[{"h":"○","ok":true},{"h":"✕","wy":"只要沒有漏氣，充氣床墊都會鼓回來。"}],"reasons":[{"h":"主要是裡面被擠壓的空氣把床墊撐回去","ok":true},{"h":"床墊會自己長回來","wy":"床墊不是生物，不會長。"},{"h":"站起來時又灌進了新的空氣","wy":"沒有打氣，空氣沒有變多，是被壓的空氣把床墊撐回去。"}],"right":"空氣被壓縮後會回彈，所以充氣床墊坐起來軟軟的、有彈性。","why":{"cause":"空氣被壓縮後會回彈，所以充氣床墊坐起來軟軟的、有彈性。"},"note":"依據：INa-Ⅱ-2、INd-Ⅱ-9：空氣可以被壓縮，放開後會回彈。"},{"id":"n3-air-009","u":"n3-air","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"（請大人打氣，不超過球上寫的氣量）打氣次數會不會影響球彈多高？怎麼比才公平？","pic":"🏀","ans":{"change":"從扁扁的球開始，打氣 5 下、10 下、15 下","keep":["同一顆球","從一樣的高度放手","掉在同一塊地面","只放手不往下丟"],"extra":["球上貼什麼顏色的貼紙"]},"note":"常見錯誤：換一顆比較大的球來打 15 下（同時改了兩個條件）。依據：pe-Ⅱ-1、INa-Ⅱ-2：公平比較要控制變因；空氣可以被壓縮進球裡。","why":{"cause":"只改打氣的次數，其他都一樣，比出來的差別才有意義。","myth":"選「換一顆大球」：球和空氣一起改變，就分不出是誰造成的。／選「貼紙顏色」：貼紙顏色不會影響球彈多高。"}},{"id":"n3-air-010","u":"n3-air","type":"sort","lv":1,"code":"INa-Ⅱ-2","stem":"分一分：這是「空氣」還是「水」的特性？","pic":"💨💧","ans":{"空氣":["眼睛看不見","流動起來就是風","揮一揮，就能把塑膠袋撐鼓"],"水":["眼睛看得見","倒在桌上會沿著桌面流走","可以喝"]},"why":{"cause":"空氣和水都佔空間，空氣看不見，水看得見。","myth":"把「眼睛看不見」放進水：水是透明的，但看得見，空氣才看不見。／把「揮一揮，就能把塑膠袋撐鼓」放進水：揮一揮就鼓起來的塑膠袋，裡面裝的是空氣，水不會自己跑進袋子。"},"note":"依據：INa-Ⅱ-2：空氣看不見、佔空間；水看得見、會流動。"},{"id":"n3-air-011","u":"n3-air","type":"tw","lv":2,"code":"INd-Ⅱ-4","stem":"「風停了，空氣也就不見了。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"很多小朋友會這樣想，其實沒有風時，我們一樣在呼吸空氣。"}],"reasons":[{"h":"空氣還在，只是沒有流動","ok":true},{"h":"空氣只有颳風時才有","wy":"關著窗的房間沒有風，但到處都有空氣。"},{"h":"風停了，空氣都跑到天上去了","wy":"空氣一直在我們身邊，沒有跑走。"}],"right":"空氣一直都在，流動起來才變成風。","why":{"cause":"空氣一直都在，流動起來才變成風。"},"note":"依據：INd-Ⅱ-4：空氣流動產生風；不流動時空氣仍在。"},{"id":"n3-air-012","u":"n3-air","type":"c","lv":2,"code":"INc-Ⅱ-5","stem":"兩支沒有針頭的針筒用細管子連起來，裡面都是空氣。推左邊的活塞，右邊會怎樣？","opts":[{"h":"被推出來","ok":true},{"h":"被吸進去","wy":"左邊推進去的空氣擠到右邊，會把右邊活塞往外推。"},{"h":"一動也不動","wy":"空氣把推的力量傳過去了，右邊會動。"}],"why":{"cause":"被推的空氣沿著管子跑過去，把右邊的活塞推出來。"},"note":"依據：INc-Ⅱ-5：空氣能傳送動力，讓物體移動。（圖示畫沒有針頭的針筒）"},{"id":"n3-air-013","u":"n3-air","type":"tw","lv":2,"code":"INc-Ⅱ-5","stem":"「兩支針筒用細管子連起來，裡面裝滿水，推左邊，右邊的活塞也會被推出來。」對嗎？","opts":[{"h":"○","ok":true},{"h":"✕","wy":"水一樣會把右邊的活塞推出來。"}],"reasons":[{"h":"水也能把推的力量傳過去","ok":true},{"h":"水太重了，推不過去","wy":"水在管子裡會被推著走，力量可以傳過去。"},{"h":"只有空氣才能傳送力量","wy":"水和空氣都能傳送力量。"}],"right":"水和空氣都能把推的力量傳過去，讓別的東西動起來。","why":{"cause":"水和空氣都能把推的力量傳過去，讓別的東西動起來。"},"note":"依據：INc-Ⅱ-5：水和空氣都能傳送動力。（圖示畫沒有針頭的針筒）"},{"id":"n3-air-014","u":"n3-air","type":"c","lv":2,"code":"INc-Ⅱ-5","stem":"吹飽的氣球綁在玩具小車上，氣球口朝後，放開後小車會往哪裡跑？","pic":"🎈🚗","tag":"先猜再看","opts":[{"h":"往前跑，和噴氣的方向相反","ok":true},{"h":"往後跑，跟著噴氣的方向","wy":"空氣往後衝，會把車子往反方向推。"},{"h":"停在原地不動","wy":"衝出來的空氣有推力，會讓車子動起來。"}],"why":{"cause":"空氣往後噴出，把小車往前推，空氣可以傳送動力。"},"note":"依據：INc-Ⅱ-5：空氣能傳送動力，讓物體移動。"},{"id":"n3-air-015","u":"n3-air","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"小安想知道氣球吹多大，會不會影響氣球車跑多遠，怎麼比才公平？","pic":"🎈🚗","ans":{"change":"氣球吹氣的次數（吹得多大）","keep":["同一台小車","同一顆氣球","同樣的起點","同一種地面","放手時不推車"],"extra":["氣球的顏色"]},"note":"常見錯誤：吹大氣球時換一台比較輕的小車（同時改了兩個條件）。依據：pe-Ⅱ-1、INc-Ⅱ-5：公平比較要控制變因；空氣能傳送動力。","why":{"cause":"一次只改氣球大小，其他都一樣，才知道差別從哪裡來。","myth":"選「換一台小車」：車子和氣球一起改變，就分不出是誰造成的。／選「氣球顏色」：同一顆氣球，顏色不會影響車子跑多遠。"}},{"id":"n3-air-016","u":"n3-air","type":"c","lv":2,"code":"INc-Ⅱ-5","stem":"阿哲把紙火箭套在空寶特瓶口，用力一捏瓶子，紙火箭會怎樣？","pic":"🚀","tag":"先猜再看","opts":[{"h":"被瓶子裡衝出來的空氣推飛出去","ok":true},{"h":"一動也不動","wy":"捏瓶子時，瓶裡的空氣被擠出去，會推動紙火箭。"},{"h":"被吸進瓶子裡","wy":"捏下去時空氣是往外衝，不是往裡吸。"}],"why":{"cause":"衝出來的空氣把紙火箭推飛。不要對著別人的臉發射喔。"},"note":"依據：INc-Ⅱ-5：空氣能傳送動力，讓物體移動。"},{"id":"n3-air-017","u":"n3-air","type":"tw","lv":2,"code":"INc-Ⅱ-5","stem":"「用同一個瓶子和同一支紙火箭，捏得越用力，紙火箭通常飛得越遠。」對嗎？","pic":"🚀","opts":[{"h":"○","ok":true},{"h":"✕","wy":"同一個瓶子和火箭，用力捏時火箭通常飛得比較遠。"}],"reasons":[{"h":"捏得越用力，衝出來的空氣越快，推的力量越大","ok":true},{"h":"用力捏會讓紙火箭變輕","wy":"捏的是瓶子，紙火箭的重量沒有改變。"},{"h":"紙火箭聽到捏瓶子的聲音會飛比較遠","wy":"紙火箭聽不到聲音，是空氣在推它。"}],"right":"空氣衝得越快，推紙火箭的力量越大，就飛得越遠。","why":{"cause":"空氣衝得越快，推紙火箭的力量越大，就飛得越遠。"},"note":"依據：INc-Ⅱ-5：空氣能傳送動力，推得越用力，物體動得越多。"},{"id":"n3-air-018","u":"n3-air","type":"sort","lv":1,"code":"INd-Ⅱ-8","stem":"分一分：哪些「靠風力」才會動？","pic":"⛵🪁","ans":{"靠風力":["風車","帆船","風箏"],"不靠風力":["腳踏車","溜滑梯","盪鞦韆"]},"why":{"cause":"風車、帆船、風箏都要有風推，才會動起來。","myth":"把「腳踏車」放進靠風力：腳踏車是靠人踩踏板才前進的。／把「帆船」放進不靠風力：帆船的帆就是用來接住風的。"},"note":"依據：INd-Ⅱ-8、INc-Ⅱ-5：風力是一種力，能推動物體。"},{"id":"n3-air-019","u":"n3-air","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"（大人開關電扇，電扇放離水遠的乾地）帆的大小會不會影響船跑多遠？怎麼比才公平？","pic":"⛵","ans":{"change":"帆的大小","keep":["同一台電風扇","電風扇開同一段","電風扇和起點的距離","一樣的船身","從同樣的起點出發","用同一盆水"],"extra":["做實驗那天穿什麼衣服"]},"note":"常見錯誤：船身也換成不同大小（同時改了兩個條件）。依據：pe-Ⅱ-1、INc-Ⅱ-5：一次只改變一個條件，才能看出它的影響。（只當情境題，不做成要孩子動手的實驗任務）","why":{"cause":"電扇的插座和開關都交給大人。一次只改帆的大小，才知道差別是帆造成的。","myth":"選「船身也換大小」：同時改兩個條件，就分不出是帆還是船身造成的差別。／選「穿什麼衣服」：衣服不會影響船被風推多遠。"}},{"id":"n3-air-020","u":"n3-air","type":"tw","lv":2,"code":"INd-Ⅱ-8","stem":"「同一個紙風車放在風裡，轉得越快，表示風越強。」對嗎？","pic":"💨","opts":[{"h":"○","ok":true},{"h":"✕","wy":"同一個風車，只有風變強，它才會轉得更快。"}],"reasons":[{"h":"風越強，推動扇葉的力量越大","ok":true},{"h":"風車轉得快，會自己做出更強的風","wy":"是風讓風車轉，不是風車讓風變強。"},{"h":"紙風車越新轉得越快","wy":"題目說的是同一個風車，新舊沒有改變。"}],"right":"風越大，推動風車越用力，所以可以用風車來比風的大小。","why":{"cause":"風越大，推動風車越用力，所以可以用風車來比風的大小。"},"note":"依據：INd-Ⅱ-8、INc-Ⅱ-5：風力能推動物體，風越強推得越用力。"},{"id":"n3-air-021","u":"n3-air","type":"order","lv":1,"code":"INc-Ⅱ-5","stem":"排一排：做一個紙風車。","pic":"✂️","ans":["剪一張正方形的紙","從四個角往中心剪開，不要剪到中心","每隔一個角，把紙角摺到中心","請大人用圖釘把中心固定在筷子上","拿到有風的地方，看它轉"],"why":{"cause":"做好的紙風車，風越大轉得越快，可以拿來看風的大小。","myth":"把「摺到中心」排在「剪開」前面：四個角還沒剪開，就摺不出風車的扇葉。"},"note":"依據：INc-Ⅱ-5、INd-Ⅱ-8：流動的空氣能推動扇葉轉動。"},{"id":"n3-air-022","u":"n3-air","type":"c","lv":1,"code":"INd-Ⅱ-7","stem":"強風把雨傘吹得翻過去，走路也要很用力，這時候風力強還是弱？","pic":"☂️💨","opts":[{"h":"風力很強","ok":true},{"h":"風力很弱","wy":"弱風只會讓樹葉輕輕搖，吹不翻雨傘。"},{"h":"完全沒有風","wy":"雨傘被吹翻、走路吃力，表示風正在用力吹。"}],"why":{"cause":"看東西被吹動得多厲害，就能判斷風力大小。"},"note":"依據：INd-Ⅱ-7、INd-Ⅱ-8：風力大小可以從物體被吹動的情形判斷。"},{"id":"n3-air-023","u":"n3-air","type":"order","lv":1,"code":"INd-Ⅱ-7","stem":"排一排：風力由小到大。","pic":"🌳💨","ans":["樹葉一動也不動","樹葉輕輕搖","小樹枝搖動、旗子飄起來","大樹枝搖晃、撐傘很吃力","整棵大樹搖動、走路站不穩"],"why":{"cause":"看樹和旗子動得多用力，就能比較風的大小。","myth":"把「撐傘很吃力」排在「樹葉輕輕搖」前面：撐傘吃力表示風已經很大，要排在後面。"},"note":"依據：INd-Ⅱ-7、INd-Ⅱ-8：風力大小可以從物體擺動判斷。"},{"id":"n3-air-024","u":"n3-air","type":"c","lv":1,"code":"INd-Ⅱ-7","stem":"把一條細紙條黏在筷子頭上舉到戶外，風越大，紙條會怎樣？","pic":"🎏","opts":[{"h":"被吹得越斜、越飄起來","ok":true},{"h":"垂得越直","wy":"沒有風時，紙條才會直直垂下。"},{"h":"變得越短","wy":"風不會讓紙條變短，只會把它吹斜。"}],"why":{"cause":"風越大，把紙條推得越高，可以用來比較風力。"},"note":"依據：INd-Ⅱ-7、INd-Ⅱ-8：風力大小可以從物體被吹動的情形判斷。"},{"id":"n3-air-025","u":"n3-air","type":"tw","lv":2,"code":"INd-Ⅱ-1","stem":"「同一個地方，早上和下午的風一定一樣大。」對嗎？","pic":"🚩","opts":[{"h":"✕","ok":true},{"h":"○","wy":"早上和下午去看旗子，飄的樣子常常不一樣。"}],"reasons":[{"h":"風力隨時會改變，要觀察和記錄才知道","ok":true},{"h":"只有颱風天，風才會變大變小","wy":"平常的日子，風也會一下大、一下小。"},{"h":"早上和下午是同一天，風就一樣大","wy":"同一天裡，風也會一下大、一下小。"}],"right":"風力常常改變，所以觀察風的時候要記下時間。","why":{"cause":"風力常常改變，所以觀察風的時候要記下時間。"},"note":"依據：INd-Ⅱ-1、INd-Ⅱ-7：天氣的改變有快有慢，風力可以觀察記錄。"},{"id":"n3-air-026","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-2","stem":"柚子要記錄一個星期的風力，哪一種做法最好？","pic":"📝","opts":[{"h":"每天在同一個地點、同一個時間，用同一個方法觀察","ok":true},{"h":"每天換不同的地點觀察","wy":"大樓旁和操場的風本來就不一樣，比不出每天的變化。"},{"h":"想到的時候才去看一下","wy":"時間不固定，紀錄就不能互相比較。"}],"why":{"cause":"地點、時間、方法都一樣，每天的紀錄才能拿來比較。"},"note":"依據：INd-Ⅱ-2、pe-Ⅱ-2：改變可以用一致的方法觀察和記錄。"},{"id":"n3-air-027","u":"n3-air","type":"c","lv":1,"code":"INd-Ⅱ-8","stem":"颱風要來了，煜煜家把陽台的盆栽搬進屋裡，為什麼？","pic":"🌀","opts":[{"h":"強風可能把盆栽吹倒、吹下樓","ok":true},{"h":"盆栽怕被雨淋濕","wy":"盆栽淋一點雨沒關係，真正危險的是強風把盆栽吹落。"},{"h":"盆栽晚上會冷","wy":"搬盆栽是因為颱風，不是因為天黑。"}],"why":{"cause":"強風的力量很大，會吹倒、吹落東西，要先收好。"},"note":"依據：INd-Ⅱ-8：風力是一種力，強風能推動、吹倒物體。"},{"id":"n3-air-028","u":"n3-air","type":"sort","lv":1,"code":"INd-Ⅱ-8","stem":"分一分：風帶來的「好處」和「麻煩」。","pic":"💨","ans":{"好處":["吹乾晾的衣服","讓風箏飛上天","推動大風車發電","夏天吹來涼涼的風"],"麻煩":["颱風吹倒路樹","把雨傘吹翻","把陽台的盆栽吹落"]},"why":{"cause":"同樣是風，適當的風很有用，太強的風就可能造成危險。","myth":"把「推動大風車發電」放進麻煩：大風車就是要靠風才能發電。／把「把雨傘吹翻」放進好處：太強的風會吹壞東西，是麻煩。"},"note":"依據：INd-Ⅱ-8、INe-Ⅱ-1：風力能推動物體，風和生活環境互相影響。"},{"id":"n3-air-029","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-8","stem":"以前的農夫把稻穀和碎殼一起往上拋，風一吹，哪一樣會被吹得比較遠？","pic":"🌾","opts":[{"h":"又輕又薄的碎殼","ok":true},{"h":"重重的稻穀","wy":"稻穀比較重，風吹不太動，會先掉下來。"},{"h":"兩樣一樣遠","wy":"又輕又薄的碎殼比較容易被風吹走，會飛得比較遠。"}],"why":{"cause":"碎殼被風吹走，稻穀掉下來，風就幫忙把兩樣分開了。"},"note":"依據：INd-Ⅱ-8、INb-Ⅱ-2：風力能推動物體；可以利用性質的差異分離物質。"},{"id":"n3-air-030","u":"n3-air","type":"tw","lv":2,"code":"INa-Ⅱ-8","stem":"「海邊大大的白色風車，是用電讓扇葉轉，吹出風來。」對嗎？","pic":"⚡","opts":[{"h":"✕","ok":true},{"h":"○","wy":"電風扇才是用電吹出風；海邊的大風車剛好相反。"}],"reasons":[{"h":"是風推動扇葉轉，用來發電","ok":true},{"h":"它和電風扇一樣，是用來吹涼的","wy":"大風車在海邊空曠處，不是給人吹涼的。"},{"h":"它是用來把海鳥趕走的","wy":"大風車是為了發電才蓋的。"}],"right":"風讓大風車的扇葉轉動，再把轉動變成電，這叫風力發電。","why":{"cause":"風讓大風車的扇葉轉動，再把轉動變成電，這叫風力發電。"},"note":"依據：INa-Ⅱ-8、INc-Ⅱ-5：風能推動扇葉，是生活中可利用的能源。"},{"id":"n3-air-031","u":"n3-air","type":"c","lv":1,"code":"INd-Ⅱ-8","stem":"放風箏要選什麼樣的地方？","pic":"🪁","opts":[{"h":"空曠、有風、遠離電線的地方","ok":true},{"h":"有很多大樹的公園小路","wy":"風箏線容易纏在樹上，風也被樹擋住了。"},{"h":"車子很多的馬路邊","wy":"車子多很危險，而且常常有電線。"}],"why":{"cause":"空曠的地方風比較順，遠離電線和馬路才安全。"},"note":"依據：INd-Ⅱ-8：風力能把風箏舉高；放風箏要注意安全。"},{"id":"n3-air-032","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-8","stem":"兩張一樣的紙，一張攤平、一張揉成小團，從同樣高度同時放手，哪張先落地？","pic":"📄","tag":"先猜再看","opts":[{"h":"揉成小團的","ok":true},{"h":"攤平的","wy":"攤平的紙會被下面的空氣擋住，飄飄的慢慢落下。"},{"h":"同時落地","wy":"兩張一樣重，可是攤平的被空氣擋得比較多，落得比較慢。"}],"why":{"cause":"空氣雖然看不見，卻會擋住東西；攤開的紙被擋住比較多，所以落得慢。"},"note":"依據：INd-Ⅱ-8、INa-Ⅱ-2：空氣會擋住在空氣中移動的物體。"},{"id":"n3-air-033","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-7","stem":"操場的旗子往南飄，現在吹的是什麼風？","pic":"🚩","opts":[{"h":"北風","ok":true},{"h":"南風","wy":"南風從南方吹來，會讓旗子往北飄。"},{"h":"東風","wy":"東風會讓旗子往西飄。"},{"h":"西風","wy":"西風會讓旗子往東飄。"}],"why":{"cause":"旗子往南飄，表示風從北方吹來，叫北風。"},"note":"依據：INd-Ⅱ-7：風向是指風吹來的方向。"},{"id":"n3-air-034","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-7","stem":"箭頭型風向儀的箭頭指向北方，現在吹的是什麼風？","pic":"💨","opts":[{"h":"北風","ok":true},{"h":"南風","wy":"很多小朋友會以為箭頭指的是風吹去的方向，其實箭頭指著風吹來的方向。"},{"h":"東風","wy":"箭頭指北，和東方無關。"}],"why":{"cause":"風向儀的箭頭會轉向風吹來的方向，箭頭指北就是北風。"},"note":"依據：INd-Ⅱ-7：風向可以用儀器測得，風向是指風吹來的方向。（美術備註：圖示用箭頭型風向儀，不用風向袋）"},{"id":"n3-air-035","u":"n3-air","type":"tw","lv":2,"code":"INd-Ⅱ-7","stem":"「北風就是往北邊吹的風。」對嗎？","pic":"💨","opts":[{"h":"✕","ok":true},{"h":"○","wy":"很多小朋友會這樣想，其實風的名字是看風從哪裡來。"}],"reasons":[{"h":"風向是指風「吹來」的方向，北風是從北方吹來的","ok":true},{"h":"北風一定比較冷，和方向無關","wy":"北風的名字講的是方向，不是冷不冷。"},{"h":"風往哪裡吹，就叫什麼風","wy":"剛好說反了，要看風從哪裡吹來。"}],"right":"北風從北方吹來，會把旗子吹向南方。","why":{"cause":"北風從北方吹來，會把旗子吹向南方。"},"note":"依據：INd-Ⅱ-7：風向是指風吹來的方向。"},{"id":"n3-air-036","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-7","stem":"風向袋是一頭大開口、一頭小開口的布袋。被風吹鼓時，大開口會朝向哪裡？","pic":"💨","opts":[{"h":"風吹來的方向","ok":true},{"h":"風吹去的方向","wy":"那是小開口、尾巴飄去的方向。"},{"h":"一直朝向北方","wy":"風向袋會跟著風轉，它不是指北針。"}],"why":{"cause":"風從大開口灌進去，所以大開口對著風吹來的方向。"},"note":"依據：INd-Ⅱ-7：風向可以用簡單的器材觀察。"},{"id":"n3-air-037","u":"n3-air","type":"c","lv":2,"code":"INd-Ⅱ-7","stem":"沒有旗子也沒有樹，怎麼知道風從哪邊吹來？","pic":"☝️💧","opts":[{"h":"用水把手指沾濕舉起來，覺得最涼的那一邊","ok":true},{"h":"看自己的影子在哪一邊","wy":"影子跟太陽在哪裡有關，跟風從哪裡來無關。"},{"h":"聽鳥叫聲從哪裡來","wy":"鳥在哪裡叫，不能告訴我們風從哪裡吹來。"}],"why":{"cause":"風吹到的那一面，手指上的水乾得快，會覺得特別涼。"},"note":"依據：INd-Ⅱ-7、tr-Ⅱ-1：風向可以用簡單方法觀察。"},{"id":"n3-air-038","u":"n3-air","type":"c","lv":1,"code":"INc-Ⅱ-4","stem":"面向北方站好，背後是哪一方？","pic":"🧭","opts":[{"h":"南方","ok":true},{"h":"東方","wy":"面向北方時，東方在右手邊。"},{"h":"西方","wy":"面向北方時，西方在左手邊。"},{"h":"北方","wy":"北方在你的前面，不在背後。"}],"why":{"cause":"北和南相對，面向北方，背後就是南方。"},"note":"依據：INc-Ⅱ-4：用方向表示位置。"},{"id":"n3-air-039","u":"n3-air","type":"sort","lv":2,"code":"INc-Ⅱ-4","stem":"分一分：這些方向是「東方」還是「西方」？","pic":"🧭","ans":{"東方":["面向北方時的右手邊","面向南方時的左手邊","東風吹來的方向","背對西方時面向的方向"],"西方":["面向北方時的左手邊","面向南方時的右手邊","西風吹來的方向","背對東方時面向的方向"]},"why":{"cause":"東和西相對、南和北相對；風的名字就是它吹來的方向。","myth":"把「面向南方時的左手邊」放進西方：轉身面向南方，左右手就和面向北方時相反，左手邊是東。／把「東風吹來的方向」放進西方：東風就是從東方吹來的風。"},"note":"依據：INc-Ⅱ-4、INd-Ⅱ-7：用方向表示位置；風向是風吹來的方向。"},{"id":"n3-air-040","u":"n3-air","type":"label","lv":2,"code":"INc-Ⅱ-4","stem":"方位圖的上方已經寫好「北」，把「南」「東」「西」三張名牌貼到圖的另外三個位置。","ans":{"pic":"🧭","spots":[{"d":"① 圖的下方","k":"南"},{"d":"② 圖的右方","k":"東"},{"d":"③ 圖的左方","k":"西"}]},"why":{"cause":"上北、下南、左西、右東。","myth":"把「東」貼在左方：很多小朋友會把東西貼反，記得面向北方時，右手是東。／把「南」貼在左右兩邊：南和北是相對的，北在上方，南就在下方。"},"note":"依據：INc-Ⅱ-4：用方向表示位置。"},{"id":"n3-dis-001","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-2","stem":"冬天泡黑糖水，想讓它溶得最快（這不是公平比賽，只想找最快的辦法），可以怎麼做？","pic":"🥄","opts":[{"h":"用溫水，再攪拌","ok":true},{"h":"用冰水，放著不動","wy":"水冷又不攪拌，溶得最慢。"},{"h":"多加一些黑糖","wy":"要溶的糖變多，反而要更久才溶完。"}],"why":{"cause":"水溫高、有攪拌，糖都會溶得比較快；兩個一起用最快。"}},{"id":"n3-dis-002","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-3","stem":"兩杯一樣的溫水，一杯放方糖、一杯放一樣多的砂糖，都不攪拌。哪杯先溶完？","opts":[{"h":"砂糖那杯","ok":true},{"h":"方糖那杯","wy":"方糖是一大塊，只有外面碰得到水，溶得比較慢。"},{"h":"兩杯一定同時溶完","wy":"兩杯只差糖的大小，顆粒小的會比較快。"}],"why":{"cause":"顆粒小，碰到水的地方多，溶得比較快。"}},{"id":"n3-dis-003","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","stem":"把沙子倒進水裡攪拌，等一下會看到什麼？","opts":[{"h":"沙子沉到杯底","ok":true},{"h":"沙子溶在水裡看不見","wy":"沙子不會溶，攪完還是看得到一粒一粒。"},{"h":"沙子浮在水面上","wy":"沙子比水重，會沉下去。"}],"why":{"cause":"沙子不會溶在水裡，等一下就沉到杯底。"}},{"id":"n3-dis-004","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-3","stem":"喬妹一直加鹽到一杯水裡，每次都攪拌，加到後來會怎樣？","pic":"🧂","opts":[{"h":"杯底開始有鹽，怎麼攪都溶不掉","ok":true},{"h":"加多少都會溶完","wy":"很多小朋友這樣想，其實一杯水能溶的鹽有限。"},{"h":"鹽會浮在水面上","wy":"溶不掉的鹽會沉在杯底。"}],"why":{"cause":"一杯水能溶的鹽有限，太多就會留在杯底。"}},{"id":"n3-dis-005","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","stem":"一小匙麵粉加進一杯水裡攪拌，看起來會怎樣？","opts":[{"h":"白白混濁，放久了有粉沉在杯底","ok":true},{"h":"像鹽水一樣清清透明","wy":"溶解的東西才會看起來透明，麵粉不容易溶。"},{"h":"麵粉全部浮在水面上","wy":"攪過以後麵粉會散在水裡，放久了會沉下去。"}],"why":{"cause":"水變混濁、放久會沉澱，表示麵粉不容易溶。"}},{"id":"n3-dis-006","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","stem":"一小匙鹽放進水裡，攪到完全溶解後，水看起來怎樣？","pic":"🧂","opts":[{"h":"清清透明，看不到鹽粒","ok":true},{"h":"白白混濁，像牛奶一樣","wy":"混濁表示東西沒有溶，溶解後的鹽水是透明的。"},{"h":"杯底還有一層白白的鹽","wy":"完全溶解了，就看不到鹽粒。"}],"why":{"cause":"鹽溶解後變得很小很小，看不見，但還在水裡。"}},{"id":"n3-dis-007","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","tag":"先猜再看","stem":"把我們自己泡的鹽水倒在盤子上曬乾，盤底會出現什麼？","pic":"☀️","opts":[{"h":"白色的鹽粒","ok":true},{"h":"什麼都沒有","wy":"很多小朋友以為鹽溶了就消失了，其實鹽還在水裡。"},{"h":"一層黑黑的沙子","wy":"我們泡的是乾淨的鹽水，曬出來的是白色的鹽。"}],"why":{"cause":"水跑到空氣中，溶在水裡的鹽留了下來。"}},{"id":"n3-dis-008","u":"n3-dis","type":"c","lv":1,"code":"pe-Ⅱ-2","stem":"實驗時要知道瓶子裡是什麼味道，正確的聞法是？","pic":"👃","opts":[{"h":"用手把味道輕輕搧向鼻子","ok":true},{"h":"鼻子湊到瓶口用力吸","wy":"如果是刺鼻的東西，會傷到鼻子。"},{"h":"倒一點在手上舔舔看","wy":"不知道是什麼的東西，絕對不能嚐。"}],"why":{"cause":"用手搧一搧，只聞到一點點，比較安全。"}},{"id":"n3-dis-009","u":"n3-dis","type":"c","lv":2,"code":"pa-Ⅱ-2","tag":"怪怪的實驗","stem":"三組比「冷水和溫水哪杯糖溶得快」，有一組反而是冷水那杯先溶完。最可能的原因？","opts":[{"h":"那一組的冷水有攪拌，溫水沒有攪拌","ok":true},{"h":"冷水本來就比溫水溶得快","wy":"其他兩組都是溫水比較快，冷水不會比較快。"},{"h":"那一組的杯子顏色不一樣","wy":"杯子的顏色和溶得快慢沒有關係。"}],"why":{"cause":"同時改了水溫和攪拌，就分不出是誰造成的。"}},{"id":"n3-dis-010","u":"n3-dis","type":"c","lv":2,"code":"INa-Ⅱ-2","adv":true,"stem":"一杯水放在秤上，倒進 10 公克的糖，溶完後總重量會怎樣？","pic":"⚖️","opts":[{"h":"比原來多 10 公克","ok":true},{"h":"和原來一樣，因為糖不見了","wy":"糖看不見了，但還在水裡，所以重量還在。"},{"h":"比原來還輕","wy":"加了東西進去，不會變輕。"}],"why":{"cause":"糖溶解後還在水裡，重量也還在。"},"note":"進階，不進段考。"},{"id":"n3-dis-011","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-3","stem":"兩杯一樣多、一樣溫的水，各放一匙砂糖，一杯攪拌、一杯不動，哪杯先溶完？","pic":"🥄","opts":[{"h":"有攪拌的那杯","ok":true},{"h":"沒攪拌的那杯","wy":"不攪拌時，糖會堆在杯底，溶得比較慢。"},{"h":"兩杯一定同時溶完","wy":"兩杯只差攪拌，攪拌那杯會比較快。"}],"why":{"cause":"攪拌讓糖碰到更多的水，所以溶得比較快。"}},{"id":"n3-dis-012","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-2","stem":"兩杯一樣多的水，一杯溫水、一杯冷水，一直加砂糖攪拌，哪杯能溶比較多糖？","opts":[{"h":"溫水那杯","ok":true},{"h":"冷水那杯","wy":"冷水溶糖比溫水少。"},{"h":"兩杯一樣多","wy":"水溫不同，能溶的糖也不同。"},{"h":"兩杯都能一直溶下去","wy":"一杯水能溶的糖有限，太多就會留在杯底。"}],"why":{"cause":"水溫比較高，同樣多的水能溶的糖比較多。"}},{"id":"n3-dis-013","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-2","stem":"阿哲想讓一大塊冰糖快點溶在水裡。這不是公平比賽，只想找最快的辦法，怎麼做最好？","opts":[{"h":"請大人敲碎後放進溫水，再攪拌","ok":true},{"h":"整塊放進溫水，不攪拌","wy":"沒有弄碎、也沒攪拌，會溶得很慢。"},{"h":"碎冰糖放進冰水，不攪拌","wy":"水很冰又不攪拌，溶得比較慢。"},{"h":"整塊放進冷水，一直盯著看","wy":"看著它不會讓它溶得比較快喔。"}],"why":{"cause":"顆粒小、水溫高、有攪拌，三個一起用最快；但這樣不是公平比賽。"}},{"id":"n3-dis-014","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","tag":"猜猜我是誰","stem":"猜猜我是誰？","hints":["我是白色小顆粒。","放進水裡攪一攪就看不見。","海水曬乾以後，留下來的白色顆粒大部分就是我。"],"opts":[{"h":"鹽","ok":true},{"h":"糖","wy":"糖也是白色、也會溶，但海水曬出來的是鹽，不是糖。"},{"h":"麵粉","wy":"麵粉攪了水會白白混濁，不容易溶。"},{"h":"沙子","wy":"沙子不會溶，攪完還是看得見。"}],"why":{"cause":"鹽會溶在水裡；海水曬乾，就能得到鹽。"}},{"id":"n3-dis-015","u":"n3-dis","type":"c","lv":2,"code":"INe-Ⅱ-3","tag":"先猜再看","stem":"一顆方糖放進一杯水裡，完全不攪拌，放很久以後會怎樣？","opts":[{"h":"慢慢全部溶完","ok":true},{"h":"永遠不會溶","wy":"很多小朋友這樣想，其實不攪拌也會溶，只是比較慢。"},{"h":"浮到水面上","wy":"方糖會沉在杯底。"},{"h":"變成一顆冰","wy":"糖不是水，不會結成冰。"}],"why":{"cause":"不攪拌也會溶解，攪拌只是讓它溶得比較快。"}},{"id":"n3-dis-016","u":"n3-dis","type":"c","lv":2,"code":"pa-Ⅱ-2","tag":"怪怪的實驗","stem":"四組用一樣的溫水溶糖、都不攪拌，第四組比別組慢很多，為什麼？","opts":[{"h":"第四組放的是一整顆方糖，別組是砂糖","ok":true},{"h":"第四組的水比較溫","wy":"水比較溫會溶得更快，不會更慢。"},{"h":"第四組有偷偷攪拌","wy":"攪拌也會讓它更快，不會更慢。"},{"h":"第四組的杯子是藍色的","wy":"杯子的顏色和溶得快慢沒有關係。"}],"why":{"cause":"糖的大小不一樣，條件沒控制好，就不能拿來比較。"}},{"id":"n3-dis-017","u":"n3-dis","type":"c","lv":2,"code":"INb-Ⅱ-2","stem":"柚子不小心把鹽和沙子混在一起，用哪個辦法最容易把沙子分出來？","opts":[{"h":"加水攪拌讓鹽溶掉，再把水慢慢倒出來，沙子留在杯底","ok":true},{"h":"放進冷凍庫冰一晚","wy":"冷凍不會讓鹽和沙子分開。"},{"h":"用力搖一搖，它們會自己分開","wy":"搖了還是混在一起，不會自己分開。"}],"why":{"cause":"鹽會溶、沙子不會溶，利用這個差別就能分開。"}},{"id":"n3-dis-018","u":"n3-dis","type":"c","lv":1,"code":"INe-Ⅱ-3","stem":"冰糖的名字有個「冰」字，把冰糖放進一杯水裡會怎樣？","opts":[{"h":"沉在杯底，慢慢溶解","ok":true},{"h":"讓整杯水結冰","wy":"冰糖不冷，不會讓水結冰。"},{"h":"像冰塊一樣浮在水面","wy":"冰糖會沉下去，不像冰塊會浮。"},{"h":"像冰塊一樣融化成水","wy":"冰糖是糖，它在水裡是「溶解」，不是「融化」。"}],"why":{"cause":"冰糖是一種糖，只是長得像冰，在水裡會慢慢溶解。"}},{"id":"n3-dis-019","u":"n3-dis","type":"c","lv":1,"code":"INb-Ⅱ-2","stem":"泥沙水裡有很多沙子，用哪個方法可以讓沙子留在上面、水流下去？","opts":[{"h":"在漏斗裡放濾紙，把泥沙水倒進去","ok":true},{"h":"用湯匙一直攪拌","wy":"攪拌只會讓沙子在水裡轉來轉去，不會分開。"},{"h":"放進冷凍庫冰一晚","wy":"結冰以後沙子還是包在冰裡，分不開。"}],"why":{"cause":"濾紙上有很小的洞，水過得去，沙子過不去。"}},{"id":"n3-dis-020","u":"n3-dis","type":"c","lv":1,"code":"INa-Ⅱ-3","stem":"鹽罐沒蓋好，放在潮濕的廚房好幾天，鹽可能會怎樣？","pic":"🧂","opts":[{"h":"吸了空氣裡的水氣，結成一塊一塊","ok":true},{"h":"變成糖","wy":"鹽不會自己變成別的東西。"},{"h":"變得更細更乾","wy":"潮濕的地方只會讓鹽變潮，不會變乾。"},{"h":"完全不會有變化","wy":"潮濕的空氣裡有水氣，鹽沒蓋好會慢慢變潮。"}],"why":{"cause":"鹽放在潮濕的地方，容易吸到水氣而結塊，所以鹽罐要蓋好。"}},{"id":"n3-dis-021","u":"n3-dis","type":"tw","lv":1,"code":"pe-Ⅱ-2","stem":"「實驗桌上有一罐沒有標籤的白色粉末，舔一點點就知道是什麼了。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"不明的東西絕對不能嚐。"}],"reasons":[{"h":"不知道是什麼的東西可能有毒，要問老師，不能嚐","ok":true},{"h":"白色粉末一定是糖或鹽，所以沒關係","wy":"白色粉末有很多種，有的會傷身體。"},{"h":"只要舔一點點就不會有事","wy":"有些東西一點點就會讓人受傷。"}],"right":"不知道是什麼的東西可能有毒，不能嚐，要先問老師。","why":{"cause":"實驗室裡不認識的東西，不聞、不嚐，先問老師。"}},{"id":"n3-dis-022","u":"n3-dis","type":"tw","lv":2,"code":"INe-Ⅱ-3","stem":"「鹽溶在水裡，就消失不見了。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"看不見不等於不見了。"}],"reasons":[{"h":"把鹽水曬乾，盤底會出現白色的鹽","ok":true},{"h":"鹽變成空氣跑走了","wy":"鹽沒有跑走，曬乾就看得到。"},{"h":"鹽沉到杯底變成水了","wy":"鹽不會變成水，它只是溶在水裡。"}],"right":"鹽溶在水裡還在，把鹽水曬乾，盤底會出現白色的鹽。","why":{"cause":"鹽溶解後變得很小、看不見，但還在水裡。"}},{"id":"n3-dis-023","u":"n3-dis","type":"tw","lv":2,"code":"INe-Ⅱ-3","stem":"「只要一直攪拌，鹽加再多都會溶在同一杯水裡。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"攪拌只會讓鹽溶得快，不會讓水溶得更多。"}],"reasons":[{"h":"一杯水能溶的鹽有限，太多就會留在杯底","ok":true},{"h":"攪拌會把鹽打碎，所以都會溶","wy":"打碎只是溶得快，溶不了的還是溶不了。"},{"h":"鹽本來就不會溶在水裡","wy":"鹽會溶，只是有限。"}],"right":"一杯水能溶的鹽有限，攪拌只會讓鹽溶得比較快。","why":{"cause":"攪拌讓鹽溶得快，但一杯水能溶的量有限。"}},{"id":"n3-dis-024","u":"n3-dis","type":"tw","lv":2,"code":"INe-Ⅱ-3","stem":"「麵粉加水攪一攪，水變白白的，表示麵粉溶在水裡了。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"很多小朋友會這樣想，其實溶解後的水會是透明的。"}],"reasons":[{"h":"水變混濁，放久了麵粉會沉下去，所以麵粉不容易溶","ok":true},{"h":"白色的粉都會溶在水裡","wy":"麵粉也是白的，卻不容易溶。"},{"h":"麵粉溶得太快，水才變白","wy":"水變白是因為麵粉還在水裡飄，不是溶了。"}],"right":"麵粉不容易溶在水裡，所以水才會白白混濁，放久了會沉澱。","why":{"cause":"溶解後的水看起來透明；混濁又會沉澱，就是沒溶。"}},{"id":"n3-dis-025","u":"n3-dis","type":"tw","lv":2,"code":"pe-Ⅱ-1","stem":"小安說：「一杯溫水放一匙糖、一杯冷水放三匙糖，就能比出水溫的影響。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"兩個條件同時改，結果分不出是誰造成的。"}],"reasons":[{"h":"水溫和糖的多少兩個都不一樣，分不出是誰造成的","ok":true},{"h":"條件改越多，比出來越準","wy":"要一次只改一個條件才公平。"},{"h":"糖放多放少，和溶完的快慢沒有關係","wy":"糖越多，要溶的越多，溶完要更久。"}],"right":"水溫和糖的多少同時改，就分不出是誰造成的。","why":{"cause":"想知道水溫的影響，只能改水溫，糖也要放一樣多。"}},{"id":"n3-dis-026","u":"n3-dis","type":"tw","lv":1,"code":"pe-Ⅱ-2","stem":"「做溶解實驗要用熱水時，要請大人幫忙倒。」對嗎？","opts":[{"h":"○","ok":true},{"h":"✕","wy":"熱水很危險，小朋友自己倒容易燙傷。"}],"reasons":[{"h":"熱水會燙傷人，倒的時候容易濺出來","ok":true},{"h":"熱水會讓糖變成別的東西","wy":"熱水只會讓糖溶得快，糖還是糖。"},{"h":"大人倒的水比較多","wy":"重點是安全，不是倒多少。"}],"right":"熱水會燙傷人，要請大人幫忙倒。","why":{"cause":"熱水會燙傷，請大人幫忙最安全。"}},{"id":"n3-dis-027","u":"n3-dis","type":"tw","lv":1,"code":"INa-Ⅱ-3","stem":"「透明的東西，一定是玻璃做的。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"透明的東西不一定是玻璃。"}],"reasons":[{"h":"保鮮膜、透明塑膠杯也是透明的，但不是玻璃","ok":true},{"h":"玻璃都是不透明的","wy":"玻璃杯就是透明的。"},{"h":"只有玻璃能讓光穿過去","wy":"透明塑膠、清水也能讓光穿過。"}],"right":"透明的東西不一定是玻璃，保鮮膜、透明塑膠杯也是透明的。","why":{"cause":"玻璃、塑膠、保鮮膜都可以是透明的，要看材料。"}},{"id":"n3-dis-028","u":"n3-dis","type":"tw","lv":1,"code":"INe-Ⅱ-2","stem":"「糖在溫水裡溶得比較快，所以糖放進冷水就完全不會溶。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"冷水也會溶糖，不是完全不會。"}],"reasons":[{"h":"冷水也會溶糖，只是比較慢","ok":true},{"h":"糖只能溶在熱水裡","wy":"冷水也泡得出糖水。"},{"h":"冷水會讓糖變成冰","wy":"糖不是水，不會結成冰；冷水只是讓糖溶得慢一點。"}],"right":"冷水也會溶糖，只是溶得比較慢。","why":{"cause":"溫度改變的是溶解的快慢和多少，不是會不會溶。"}},{"id":"n3-dis-029","u":"n3-dis","type":"tw","lv":2,"code":"INb-Ⅱ-2","stem":"「鹽水用濾紙過濾，流下來的水就沒有鹽了。」對嗎？","opts":[{"h":"✕","ok":true},{"h":"○","wy":"濾紙擋得住沙子，但擋不住溶在水裡的鹽。"}],"reasons":[{"h":"鹽溶在水裡變得很小，會跟著水穿過濾紙","ok":true},{"h":"濾紙的洞很小，什麼都過不去","wy":"水就穿過去了，溶在水裡的鹽也跟著過去。"},{"h":"鹽會被濾紙吸走，變成紙的一部分","wy":"把流下來的水曬乾，盤底還是有白色的鹽。"}],"right":"鹽溶在水裡，會跟著水穿過濾紙，流下來的水還有鹽。","why":{"cause":"過濾能分開沙子和水，卻分不開溶在水裡的鹽。"}},{"id":"n3-dis-030","u":"n3-dis","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"A 杯冷水、B 杯溫水，各放一匙砂糖。比較 A、B 是想知道什麼？哪些要保持一樣？","ans":{"change":"水溫","keep":["水量","糖的種類和量","都不攪拌","杯子"],"extra":["負責記錄的人是誰"]},"why":{"cause":"只改水溫，其他都一樣，才知道水溫有沒有影響。","myth":"如果 A 杯放方糖、B 杯放砂糖，或只有 B 杯攪拌，就分不出是不是水溫的功勞。"},"note":"總表原本的干擾條件是「A 杯放方糖、B 杯放砂糖」「只有 B 杯攪拌」；這兩個其實已由 keep 的「糖的種類和量」「都不攪拌」涵蓋，依格式 extra 改放無關條件，原意寫在 myth。日後由 FAIR 程式產生。"},{"id":"n3-dis-031","u":"n3-dis","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"喬妹想知道「攪拌會不會讓鹽溶得比較快」，要怎麼比才公平？","ans":{"change":"有沒有攪拌","keep":["水量","水溫","鹽的量","杯子"],"extra":["負責記錄的人是誰"]},"why":{"cause":"只改「攪拌」，其他都一樣，才知道攪拌有沒有用。","myth":"如果一杯用溫水、一杯用冷水，或一杯放粗鹽、一杯放細鹽，就分不出是不是攪拌的功勞。"},"note":"總表原本的干擾條件是「一杯溫水、一杯冷水」「一杯粗鹽、一杯細鹽」；依格式 extra 改放無關條件，原意寫在 myth。"},{"id":"n3-dis-032","u":"n3-dis","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"煜煜想知道「水多水少，能溶的鹽一樣多嗎」，要怎麼比才公平？","ans":{"change":"水量","keep":["水溫","鹽的種類","每次加一樣多（一小匙）","攪拌的方式"],"extra":["負責記錄的人是誰"]},"why":{"cause":"只改水量，才能看出水多水少的差別。","myth":"如果一杯用溫水、一杯用冷水，或一杯加鹽、一杯加糖，就不是只在比水量了。"},"note":"總表原本的干擾條件是「一杯溫水、一杯冷水」「一杯加鹽、一杯加糖」；依格式 extra 改放無關條件，原意寫在 myth。"},{"id":"n3-dis-033","u":"n3-dis","type":"sort","lv":1,"code":"INe-Ⅱ-3","stem":"把東西分成「會溶解」和「不容易溶解」。","ans":{"會溶解":["🧂 鹽","糖"],"不容易溶解":["麵粉","沙子"]},"why":{"cause":"攪一攪後看不見、水是透明的，就是溶解了。","myth":"麵粉攪了水會混濁、放久會沉下去；鹽攪一攪就看不見了，是會溶的。"},"note":"日後由 MATERIALS 程式產生。"},{"id":"n3-dis-034","u":"n3-dis","type":"sort","lv":1,"code":"INe-Ⅱ-3","stem":"分一分「會溶在水裡」和「不容易溶」。","ans":{"會溶在水裡":["果汁粉","冰糖","細鹽"],"不容易溶":["油","米粒","小石頭"]},"why":{"cause":"會溶的東西最後會看不見顆粒；不容易溶的會沉下去或浮起來。","myth":"冰糖溶得慢，但放久了也會溶完；米泡在水裡還是一粒一粒的。"},"note":"物品已換成 kt_sort 沒有的；日後可改由程式產生（這些物品併入 MATERIALS）。"},{"id":"n3-dis-035","u":"n3-dis","type":"sort","lv":1,"code":"INa-Ⅱ-3","stem":"廚房裡的東西，分成「透明，看得到後面」和「不透明」。","ans":{"透明，看得到後面":["玻璃杯","保鮮膜","透明塑膠杯"],"不透明":["陶瓷碗","木頭砧板","鋁箔紙"]},"why":{"cause":"依「看不看得到後面」分，就是用材料的特性分類。","myth":"保鮮膜薄薄的，隔著它看得到裡面的菜；鋁箔紙亮亮的會反光，但看不到後面。"}},{"id":"n3-dis-036","u":"n3-dis","type":"sort","lv":1,"code":"INa-Ⅱ-3","stem":"把東西分成「會吸水」和「不容易吸水」。","ans":{"會吸水":["衛生紙","毛巾","🧽 海綿","化妝棉"],"不容易吸水":["🖍️ 蠟筆","橡皮擦","陶瓷碗","玻璃盤"]},"why":{"cause":"會吸水的材料適合擦東西，不吸水的適合裝東西。","myth":"海綿有很多小洞，可以吸住很多水；水滴在蠟筆上會滾下去，蠟筆不吸水。"}},{"id":"n3-dis-037","u":"n3-dis","type":"sort","lv":2,"code":"INe-Ⅱ-3","stem":"分一分：「放進水裡會溶解」和「放在溫暖的地方會融化」。","ans":{"放進水裡會溶解":["🧂 鹽","砂糖","冰糖"],"放在溫暖的地方會融化":["🧊 冰塊","冰棒","🍦 冰淇淋"]},"why":{"cause":"溶解要有水；融化是固體變暖變成液體。","myth":"冰糖是糖，放進水裡是溶解；冰塊變成水是因為變暖，這叫融化。"},"note":"U6 wt_state 不要出冰糖選項。"},{"id":"n3-dis-038","u":"n3-dis","type":"order","lv":2,"code":"INe-Ⅱ-3","stem":"證明鹽還在水裡，步驟排排看。","pic":"☀️","ans":["泡一杯鹽水","倒一些在盤子上","放在太陽下曬","盤底出現白色的鹽粒"],"why":{"cause":"水曬乾了，溶在水裡的鹽就留在盤底。","myth":"要等水跑掉，鹽才會露出來。"}},{"id":"n3-dis-039","u":"n3-dis","type":"order","lv":2,"code":"pe-Ⅱ-1","stem":"比比看「攪拌會不會讓糖溶得比較快」，實驗步驟排排看。","ans":["準備兩個一樣的透明杯","倒入一樣多、一樣溫度的水","各輕輕倒入一匙砂糖到水裡","一杯攪拌、一杯不攪拌","記下哪杯先溶完"],"why":{"cause":"先把條件準備成一樣，再只改一個，最後記錄結果。","myth":"還沒做實驗，就沒有結果可以記；要先有糖在水裡，攪拌才有意義。"}},{"id":"n3-dis-040","u":"n3-dis","type":"order","lv":2,"code":"pe-Ⅱ-2","stem":"想知道一杯水最多能溶幾匙鹽，步驟排排看。","pic":"🧂","ans":["量好一杯水","加一小匙鹽，攪到看不見","接著一匙一匙繼續加，每次都攪到看不見","直到最後一匙怎麼攪都溶不掉、留在杯底","數一數溶掉了幾匙（最後溶不掉的那匙不算）"],"why":{"cause":"一匙一匙加、每次攪到看不見，直到溶不掉，就量得出最多溶幾匙。","myth":"還沒加完數不出來；最後溶不掉的那匙沒有溶掉，不能算。"}},{"id":"n3-mag-001","u":"n3-mag","type":"sort","lv":1,"code":"INe-Ⅱ-7","stem":"分一分：哪些東西會被磁鐵吸起來？","pic":"🧲","ans":{"會被吸":["📎 迴紋針","鐵釘"],"不會被吸":["鋁製飲料罐","✏️ 鉛筆","📏 塑膠尺"]},"why":{"cause":"磁鐵會吸鐵做的東西，鋁、木頭、塑膠不會被吸。"},"note":"來源：mg_sort 常見錯誤：鋁製飲料罐放「會被吸」：罐子亮亮的，但它是鋁做的，磁鐵吸不起來。鉛筆放「會被吸」：鉛筆是木頭和筆芯做的，沒有鐵。 程式產生題型 mg_sort 的範例。鋁製飲料罐只用文字或自繪鋁罐圖，不可用 🥫。"},{"id":"n3-mag-002","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"兩塊磁鐵的 S 極互相靠近，會怎樣？","pic":"🧲🧲","opts":[{"h":"互相推開","ok":true},{"h":"互相吸住","wy":"要 N 極和 S 極碰在一起才會吸住喔。"},{"h":"什麼事都沒有","wy":"兩塊磁鐵靠得夠近時，會推開或吸住，手感覺得到。"}],"why":{"cause":"一樣的極會互相推開，這叫同極相斥。"},"note":"來源：mg_pole（改） 程式產生題型 mg_pole 的範例。"},{"id":"n3-mag-003","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"A 吸 9 個、B 吸 4 個、C 吸 6 個迴紋針，B 最大塊。哪塊磁力最強？","pic":"📊","opts":[{"h":"A","ok":true},{"h":"B，因為它最大","wy":"大磁鐵不一定比較強，B 只吸了 4 個。"},{"h":"C","wy":"C 吸了 6 個，比 A 少。"},{"h":"三塊一樣強","wy":"三塊吸起的數量不一樣。"}],"bars":[["A",9],["B",4],["C",6]],"unit":"個","why":{"cause":"吸起的迴紋針越多，磁力越強；大的磁鐵不一定比較強。"},"note":"來源：mg_bar（改） 程式產生題型 mg_bar 的範例，畫成長條圖；B 的磁鐵圖要畫得最大。"},{"id":"n3-mag-004","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"用條形磁鐵去沾迴紋針，哪裡吸的迴紋針最多？","pic":"🧲📎","opts":[{"h":"兩端","ok":true},{"h":"中間","wy":"磁鐵中間幾乎吸不到迴紋針喔。"},{"h":"每個地方一樣多","wy":"試試看，兩端吸的明顯比較多。"}],"why":{"cause":"磁鐵兩端的磁力最強，叫做兩極。"},"note":"來源：mg_end 原為 label 題 mg_end（點出磁力最強處，兩端都算對），依指示改成 c 題。"},{"id":"n3-mag-005","u":"n3-mag","type":"fair","lv":2,"code":"INe-Ⅱ-7","stem":"想知道「隔幾張紙，磁鐵還吸得住迴紋針」，怎麼比才公平？","pic":"🧲📄","ans":{"change":"紙的張數","keep":["同一塊磁鐵","同一種迴紋針","同一種紙"],"extra":["記錄用的筆是什麼顏色"]},"why":{"cause":"只改紙的張數，其他都一樣，結果才公平。"},"note":"來源：mg_fair 常見錯誤：換磁鐵：同時改了紙和磁鐵，分不出是誰造成的。改用厚紙板：紙的種類也變了，就不只改一個條件。 總表原本的錯誤做法（每加一張紙就換一塊磁鐵、後來改用厚紙板）不符合 extra 的定義，改放這裡；extra 換成無關條件。"},{"id":"n3-mag-006","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"登山迷路時，哪個工具利用磁鐵指出南北？","pic":"🧭⛰️","opts":[{"h":"指北針","ok":true},{"h":"望遠鏡","wy":"望遠鏡讓遠的東西看起來變大，不會指方向。"},{"h":"手電筒","wy":"手電筒照亮路，但不會告訴你哪邊是北。"},{"h":"水壺","wy":"水壺裝水用，沒有磁鐵。"}],"why":{"cause":"指北針的指針是一根小磁鐵，會指著南北。"},"note":"來源：mg_use"},{"id":"n3-mag-007","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「亮亮的金屬都會被磁鐵吸起來。」對嗎？","pic":"✨","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：磁鐵會吸鐵做的東西，鋁、銅、塑膠不會被吸。"}],"reasons":[{"h":"鋁做的飲料罐也亮亮的，卻吸不起來","ok":true},{"h":"因為金屬都很重","wy":"吸不吸要看材料，不是看輕重。"},{"h":"磁鐵會吸所有硬的東西","wy":"玻璃、木頭也很硬，磁鐵卻吸不起來。"}],"right":"磁鐵會吸鐵做的東西，鋁、銅、塑膠不會被吸。","why":{"cause":"磁鐵會吸鐵做的東西，鋁、銅、塑膠不會被吸。"},"note":"來源：mg_tw"},{"id":"n3-mag-008","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"冰箱貼可以牢牢貼在喬妹家的冰箱門上，這表示冰箱門裡面有什麼？","pic":"🧲","opts":[{"h":"鐵","ok":true},{"h":"塑膠","wy":"磁鐵吸不住塑膠。"},{"h":"木頭","wy":"磁鐵吸不住木頭。"}],"why":{"cause":"冰箱貼裡有磁鐵，冰箱門裡有鐵，才貼得住。"},"note":"來源：06#1（補選項）"},{"id":"n3-mag-009","u":"n3-mag","type":"c","lv":2,"code":"INb-Ⅱ-2","stem":"資源回收場想把鐵罐和鋁罐分開，最快的方法是？","pic":"♻️","opts":[{"h":"用大磁鐵吸，鐵罐會被吸起來","ok":true},{"h":"看顏色，銀色的就是鋁罐","wy":"鐵罐和鋁罐都可能是銀色的，看顏色分不清。"},{"h":"用手搖一搖聽聲音","wy":"空罐子搖起來聲音差不多，而且一個一個搖太慢了。"}],"why":{"cause":"磁鐵吸得起鐵罐、吸不起鋁罐，一吸就分開了。"},"note":"來源：06#2（補選項）"},{"id":"n3-mag-010","u":"n3-mag","type":"c","lv":2,"code":"INb-Ⅱ-2","stem":"沙子裡混了一些鐵粉，怎麼分開最快？","pic":"🧲","opts":[{"h":"用包著塑膠袋的磁鐵去吸","ok":true},{"h":"倒進水裡攪一攪","wy":"沙子和鐵粉都會沉下去，還是混在一起。"},{"h":"用手一粒一粒挑","wy":"鐵粉太小了，挑很久也挑不完。"}],"why":{"cause":"磁鐵把鐵粉吸在袋子外面，拿掉磁鐵，鐵粉就掉下來了。做完要洗手。"},"note":"來源：06#3（補選項）"},{"id":"n3-mag-011","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"磁鐵放在玩具小車上，手拿鐵釘慢慢靠近小車（不碰到），小車會？","pic":"🚗🧲","tag":"先猜再看","opts":[{"h":"往鐵釘那邊移動","ok":true},{"h":"往反方向跑開","wy":"鐵釘不是磁鐵，不會把磁鐵推開；磁鐵和鐵是互相吸的。"},{"h":"一動也不動","wy":"小車很好滾，磁鐵被鐵釘吸過去，小車就跟著動了。"}],"why":{"cause":"磁鐵吸鐵的時候，鐵也拉著磁鐵，所以小車會往鐵釘跑。"},"note":"來源：補3 建議做成動畫；磁力太弱或小車太重時，實際做可能不會動。"},{"id":"n3-mag-012","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"白紙蓋在條形磁鐵上，紙上撒鐵粉再輕敲紙，哪裡的鐵粉最多？","pic":"🧲📄","opts":[{"h":"兩端","ok":true},{"h":"中間","wy":"中間的磁力最弱，鐵粉反而最少。"},{"h":"每個地方一樣多","wy":"仔細看，兩端的鐵粉明顯聚成一團。"}],"why":{"cause":"磁鐵兩端磁力最強，鐵粉就聚在那裡。做完要洗手，不要揉眼睛。"},"note":"來源：06#5（改） 鐵粉實驗：做完要洗手，不要揉眼睛。"},{"id":"n3-mag-013","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「如果把條形磁鐵從中間分成兩半，一半只剩 N 極，另一半只剩 S 極。」對嗎？","pic":"🧲","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：磁鐵分成兩半後，每一半都有自己的 N 極和 S 極。"}],"reasons":[{"h":"每一半都會有自己的 N 極和 S 極","ok":true},{"h":"分開以後兩半都沒有磁力了","wy":"分開的每一半還是吸得起迴紋針。"},{"h":"N 極和 S 極會跑到同一半","wy":"每一半都會同時有 N 極和 S 極。"}],"right":"磁鐵分成兩半後，每一半都有自己的 N 極和 S 極。","why":{"cause":"很多小朋友會這樣想喔！分開後每一半都有兩極。這只是想想看，不要自己折磁鐵，碎片會割手。"},"adv":true,"note":"來源：06#6（改）"},{"id":"n3-mag-014","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"兩塊磁鐵靠近時互相推開，可能是哪兩個極靠在一起？","pic":"🧲🧲","opts":[{"h":"N 極和 N 極，或 S 極和 S 極","ok":true},{"h":"N 極和 S 極","wy":"不一樣的極會吸在一起，不會推開。"},{"h":"只有 N 極和 N 極會推開，S 極和 S 極會吸住","wy":"S 極和 S 極也是一樣的極，一樣會推開。"}],"why":{"cause":"一樣的極會推開，不一樣的極會吸住。"},"note":"來源：06#7（改）"},{"id":"n3-mag-015","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"四組用同樣的磁鐵吸迴紋針，吸到 8、7、8、20 個。第四組為什麼特別多？","pic":"📎","tag":"怪怪的實驗","opts":[{"h":"第四組用的迴紋針比較小","ok":true},{"h":"第四組的磁鐵變強了","wy":"大家用的是同樣的磁鐵，沒有換。"},{"h":"第四組數得比較慢","wy":"數得慢不會讓數量變多。"},{"h":"第四組的桌子比較大","wy":"桌子大小和磁鐵吸幾個沒有關係。"}],"why":{"cause":"迴紋針大小不一樣，條件就不同，不能拿來比。"},"note":"來源：06#8（改）"},{"id":"n3-mag-016","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"迴紋針還吸在磁鐵下面時，拿第二個迴紋針去碰它的下端，會怎樣？","pic":"🧲📎","opts":[{"h":"第二個也被吸住，串成一串","ok":true},{"h":"第二個會被推開","wy":"迴紋針之間不會互相推開，第二個反而會被吸住喔。"},{"h":"什麼事都沒有","wy":"試試看，第二個會黏上去。"}],"why":{"cause":"靠著磁鐵的迴紋針，暫時也有了磁力。"},"adv":true,"note":"來源：06#9（改）"},{"id":"n3-mag-017","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"指北針的 N 端指著教室的窗戶，窗戶在教室的哪一邊？","pic":"🧭","opts":[{"h":"北邊","ok":true},{"h":"南邊","wy":"指著南方的是另一端。"},{"h":"東邊","wy":"N 端指的就是北方，不是東方。"}],"why":{"cause":"指北針的 N 端指向北方，所以窗戶在北邊。"},"note":"來源：06#10（改）"},{"id":"n3-mag-018","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"鉛筆盒的蓋子一靠近盒身，就被「吸」過去啪一聲貼住，最可能用了什麼？","pic":"✏️","opts":[{"h":"磁鐵","ok":true},{"h":"膠水","wy":"膠水黏住就打不開了，蓋子卻能一直開開關關。"},{"h":"魔鬼氈","wy":"魔鬼氈要壓在一起才黏，不會隔一點距離就被吸過去。"}],"why":{"cause":"磁鐵不用碰到就能吸，所以蓋子會被吸過去。"},"note":"來源：06#11（改）"},{"id":"n3-mag-019","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「大磁鐵的磁力一定比小磁鐵強。」對嗎？","pic":"🧲","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：大磁鐵不一定比小磁鐵強，要用實驗比一比。"}],"reasons":[{"h":"要實際比吸起幾個迴紋針才知道，小磁鐵也可能比較強","ok":true},{"h":"大磁鐵比較重，所以一定比較強","wy":"輕重和磁力沒有一定的關係。"},{"h":"大磁鐵看起來比較厲害","wy":"看外表不準，要做實驗比一比。"}],"right":"大磁鐵不一定比小磁鐵強，要用實驗比一比。","why":{"cause":"很多小朋友會這樣想喔！磁力強不強，要用實驗來比。"},"note":"來源：06#13（補選項）"},{"id":"n3-mag-020","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「磁鐵一定要碰到東西，才能吸它。」對嗎？","pic":"🧲📎","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：磁鐵不用碰到東西，靠近就能把迴紋針吸過來。"}],"reasons":[{"h":"磁鐵靠近、還沒碰到時，迴紋針就會跳過來","ok":true},{"h":"所有的力都要碰到才有","wy":"磁力就不用碰到，隔一點距離也能吸。"},{"h":"磁鐵要黏黏的才吸得住","wy":"磁鐵摸起來不黏，是磁力把鐵吸過去的。"}],"right":"磁鐵不用碰到東西，靠近就能把迴紋針吸過來。","why":{"cause":"磁力不用接觸，靠近就能吸。"},"note":"來源：06#14（補選項）"},{"id":"n3-mag-021","u":"n3-mag","type":"sort","lv":2,"code":"INe-Ⅱ-7","stem":"阿哲整理工具箱，用磁鐵一個一個試，把東西分進兩個籃子。","pic":"🧰","ans":{"會被磁鐵吸":["📎 迴紋針","鐵釘"],"不會被吸":["鋁箔","拿掉外皮的銅線","玻璃彈珠","橡皮擦","木頭積木"]},"why":{"cause":"磁鐵會吸鐵做的東西；鋁和銅雖然是金屬，也不會被吸。"},"note":"來源：M-01（改） 常見錯誤：鋁箔、銅線放進「會被吸」：亮亮的金屬不一定會被吸，鋁和銅就吸不起來喔。玻璃彈珠放進「會被吸」：硬硬的東西不一定會被吸，要看是不是鐵做的。 和程式產生的 mg_sort 同一種題目，日後可改由程式產生。"},{"id":"n3-mag-022","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「磁鐵吸不起鋁箔，是因為鋁箔太輕了。」對嗎？","pic":"🧲","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：鋁箔吸不起來，是因為它不是鐵做的，不是因為輕。"}],"reasons":[{"h":"迴紋針也很輕卻吸得起來，鋁箔吸不起是因為它不是鐵做的","ok":true},{"h":"鋁箔太薄了，磁力直接穿過去","wy":"很薄的鐵片照樣會被吸，重點是什麼材料做的。"},{"h":"換一塊很大的磁鐵就吸得起來","wy":"磁鐵再大，也吸不起鋁做的東西喔。"}],"right":"鋁箔吸不起來，是因為它不是鐵做的，不是因為輕。","why":{"cause":"很多小朋友會這樣想喔！吸不吸要看材料，不是看輕重。"},"note":"來源：M-02"},{"id":"n3-mag-023","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"條形磁鐵兩端常寫著 N 和 S，這兩端叫什麼？","pic":"🧲","opts":[{"h":"N 極（北極）和 S 極（南極）","ok":true},{"h":"新的一端和舊的一端","wy":"兩端是一起做出來的，沒有新舊之分。"},{"h":"正面和反面","wy":"N 和 S 是兩個「端」，不是一張紙的兩面喔。"}],"why":{"cause":"磁鐵的兩端叫做兩極：N 極和 S 極。"},"note":"來源：M-03"},{"id":"n3-mag-024","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"用 U 形磁鐵去沾一盒迴紋針，哪裡沾到的最多？","pic":"🧲📎","opts":[{"h":"兩個開口的尖端","ok":true},{"h":"彎彎的底部","wy":"底部在磁鐵的中間，磁力反而最弱。"},{"h":"每個地方都一樣多","wy":"試試看，尖端沾到的明顯比較多。"}],"why":{"cause":"U 形磁鐵的兩極在兩個尖端，那裡磁力最強。"},"note":"來源：M-04"},{"id":"n3-mag-025","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"兩個環形磁鐵套在直立的鉛筆上，上面那個浮在半空中。為什麼？","pic":"✏️🧲","opts":[{"h":"兩塊磁鐵相同的極面對面，互相推開","ok":true},{"h":"上面那塊特別輕，會飄起來","wy":"再輕的東西放開也會往下掉，是有力量把它撐住。"},{"h":"鉛筆會把磁鐵吸住","wy":"鉛筆是木頭做的，磁鐵吸不住它。"},{"h":"中間黏了看不見的透明膠","wy":"把上面那塊翻過來，它就會掉下去吸在一起，所以不是膠。"}],"why":{"cause":"這種環形磁鐵的兩極在上下兩面；同極相斥，把上面那塊撐住了。"},"note":"來源：M-05（改） 建議做成動畫；這種環形磁鐵的兩極在上下兩面，鉛筆要直立。"},{"id":"n3-mag-026","u":"n3-mag","type":"tw","lv":1,"code":"INe-Ⅱ-7","stem":"柚子說「兩塊磁鐵一靠近就推開，表示有一塊壞掉了。」對嗎？","pic":"🧲🧲","tag":"誰說得對","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：一樣的極靠近本來就會推開，磁鐵沒有壞。"}],"reasons":[{"h":"一樣的極靠近本來就會推開，把一塊轉過來就會吸住","ok":true},{"h":"磁鐵放久了沒磁力，才會推開","wy":"沒磁力的話連推都推不動，會推開表示磁力還在喔。"},{"h":"推開是因為磁鐵太重","wy":"輕的小磁鐵一樣會互相推開。"}],"right":"一樣的極靠近本來就會推開，磁鐵沒有壞。","why":{"cause":"磁鐵沒壞！同極會推開，換一端就吸住了。"},"note":"來源：M-06"},{"id":"n3-mag-027","u":"n3-mag","type":"order","lv":2,"code":"INe-Ⅱ-7","stem":"一塊磁鐵的字母磨掉了，用一塊標好 N 極的磁鐵找出它的 N 極，排出順序。","pic":"🧲","ans":["拿出標好 N 極的磁鐵","把它的 N 極慢慢靠近不知道的那一端","看兩塊是互相推開還是吸在一起","會推開的話，那一端就是 N 極"],"why":{"cause":"一樣的極會推開，所以會被 N 極推開的那端就是 N 極。"},"note":"來源：M-07（改） 常見錯誤：先下結論再試：還沒觀察就猜，不算找出答案喔。如果吸在一起：那一端是 S 極；換另一端再靠近一次，會推開的那端就是 N 極。"},{"id":"n3-mag-028","u":"n3-mag","type":"fair","lv":2,"code":"INe-Ⅱ-7","stem":"煜煜想知道磁力能不能穿過紙、塑膠片、薄木片。哪些條件要保持一樣？","pic":"🧲📄","ans":{"change":"隔著的材料種類（紙、塑膠片、薄木片）","keep":["同一塊磁鐵","同一種迴紋針","三種材料的厚度差不多","磁鐵和迴紋針的距離一樣"],"extra":["記錄表用什麼顏色的紙"]},"why":{"cause":"一次只改一個條件，比較的結果才公平。"},"note":"來源：M-09 常見錯誤：換大磁鐵：同時改了材料和磁鐵，就分不出是誰造成的。換不同迴紋針：迴紋針大小不同，吸不吸得起來也會不同。 總表原本的錯誤做法（試木片時換大磁鐵、每次換不同大小的迴紋針）不符合 extra 的定義，改放這裡。"},{"id":"n3-mag-029","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"清魚缸的磁鐵刷，人在外面移動，裡面那片也跟著走。為什麼？","pic":"🐠🧲","opts":[{"h":"外面的磁鐵隔著玻璃吸住裡面那片","ok":true},{"h":"裡面那片自己會游","wy":"拿出來放在桌上，它一動也不動。"},{"h":"玻璃上塗了膠水","wy":"有膠水的話就拉不動了。"},{"h":"水流把它推過去","wy":"水沒有在流，它卻跟著手走。"}],"why":{"cause":"磁力可以穿過玻璃，所以手不用伸進水裡就能刷。"},"note":"來源：M-10"},{"id":"n3-mag-030","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「在旁邊沒有鐵的地方吊起條形磁鐵，每次停下來都朝不同方向。」對嗎？","pic":"🧲🧭","tag":"先猜再看","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：吊起來的磁鐵停下來時，總是同一端指北、另一端指南。"}],"reasons":[{"h":"它停下來時，總是同一端指北、另一端指南","ok":true},{"h":"它會一直轉，永遠停不下來","wy":"等一下它就會慢慢停住。"},{"h":"方向要看線綁得多緊","wy":"換一條線、綁鬆綁緊，停下來還是指南北。"}],"right":"吊起來的磁鐵停下來時，總是同一端指北、另一端指南。","why":{"cause":"吊起來的磁鐵會自己轉到南北方向停下來。"},"note":"來源：M-11（改）"},{"id":"n3-mag-031","u":"n3-mag","type":"tw","lv":2,"code":"INe-Ⅱ-7","stem":"「把指北針放在磁鐵旁邊，指針還是會好好指著北方。」對嗎？","pic":"🧭🧲","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：指北針靠近磁鐵會指錯，用的時候要離磁鐵遠一點。"}],"reasons":[{"h":"指針是一根小磁鐵，旁邊的磁鐵會吸它或推它，讓它指錯","ok":true},{"h":"指北針有外殼保護，不怕磁鐵","wy":"外殼是塑膠或玻璃，磁力可以穿過去。"},{"h":"指針是塑膠做的，磁鐵吸不到","wy":"指針其實是小磁鐵，才會指南北。"}],"right":"指北針靠近磁鐵會指錯，用的時候要離磁鐵遠一點。","why":{"cause":"用指北針時，要離磁鐵和鐵製品遠一點。"},"note":"來源：M-12"},{"id":"n3-mag-032","u":"n3-mag","type":"order","lv":1,"code":"INe-Ⅱ-7","stem":"喬妹想用指北針找出北方，排出順序。","pic":"🧭","ans":["把指北針平放在手上","等指針停下來不動","看指針標著 N 的那一端指向哪邊","轉身面向那一邊，前方就是北方"],"why":{"cause":"放平、等指針停，看 N 端指哪邊，那邊就是北方。"},"note":"來源：M-13（改） 常見錯誤：還在晃就看方向：指針還在轉，讀到的方向會不準。還沒看指針就先轉身：要先知道 N 端指哪裡，才知道往哪邊轉。"},{"id":"n3-mag-033","u":"n3-mag","type":"fair","lv":2,"code":"INe-Ⅱ-7","stem":"小安想比 A、B 兩塊磁鐵誰的磁力強。除了換磁鐵，哪些要一樣？","pic":"🧲📎","ans":{"change":"用哪一塊磁鐵","keep":["同一盒、同樣大小的迴紋針","都用磁鐵的一端去沾","伸進盒子停一樣久再拿起來"],"extra":["兩塊磁鐵的顏色"]},"why":{"cause":"只讓「磁鐵」不一樣，數出來的迴紋針才能比磁力。"},"note":"來源：M-14 常見錯誤：迴紋針大小不同：小的比較容易吸多，就不公平了。B 沾三次：次數不一樣，數字會變多，不是磁鐵比較強。 總表原本的錯誤做法（A 用小迴紋針、B 用大迴紋針；A 沾一次、B 沾三次）不符合 extra 的定義，改放這裡。"},{"id":"n3-mag-034","u":"n3-mag","type":"c","lv":2,"code":"pa-Ⅱ-1","stem":"阿哲用同一塊磁鐵吸迴紋針，測了三次是 9、10、9 個。怎麼記錄最好？","pic":"📝","opts":[{"h":"三次都記下來，再一起比較","ok":true},{"h":"只記最多的 10 個","wy":"挑最好看的數字，結果就不誠實了。"},{"h":"只記第一次的 9 個","wy":"只測一次，碰巧多或少都不知道。"},{"h":"一直重測到每次都一樣才算","wy":"每次差一點點是正常的，不用測到完全一樣。"}],"why":{"cause":"每次結果會差一點點，多測幾次一起看比較可靠。"},"note":"來源：M-15"},{"id":"n3-mag-035","u":"n3-mag","type":"sort","lv":2,"code":"INe-Ⅱ-7","stem":"分一分：哪些東西有用到磁鐵？","pic":"🧲","ans":{"有用到磁鐵":["🧭 指北針","冰箱貼","白板磁鐵","磁鐵釣魚玩具"],"沒有用到磁鐵":["吸盤掛勾","雙面膠","魔鬼氈"]},"why":{"cause":"東西能黏住，不一定是磁鐵，也可能是吸盤、膠或小鉤子。"},"note":"來源：M-16 常見錯誤：吸盤掛勾放「有」：吸盤貼得住玻璃和磁磚，那些都不是鐵，它靠的不是磁力。魔鬼氈放「有」：魔鬼氈是靠小鉤子勾住毛毛，沒有磁鐵。"},{"id":"n3-mag-036","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"磁性畫板用專用的筆一畫就出現線條，筆尖裡最可能藏著什麼？","pic":"🖍️","opts":[{"h":"小磁鐵","ok":true},{"h":"墨水","wy":"畫板推一下下面的推桿，線條就不見了，不是墨水。"},{"h":"電池","wy":"這種筆不用充電也不用插電就能畫。"}],"why":{"cause":"筆尖的小磁鐵，把板子裡會被磁鐵吸的小粉末吸上來，就畫出線了。"},"note":"來源：M-17（改） 圖示要畫出磁性畫板和下面的推桿，避免和液晶手寫板混淆。"},{"id":"n3-mag-037","u":"n3-mag","type":"order","lv":2,"code":"INb-Ⅱ-2","stem":"木屑裡混了鐵釘，用磁鐵和塑膠袋分出來，排出順序。（請大人陪同）","pic":"🧲🔩","ans":["把磁鐵放進塑膠袋裡","拿著袋子在木屑上慢慢移動","鐵釘被吸在袋子外面","把袋子拿到空盒子上方","從袋子裡抽出磁鐵，鐵釘掉進盒子"],"why":{"cause":"隔著袋子吸，抽出磁鐵，鐵釘就自己掉下來。"},"note":"來源：M-18 常見錯誤：先抽出磁鐵再移到盒子：磁鐵一拿走，鐵釘會掉回木屑裡。直接用磁鐵、不包袋子：鐵釘會黏在磁鐵上，很難一根一根拔下來。"},{"id":"n3-mag-038","u":"n3-mag","type":"tw","lv":1,"code":"pe-Ⅱ-2","stem":"「小小的圓形磁鐵亮亮的很可愛，可以放進嘴巴裡玩。」對嗎？","pic":"⚠️","opts":[{"h":"✕","ok":true},{"h":"○","wy":"再想一想：小磁鐵不能放進嘴巴，吞下去很危險。"}],"reasons":[{"h":"吞下去很危險，兩顆以上還可能在肚子裡互相吸住","ok":true},{"h":"磁鐵沒有味道，所以沒關係","wy":"沒有味道也可能傷害身體喔。"},{"h":"只要不咬碎就沒關係","wy":"整顆吞下去才最危險。"}],"right":"小磁鐵不能放進嘴巴，吞下去很危險。","why":{"cause":"小磁鐵不能放進嘴巴，玩完要收好，也不要給弟弟妹妹玩。"},"note":"來源：M-19"},{"id":"n3-mag-039","u":"n3-mag","type":"c","lv":2,"code":"INe-Ⅱ-7","stem":"磁鐵沿著尺靠近迴紋針，離 5 公分吸不動，離 1 公分就吸過去。這說明什麼？","pic":"📏🧲","opts":[{"h":"磁鐵越近，磁力越大","ok":true},{"h":"磁鐵越遠，磁力越大","wy":"5 公分時吸不動，表示遠的時候磁力比較小。"},{"h":"磁力和距離沒有關係","wy":"同一塊磁鐵，遠的時候吸不動、近的時候吸得動，就是和距離有關。"},{"h":"迴紋針自己想跳過去","wy":"迴紋針不會自己動，是磁力拉它的。"}],"why":{"cause":"磁鐵離得越近，磁力越大，近到夠力時迴紋針就被拉過去。"},"note":"來源：補1（改）"},{"id":"n3-mag-040","u":"n3-mag","type":"c","lv":1,"code":"INe-Ⅱ-7","stem":"兩塊條形磁鐵要收進同一個小盒子，怎麼並排放比較好？","pic":"📦🧲","opts":[{"h":"N 極挨著 S 極、S 極挨著 N 極","ok":true},{"h":"N 極挨著 N 極、S 極挨著 S 極","wy":"一樣的極會互相推開，很難放好，蓋子也可能被頂開。"},{"h":"隨便丟進去就好","wy":"磁鐵會互相亂吸、撞在一起，可能撞出缺口。"}],"why":{"cause":"不一樣的極會吸住，這樣並排會乖乖靠在一起，收得好好的。"},"note":"來源：補2"},{"id":"n3-plant-001","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"阿嬤煮了地瓜粥，地瓜是植物的哪個部位？","pic":"🍠","opts":[{"h":"根","ok":true},{"h":"莖","wy":"馬鈴薯才是莖，地瓜是根，這兩個很容易搞混。"},{"h":"葉","wy":"地瓜葉是另一個部位，我們吃的地瓜長在土裡。"},{"h":"果實或種子","wy":"地瓜不是花變成的，裡面也沒有種子。"}],"why":{"cause":"地瓜是長在土裡、變得又粗又大的根。"},"note":"生成題 pl_eat 的例題。"},{"id":"n3-plant-002","u":"n3-plant","type":"sort","lv":1,"code":"INb-Ⅱ-6","stem":"把菜分進「根／葉／花／果實或種子」四個籃子。","ans":{"根":["🥕 紅蘿蔔"],"葉":["🥬 高麗菜"],"花":["🥦 花椰菜"],"果實或種子":["🌽 玉米粒"]},"why":{"cause":"我們吃的菜來自植物不同的部位。","myth":"花椰菜一粒一粒的是還沒開的花；玉米粒是一顆顆長在玉米上的，屬於果實或種子。"},"note":"生成題 pl_sort 的例題。"},{"id":"n3-plant-003","u":"n3-plant","type":"label","lv":1,"code":"INb-Ⅱ-6","stem":"幫小番茄植株貼名牌：把每個名稱牌貼到對的位置。","pic":"🍅","ans":{"pic":"🍅","spots":[{"d":"① 埋在土面以下的部分","k":"根"},{"d":"② 從土裡往上、撐起整株的主幹","k":"莖"},{"d":"③ 長在主幹兩旁、綠色扁平的一片片","k":"葉"},{"d":"④ 黃色的小花","k":"花"},{"d":"⑤ 紅色圓圓的小番茄","k":"果實"}]},"why":{"cause":"一株植物有根、莖、葉、花、果實，各在不同位置。","myth":"小番茄是花謝了以後才長出來的；根在土面以下。"},"note":"生成題 pl_label 的例題。"},{"id":"n3-plant-004","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"颱風過後，路邊大樹沒倒，主要是哪個部位抓住土壤？","pic":"🌳🌀","opts":[{"h":"根","ok":true},{"h":"莖","wy":"樹幹撐起大樹，但牢牢抓住土的是根。"},{"h":"葉","wy":"葉子在上面，颱風時反而會被風吹。"},{"h":"花","wy":"花和抓住土沒有關係。"}],"why":{"cause":"根在土裡長得又多又深，像手一樣抓住土。"}},{"id":"n3-plant-005","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"柚子撿到一片竹葉，葉脈從葉子底部直直排到尖端，彼此不交錯。這是哪一種葉脈？","pic":"🎋","opts":[{"h":"平行脈","ok":true},{"h":"網狀脈","wy":"網狀脈會分岔、連成網，竹葉的線條是並排的。"},{"h":"沒有葉脈","wy":"那一條條的線就是葉脈。"}],"why":{"cause":"葉脈一條條並排、不交錯的，叫平行脈。"}},{"id":"n3-plant-006","u":"n3-plant","type":"order","lv":1,"code":"INd-Ⅱ-3","stem":"植物的一生，請排出順序。","pic":"🌱","ans":["種子","發芽","長出葉子","開花","結出果實"],"why":{"cause":"從種子到結果實，植物一步一步長大。","myth":"小苗要先長葉子、長大，才會開花；果實是花變成的。"}},{"id":"n3-plant-007","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「我們吃的蔬菜都是葉子。」這句話對嗎？","pic":"🥕🥦","opts":[{"h":"○","wy":"很多小朋友會這樣想喔，但紅蘿蔔是根、花椰菜是花。"},{"h":"✕","ok":true}],"reasons":[{"h":"紅蘿蔔是根、花椰菜是花，吃的部位不一樣","ok":true},{"h":"蔬菜都是綠色的，所以都是葉子","wy":"紅蘿蔔是橘色的，綠色的花椰菜也不是葉子。"},{"h":"只有葉子可以吃","wy":"根、莖、花、果實也都有人吃。"}],"right":"蔬菜不只吃葉子，也有吃根、莖、花、果實的。","why":{"cause":"蔬菜不只吃葉子，也有吃根、莖、花、果實的。"}},{"id":"n3-plant-008","u":"n3-plant","type":"sort","lv":2,"code":"INb-Ⅱ-6","stem":"把食物分進「根／莖／花／果實或種子」四個籃子。","ans":{"根":["🍠 地瓜"],"莖":["🥔 馬鈴薯","薑","竹筍"],"花":["🥦 花椰菜","金針花"],"果實或種子":["🍅 番茄","🥜 花生"]},"why":{"cause":"長在土裡的不一定是根，馬鈴薯、薑都是莖。","myth":"很多小朋友以為長在土裡的都是根，其實馬鈴薯是莖；花生是在土裡長大的果實。"},"note":"日後可改由程式產生（物品併入 PLANTS，竹筍註明嫩莖）。"},{"id":"n3-plant-009","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「番茄、小黃瓜、茄子都是蔬菜，所以不是果實。」這句話對嗎？","pic":"🍅🥒🍆","opts":[{"h":"○","wy":"它們雖然被當菜吃，但都是花變成、裡面有種子的果實。"},{"h":"✕","ok":true}],"reasons":[{"h":"它們都是花變成的，裡面有種子，所以是果實","ok":true},{"h":"不甜的就不是果實","wy":"果實不一定甜，小黃瓜就不甜。"},{"h":"長在土裡的才叫蔬菜","wy":"番茄長在枝上，也被當菜吃。"}],"right":"番茄、小黃瓜、茄子都是花變成、裡面有種子的果實，只是被當菜吃。","why":{"cause":"它們都是花變成、裡面有種子的果實，只是被當菜吃。"}},{"id":"n3-plant-010","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-6","tag":"先猜再看","stem":"白花插在加了藍色食用色素的水裡，過兩天花瓣會怎樣？（請大人剪莖）","pic":"🌼💧","opts":[{"h":"花瓣慢慢出現藍色","ok":true},{"h":"花瓣完全不變","wy":"莖會把水往上送，色素也跟著上去了。"},{"h":"花瓣變透明","wy":"色素是藍色的，花瓣只會被染上藍色。"}],"why":{"cause":"莖像水管，把水從下面送到花和葉子。"}},{"id":"n3-plant-011","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-7","stem":"煜煜用手指輕輕碰含羞草的葉子，葉子會怎樣？","pic":"🌿","opts":[{"h":"小葉片合起來、垂下去","ok":true},{"h":"變成紅色","wy":"含羞草被碰到不會變色。"},{"h":"一點都不會動","wy":"很多小朋友以為植物不會動，含羞草一碰就會合起來。"}],"why":{"cause":"植物也會動，只是大多數動得很慢，含羞草比較快。"}},{"id":"n3-plant-012","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"榕樹葉和竹葉的葉脈長得不一樣，玉米葉比較像哪一種？","pic":"🌽","opts":[{"h":"像竹葉，是平行脈","ok":true},{"h":"像榕樹葉，是網狀脈","wy":"玉米葉的線條從頭到尾並排，不會連成網。"},{"h":"玉米葉沒有葉脈","wy":"葉子上一條條的線就是葉脈。"}],"why":{"cause":"玉米葉和竹葉一樣，葉脈一條條平行。"}},{"id":"n3-plant-013","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「所有植物都會開出大大的、漂亮的花。」這句話對嗎？","pic":"🌾🌸","opts":[{"h":"○","wy":"很多植物的花小小的、不起眼，例如稻子。"},{"h":"✕","ok":true}],"reasons":[{"h":"稻子也會開花，只是花很小、不明顯","ok":true},{"h":"沒看到花就是沒開花","wy":"有的花小到很難發現。"},{"h":"只有花園裡的植物才會開花","wy":"田裡的稻子、路邊的小草也會開花。"}],"right":"很多植物的花小小的、不起眼，不是都又大又漂亮。","why":{"cause":"很多植物的花小小的、不起眼，不是都又大又漂亮。"}},{"id":"n3-plant-014","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-7","adv":true,"stem":"仙人掌身上尖尖的刺，是由哪個部位變來的？","pic":"🌵","opts":[{"h":"葉","ok":true},{"h":"莖","wy":"仙人掌綠綠胖胖的身體才是莖。"},{"h":"根","wy":"根長在土裡。"},{"h":"花","wy":"仙人掌的花是另外開出來的。"}],"why":{"cause":"葉子變成細刺，比較不會讓水分跑掉。"},"note":"進階題，不進段考。"},{"id":"n3-plant-015","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"喬妹拔起一株小草，根上黏著很多土。這說明根有什麼工作？","pic":"🌿","opts":[{"h":"抓住土壤，讓植物站穩","ok":true},{"h":"根會吃土長大","wy":"很多小朋友會這樣想喔，但植物不是吃土長大的。"},{"h":"根是用來開花的","wy":"花開在地面上，不是根的工作。"}],"why":{"cause":"根抓住土，植物才站得穩。"}},{"id":"n3-plant-016","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","tag":"猜猜我是誰","stem":"猜猜我是誰？","hints":["我長在土裡。","我長長的、一頭粗一頭尖，外面橘色，切開裡面也是橘色。","我其實是植物的根。"],"opts":[{"h":"紅蘿蔔","ok":true},{"h":"白蘿蔔","wy":"白蘿蔔也是根，可是它是白色的。"},{"h":"馬鈴薯","wy":"馬鈴薯圓圓的，而且是莖。"},{"h":"蓮藕","wy":"蓮藕切開有洞洞，也是莖。"}],"why":{"cause":"紅蘿蔔是又長又粗的根，裡外都是橘色。"},"note":"提示要一個一個打開。"},{"id":"n3-plant-017","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「下雨天植物用葉子喝水，所以澆水要澆在葉子上。」這句話對嗎？","pic":"🌧️🌱","opts":[{"h":"○","wy":"植物主要用根吸水，澆在葉子上，大部分的水會流掉。"},{"h":"✕","ok":true}],"reasons":[{"h":"植物主要用根吸水，要澆在根附近的土裡","ok":true},{"h":"葉子太小，喝不到水","wy":"不是大小的問題，吸水主要靠根。"},{"h":"雨水只有花會喝","wy":"雨水滲進土裡，是根把水吸進去。"}],"right":"植物主要用根吸水，澆水要澆在根附近的土。","why":{"cause":"植物主要用根吸水，澆水要澆在根附近的土。"}},{"id":"n3-plant-018","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-6","stem":"媽媽買的青蔥，底部有一大把細細的根，粗細都差不多。這種根叫什麼？","opts":[{"h":"鬚根","ok":true},{"h":"軸根","wy":"軸根有一條特別粗的主根，蔥的根粗細都差不多。"},{"h":"匍匐莖","wy":"這是在說莖貼著地面長，不是根。"}],"why":{"cause":"一大把粗細差不多的根叫鬚根，像鬍鬚一樣。"}},{"id":"n3-plant-019","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「植物的根，都是一條粗粗的、直直往下長。」這句話對嗎？","pic":"🌱","opts":[{"h":"○","wy":"有的根是一大把粗細差不多的細根，像蔥和小草。"},{"h":"✕","ok":true}],"reasons":[{"h":"有的植物的根是一大把粗細差不多的細根，像小草、蔥","ok":true},{"h":"根一定要又粗又直，才抓得住土","wy":"一大把鬚根也能牢牢抓住土。"},{"h":"只有大樹有根，小草沒有根","wy":"拔小草時會看到一大把細根喔。"}],"right":"根有兩種樣子：有一條主根的軸根，和一大把的鬚根。","why":{"cause":"根有兩種樣子：有一條主根的軸根，和一大把的鬚根。"}},{"id":"n3-plant-020","u":"n3-plant","type":"sort","lv":2,"code":"INb-Ⅱ-6","stem":"把植物分進「鬚根」和「軸根」兩個籃子。","ans":{"鬚根":["🌾 稻子","🌽 玉米","韭菜"],"軸根":["綠豆","白蘿蔔","🌻 向日葵"]},"why":{"cause":"有一條粗主根的是軸根；一大把粗細差不多的是鬚根。","myth":"白蘿蔔中間那條又粗又長的就是主根；玉米的根是一大把，沒有一條特別粗的主根。"}},{"id":"n3-plant-021","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"向日葵的莖又直又硬，自己撐起大大的花。這是哪一種莖？","pic":"🌻","opts":[{"h":"直立莖","ok":true},{"h":"攀爬莖","wy":"攀爬莖要抓著別的東西才能往上長，向日葵自己就站得直。"},{"h":"匍匐莖","wy":"匍匐莖是貼著地面長的。"}],"why":{"cause":"自己直直站著往上長的莖，叫直立莖。"}},{"id":"n3-plant-022","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-6","stem":"百香果的莖細細長長，用捲捲的鬚抓住棚架往上長。這是哪一種莖？","opts":[{"h":"攀爬莖","ok":true},{"h":"直立莖","wy":"它的莖太細太軟，自己站不起來。"},{"h":"匍匐莖","wy":"它是往上爬，不是貼著地面長。"},{"h":"鬚根","wy":"捲捲的鬚長在莖上，用來抓東西，不是根。"}],"why":{"cause":"莖細軟、要抓著棚架或牆往上長的，叫攀爬莖。"},"note":"總表依據欄另列 INb-Ⅱ-7。"},{"id":"n3-plant-023","u":"n3-plant","type":"sort","lv":2,"code":"INb-Ⅱ-6","stem":"把植物分進「直立莖」「攀爬莖」「匍匐莖」三個籃子。","ans":{"直立莖":["🌳 榕樹","🌽 玉米"],"攀爬莖":["🍇 葡萄","🥒 小黃瓜"],"匍匐莖":["🍠 地瓜","🍓 草莓的走莖"]},"why":{"cause":"莖有不同樣子：自己站直、抓東西往上爬、貼著地面長。","myth":"地瓜的莖長長的，是貼著地面往旁邊長；葡萄用捲鬚抓著棚架往上爬，不是貼著地。"},"note":"「草莓的走莖」卡片用圖示畫出貼地的走莖，文字不寫「貼著地面」。"},{"id":"n3-plant-024","u":"n3-plant","type":"c","lv":1,"code":"INb-Ⅱ-6","stem":"柚子把芒果葉放在紙下面，用蠟筆輕輕塗，印出的葉脈像一張網。這叫什麼脈？","pic":"🍃🖍️","opts":[{"h":"網狀脈","ok":true},{"h":"平行脈","wy":"平行脈是一條一條並排，不會交錯成網，像竹葉。"},{"h":"沒有葉脈","wy":"每片葉子都有葉脈，拓印才印得出線條。"}],"why":{"cause":"葉脈分岔、互相連成網的，叫網狀脈。"}},{"id":"n3-plant-025","u":"n3-plant","type":"sort","lv":1,"code":"INb-Ⅱ-6","stem":"把葉子分進「網狀脈」和「平行脈」兩個籃子。","ans":{"網狀脈":["楓香葉","地瓜葉","榕樹葉"],"平行脈":["竹葉","稻子的葉","韭菜葉"]},"why":{"cause":"看葉脈是一條條並排，還是分岔連成網，就知道是哪一種。","myth":"韭菜葉的線條是從頭到尾一條條並排的；地瓜葉的葉脈會分岔、連成網。"}},{"id":"n3-plant-026","u":"n3-plant","type":"label","lv":1,"code":"INb-Ⅱ-6","stem":"幫葉子貼名牌：把每個名稱牌貼到對的位置。","pic":"🍃","ans":{"pic":"🍃","spots":[{"d":"① 寬寬平平、靠近葉子外圈的部分","k":"葉片"},{"d":"② 葉片下面連著莖的細細短柄","k":"葉柄"},{"d":"③ 從葉片中間直直通到尖端的那條主線","k":"葉脈"}]},"why":{"cause":"一片葉子有葉片、葉柄，葉片上還有葉脈。","myth":"中間那條是主葉脈，葉柄在葉片下面、連著莖。"},"note":"葉片的位置設在葉緣附近沒有葉脈處；葉脈只接受主脈，判定時葉脈區域優先。"},{"id":"n3-plant-027","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-4","stem":"很多花有鮮豔的顏色和香香的味道，這對植物最主要的幫助是什麼？","pic":"🌸🐝","opts":[{"h":"吸引昆蟲來，幫忙傳花粉","ok":true},{"h":"讓花不怕雨淋","wy":"顏色和香味擋不住雨。"},{"h":"讓人想把它摘回家","wy":"花被摘走就結不出果實了，對植物沒有幫助。"}],"why":{"cause":"昆蟲被吸引來，順便把花粉傳開，花才容易結果實。"}},{"id":"n3-plant-028","u":"n3-plant","type":"order","lv":2,"code":"INb-Ⅱ-6","stem":"絲瓜的花怎麼變成絲瓜？請排出順序。","pic":"🌼","ans":["絲瓜開出黃色的花","蜜蜂來採蜜，把花粉帶到別朵花上","花謝了，花後面連著的小絲瓜開始長大","長成長長的絲瓜，裡面有種子"],"why":{"cause":"先開花、傳花粉，花謝後果實才慢慢長大，裡面有種子。","myth":"很多小朋友會這樣想喔，其實要先開花、傳了花粉，絲瓜才會長大。"},"note":"圖示畫雌花（花後面連著小絲瓜）。"},{"id":"n3-plant-029","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-6","stem":"「每一朵花，最後都一定會變成果實。」這句話對嗎？","pic":"🌼","opts":[{"h":"○","wy":"絲瓜棚上就有很多花謝了，也沒有結出絲瓜。"},{"h":"✕","ok":true}],"reasons":[{"h":"有的花沒有傳到花粉，或被風雨打落，就結不出果實","ok":true},{"h":"花謝了以後都會變成葉子","wy":"花不會變成葉子。"},{"h":"只要開了花，就一定會結果實","wy":"絲瓜棚上就有很多花謝了也沒結絲瓜。"}],"right":"花要先傳到花粉才容易結果，不是每朵都會變成果實。","why":{"cause":"花要先傳到花粉才容易結果，不是每朵都會變成果實。"}},{"id":"n3-plant-030","u":"n3-plant","type":"sort","lv":2,"code":"INb-Ⅱ-7","stem":"這些植物的種子靠什麼去遠方？分進「風」「動物」「自己彈開」三個籃子。","ans":{"風":["木棉","青楓"],"動物":["🌳 榕樹","鬼針草"],"自己彈開":["鳳仙花","酢漿草"]},"why":{"cause":"種子有不同的旅行方法：乘風、搭動物的便車、自己彈出去。","myth":"鳥吃了榕樹的果實，種子跟著鳥糞被帶到別處；青楓的種子有像翅膀的薄片，是被風帶著轉呀轉飛走的。"},"note":"「青楓」卡片一定要配翅果（帶翅膀的種子）的圖。"},{"id":"n3-plant-031","u":"n3-plant","type":"c","lv":2,"code":"INb-Ⅱ-7","stem":"阿哲穿過草叢，褲子黏了好多帶小刺的種子。這種種子靠什麼去遠方？","pic":"👖","opts":[{"h":"黏在動物的毛或人的衣服上被帶走","ok":true},{"h":"被風吹走","wy":"這種種子沒有絨毛或翅膀，風吹不遠。"},{"h":"順著水漂走","wy":"它是黏在你的褲子上，不是在水裡。"},{"h":"自己彈出去","wy":"它是被你帶走的，不是自己彈的。"}],"why":{"cause":"有小刺或小鉤的種子，會黏在動物或人身上搭便車。"}},{"id":"n3-plant-032","u":"n3-plant","type":"tw","lv":2,"code":"INb-Ⅱ-4","stem":"「葉脈只是葉子上的花紋，沒有什麼用處。」這句話對嗎？","pic":"🍃","opts":[{"h":"○","wy":"葉脈有真正的工作，會送水給葉子，也撐住葉片。"},{"h":"✕","ok":true}],"reasons":[{"h":"葉脈能把水送到整片葉子，也像骨架一樣撐開葉片","ok":true},{"h":"葉脈是蟲咬出來的痕跡","wy":"每片新長的葉子本來就有葉脈。"},{"h":"葉脈只是讓葉子比較好看","wy":"葉脈有真正的工作，不只是裝飾。"}],"right":"葉脈像小水管和骨架，送水給葉子，也撐住葉片。","why":{"cause":"葉脈像小水管和骨架，送水給葉子，也撐住葉片。"}},{"id":"n3-plant-033","u":"n3-plant","type":"fair","lv":2,"code":"pe-Ⅱ-1","stem":"煜煜想知道「綠豆發芽需不需要水」。要怎麼安排兩盒 const WIDGETS={

   if(st.ch==null)return `<div><b>① 這個實驗要「改變」的是哪一個條件？</b></div><div class="chips">${P.conds.map((c,x)=>`<span class="chip" onclick="${lock?'':`wAct(${i},'sel',${x})`}">${zyH(c)}</span>`).join('')}</div>`;
   return `<div>① 要改變的：<span class="chip on ${bad.includes(st.ch)?'bad':''}">${zyH(P.conds[st.ch])}</span> ${lock?'':`<button class="btn small ghost" onclick="wAct(${i},'back',0)">重選</button>`}</div><div style="margin-top:8px"><b>② 哪些要「保持一樣」？可以選好幾個。</b></div><div class="chips">${P.conds.map((c,x)=>x===st.ch?'':`<span class="chip ${st.kp.includes(x)?'on':''} ${bad.includes(x)?'bad':''}" onclick="${lock?'':`wAct(${i},'put',${x})`}">${st.kp.includes(x)?'✔ ':''}${zyH(c)}</span>`).join('')}</div>`},
  answer(P){const a=P.q.ans;return `要改變：${zyH(a.change)}<br>要保持一樣：${a.keep.map(x=>zyH(x)).join('、')}${a.extra&&a.extra.length?`<br>不用管：${a.extra.map(x=>zyH(x)).join('、')}`:''}`}},
 label:{
  prep(P){P.names=shuffle(P.q.ans.spots.map(s=>s.k))},
  init(){return {place:{},sel:null}},
  act(P,st,k,x){if(k==='sel')st.sel=st.sel===x?null:x;else if(k==='put'){if(st.sel!=null){for(const y in st.place)if(st.place[y]===st.sel)delete st.place[y];st.place[x]=st.sel;st.sel=null}else delete st.place[x]}},
  ready(P,st){return P.q.ans.spots.every((_,y)=>st.place[y]!=null)},
  check(P,st){const bad=[];P.q.ans.spots.forEach((s,y)=>{if(P.names[st.place[y]]!==s.k)bad.push(y)});return {ok:!bad.length,bad}},
  draw(P,i,st,lock){const a=P.q.ans,bad=st.bad||[],used=Object.values(st.place);
   return `${a.pic?`<div class="qpic">${esc(a.pic)}</div>`:''}<div class="muted">先點一張名牌，再點它要貼的位置。</div><div class="chips">${P.names.map((n,x)=>used.includes(x)?'':`<span class="chip ${st.sel===x?'sel':''}" onclick="${lock?'':`wAct(${i},'sel',${x})`}">🏷️ ${zyH(n)}</span>`).join('')}</div><div class="spots">${a.spots.map((s,y)=>`<div class="spot ${bad.includes(y)?'bad':''}" onclick="${lock?'':`wAct(${i},'put',${y})`}"><span>${zyH(s.d)}</span><span class="slot">${st.place[y]!=null?zyH(P.names[st.place[y]]):'？'}</span></div>`).join('')}</div>`},
  answer(P){return P.q.ans.spots.map(s=>`${zyH(s.d)} → <b style="display:inline">${zyH(s.k)}</b>`).join('<br>')}}};
