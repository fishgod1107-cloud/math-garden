<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2b2b">
<title>喵喵寫字屋</title>
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#2a2622;--sub:#6b625a;--pri:#2f2f2f;--pri2:#c0392b;--red:#d93a3a;--sun:#ffcf4d;--sky:#7cc6ef;--rose:#ff8a8a;--okc:#dcf5dc;--bad:#ffe0e0;--line:#e6dccb;--blue:#1e6fd9;--shadow:0 4px 0 rgba(60,40,20,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;font-size:20px;line-height:1.5;overflow-x:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
#appRoot{max-width:900px;margin:0 auto;padding:12px 16px 40px}
#printBox{display:none;max-width:900px;margin:0 auto 60px;padding:0 16px;overflow:hidden}
#hwPark{display:none}
h1{font-size:28px;margin:6px 0}h2{font-size:24px;margin:10px 0 6px;color:var(--pri2)}h3{font-size:21px;margin:8px 0}
.hero{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#3a3a3a,#1f1f1f);color:#fff;border-radius:26px;padding:10px 14px;margin:4px 0 8px;box-shadow:0 6px 16px rgba(0,0,0,.2);border-bottom:6px solid var(--red)}
.heroT{flex:1;min-width:0}.hero h1{margin:0;font-size:30px;letter-spacing:2px}
.hero .z{color:#ffd9d9;opacity:1}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}.pill{background:rgba(255,255,255,.18);border-radius:14px;padding:2px 10px;font-size:16px;font-weight:700}
.hero .kidbtn{max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;line-height:40px;background:#fff;border:0;color:#222}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:56px;min-width:56px;padding:8px 18px;border:0;border-radius:18px;background:var(--pri);color:#fff;font-size:21px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#5a3d00}.btn.sky{background:var(--sky);color:#083a55}.btn.rose{background:var(--rose)}
.btn.small{font-size:17px;padding:6px 12px;border-radius:14px}
.btn.big{font-size:24px;padding:10px 24px;background:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.center{justify-content:center;text-align:center}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 10px rgba(60,40,20,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--line);cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;position:relative;font-family:inherit;color:var(--ink);gap:4px}
.tile .em{font-size:40px;line-height:1.1}.tile small{font-weight:400;color:var(--sub);font-size:15px}
.tile .badge{position:absolute;top:6px;right:8px;background:var(--rose);color:#fff;border-radius:12px;padding:0 8px;font-size:15px}
.tile:active{transform:translateY(3px)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile.lesson{min-height:96px;border-left:8px solid var(--red)}.tile.lesson.lock{opacity:.5;border-left-color:#bbb}
.lnum{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center;font-size:19px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}.top .sp{flex:1}
.mascot{display:flex;gap:10px;align-items:center;margin:8px 0}
.catbtn{background:none;border:0;padding:0;cursor:pointer;flex:none;min-width:56px;min-height:56px}
.catsvg{display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.catsvg .face{animation:blink 5s infinite;transform-origin:50px 46px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.2)}}
.bubble{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:1;position:relative;font-size:21px}
.warn{background:#ffe1e1;border:2px solid #e55;color:#900;border-radius:16px;padding:12px;margin:10px 0;font-weight:700}
.note{background:#fff7d6;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:17px}
.muted{color:var(--sub);font-size:16px}
.tasks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.task{flex:1;min-width:150px;background:#fff;border-radius:16px;padding:8px 10px;border:2px dashed var(--line);font-size:18px;display:flex;flex-direction:column}.task small{font-size:18px;color:var(--sub)}.task.ok{border-style:solid;border-color:#2f9e44;background:var(--okc)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:10px 0}
.ccard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;color:var(--ink);position:relative;min-height:56px;font-size:18px}
.ccard.sel{border-color:var(--red);box-shadow:0 0 0 3px #ffd2d2}.ccard.due{border-color:var(--red)}
.ccard small{font-size:14px;color:var(--sub)}
.czy{font-size:22px}
.paw{position:absolute;top:2px;right:6px;font-size:20px}
.stars{color:#f5a623;font-size:20px;letter-spacing:1px}.stars i{font-style:normal;color:#ddd}
.bigstar .stars{font-size:46px}
.chip{min-height:56px;display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:20px;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{border-color:#2f9e44;background:var(--okc)}.chip.big{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.charHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigc{font-size:64px;font-weight:700;line-height:1.2}
.pill2{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 12px;font-size:20px}
.charWrap,.writeWrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.cinfo,.wside{flex:1;min-width:260px;max-width:440px}
.wslot{display:flex;justify-content:center}
#hwBox{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#fff;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.1);overscroll-behavior:contain}
#hwBox>svg,#hwTarget{position:absolute;left:0;top:0}
#hwGrid,#hwOver{pointer-events:none}
#hwTarget svg{display:block}
.pulse{animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.3}}
.sbar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;max-width:440px}
.sbtn{min-width:46px;min-height:56px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:17px;font-family:inherit;cursor:pointer;color:var(--ink)}
.sbtn.on{background:#ffe9e9;border-color:#f3b0b0}.sbtn.cur{background:var(--red);color:#fff;border-color:var(--red)}
.ctrl{margin:6px 0}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:56px;font-size:18px;cursor:pointer}.chk input{width:26px;height:26px}
.radc{color:var(--blue)}.radc.big{font-size:30px;font-weight:700}
.zyplain{font-size:26px;font-weight:700}
.model{display:flex;justify-content:center;margin:4px 0}
.qhead{display:flex;align-items:center;gap:10px}.qhead .sp{flex:1}
.stage{background:var(--red);color:#fff;border-radius:14px;padding:4px 12px;font-weight:700}.stage .z{color:#fff}
.prog{height:12px;background:#eee4d4;border-radius:8px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--red);transition:width .4s}
.qcard{background:#fff;border-radius:24px;padding:16px;box-shadow:0 3px 14px rgba(60,40,20,.1);border-top:8px solid var(--red)}
.stem{font-size:24px;font-weight:700;margin:4px 0 10px;text-align:center}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.opts3.two{grid-template-columns:1fr 1fr}
.gopt{background:#fff;border:3px solid var(--line);border-radius:18px;min-height:72px;padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.gopt.num{font-size:28px;font-weight:700}.gopt .gl{max-width:100%;height:auto}
.gopt.ok{border-color:#2f9e44;background:var(--okc)}.gopt.bad{border-color:var(--rose);background:var(--bad);opacity:.6}
.catStage{display:inline-block;background:#fff;border-radius:8px}
.fb{margin-top:12px;border-radius:18px;padding:12px 14px;font-size:20px}.fb.good{background:var(--okc)}.fb.try{background:#fff3cf}.fb.lose{background:#ffeaea}.fb b{display:block}
.score{font-size:60px;font-weight:800;color:var(--red);text-align:center}.score .stars{font-size:56px}
.stk{font-size:40px;display:inline-block;margin:4px}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#fff;border-radius:18px;padding:10px}
.album span{font-size:32px;text-align:center;background:#faf5ea;border-radius:12px;aspect-ratio:1;min-height:44px;display:flex;align-items:center;justify-content:center}
.album span.empty{opacity:.18;font-size:22px}
.rev{border-left:6px solid var(--line);padding:6px 10px;margin:8px 0;background:#fff;border-radius:10px}.rev.ok{border-color:#2f9e44}
.reels{display:flex;justify-content:center;gap:10px;font-size:54px;margin:10px 0}.reel{background:#fff;border-radius:16px;padding:6px 12px;border:3px solid var(--sun)}
.findBox{display:flex;justify-content:center}.findBox svg{background:#fff;border-radius:6px}
.tabs .btn{min-width:90px}
.exrow .ccard{min-width:72px}
#modalBox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,20,10,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBox.on{display:flex}
.mcard{background:#fff;border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
#toastBox{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(160px);background:#2b2622;color:#fff;border-radius:16px;padding:10px 18px;font-size:19px;z-index:60;transition:transform .3s;max-width:90vw;text-align:center}
#toastBox .z{color:#ffd9d9}
#toastBox.on{transform:translateX(-50%) translateY(0)}
#bootErr{display:none;background:#ffe1e1;color:#900;padding:12px;margin:12px;border-radius:12px;font-weight:700}
input,select,textarea{font-size:20px;font-family:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);max-width:100%;min-height:48px}
textarea{width:100%;min-height:120px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.pz{font-size:18px}.pz section{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0;overflow-x:auto}.pz h3{margin-top:0}.pz .btn.small{min-height:48px}
pre.lic{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#faf7f0;padding:10px;border-radius:10px;max-height:320px;overflow:auto}
details{margin:8px 0}summary{min-height:44px;cursor:pointer;font-weight:700;padding:8px 0}
/* 注音（直排在字的右邊，和數學小花園同樣式） */
.zc{display:inline-flex;align-items:center;vertical-align:middle}
.z{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:.4em;line-height:1;width:1em;margin:0 .55em 0 .08em;font-weight:700;opacity:.9;color:#8a5a20}
.z i{font-style:normal;display:block}
.z i.zn{position:absolute;left:.92em;bottom:.28em;font-weight:400;display:inline}
.btn:not(.ghost):not(.sun):not(.sky) .z{color:#ffe1c4}
/* 列印頁：螢幕上縮放預覽，列印時 A4 */
.pscale{transform-origin:0 0}
.page{width:186mm;background:#fff;color:#000;padding:4mm 0;margin:0 0 10mm;box-shadow:0 2px 10px rgba(0,0,0,.15);break-after:page;page-break-after:always}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:13pt;border-bottom:.6pt solid #999;padding:0 2mm 2mm;margin-bottom:3mm}
.phead .catsvg{filter:none}
.pblk{break-inside:avoid;page-break-inside:avoid;padding:1mm 2mm 3mm;border-bottom:.4pt dashed #ccc}
.phd{font-size:12pt;margin-bottom:1mm}.pc{font-size:18pt}.pzy{font-size:12pt}
.pdec{display:flex;flex-wrap:wrap;gap:1mm;margin-bottom:1.5mm}
.prow{display:flex;gap:2mm}
.pg{display:block;flex:none}
@page{size:A4;margin:12mm}
@media print{
 html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{padding:0}
 #appRoot,#modalBox,#toastBox,#bootErr,#hwPark{display:none!important}
 #printBox{display:block!important;padding:0;margin:0;max-width:none;height:auto!important;overflow:visible}
 .pscale{transform:none!important;height:auto!important}
 .page{box-shadow:none;margin:0}
 .page:last-child{break-after:auto;page-break-after:auto}}
@media (max-width:480px){html,body{font-size:18px}.hero h1{font-size:23px;letter-spacing:0}.hero>.catsvg{display:none}.hero .pill{font-size:13px;padding:1px 8px}.hero .kidbtn{max-width:38%}.grid{grid-template-columns:repeat(2,1fr)}.lgrid{grid-template-columns:repeat(2,1fr)}.album{grid-template-columns:repeat(5,1fr)}.bigc{font-size:52px}.cgrid{grid-template-columns:repeat(3,1fr)}.cinfo,.wside{min-width:0;flex:1 1 100%;max-width:none}.btn{font-size:19px;padding:8px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="bootErr"></div>
<div id="appRoot"><p style="text-align:center;margin-top:40px">🐾 載入中……</p></div>
<div id="printBox"></div>
<div id="hwPark"><div id="hwBox"><svg id="hwGrid" aria-hidden="true"></svg><div id="hwTarget"></div><svg id="hwOver" aria-hidden="true"></svg></div></div>
<div id="modalBox"></div>
<div id="toastBox"></div>
<script>
var bootStep=0;function boot(n){bootStep=n}
function showErr(m){var b=document.getElementById('bootErr');if(b){b.style.display='block';b.textContent='⚠️ 遊戲出錯了（步驟 '+bootStep+'）：'+m+'。請截圖給爸爸媽媽。'}}
window.onerror=function(m,s,l,c){showErr(m+' @'+l+':'+c);return false};
setTimeout(function(){if(!document.body.getAttribute('data-ok'))showErr('遊戲沒有正常啟動。'+navigator.userAgent)},4000);
boot(1);
</script>

 const slots=slotIds(k),sset=new Set(slots),used=new Set(k.stk.filter(s=>sset.has(s.id)).map(s=>s.id)),free=slots.filter(x=>!used.has(x));

/* ---- 備份與合併 ---- */
function backupJson(){return JSON.stringify({app:'writeCat',v:1,at:Date.now(),data:S})}
function backupNow(){S.lastBak=Date.now();save()}
function bakName(){return '喵喵寫字屋備份_'+today()+'.txt'}
function exportBackup(){const txt=backupJson();if(!CAN_DL)return showBackupText();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=bakName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);backupNow();toast('已下載備份檔')}catch(e){showBackupText()}}
function shareBackup(){try{const f=new File([backupJson()],bakName(),{type:'text/plain'});const d={files:[f],title:'喵喵寫字屋備份'};if(navigator.canShare&&!navigator.canShare(d))return showBackupText();navigator.share(d).then(()=>{backupNow();toast('已分享')}).catch(()=>{})}catch(e){showBackupText()}}
function showBackupText(){modal(`<div class="pz"><h2>📋 備份文字</h2><p class="muted">全選複製後，貼到備忘錄或寄給自己。</p><textarea readonly onclick="this.select()">${esc(backupJson())}</textarea><div class="row center"><button class="btn" onclick="copyBak()">複製</button><button class="btn ghost" onclick="closeModal()">關閉</button></div></div>`)}
function copyBak(){const t=document.querySelector('#modalBox textarea');try{navigator.clipboard.writeText(t.value).then(()=>{backupNow();toast('已複製')},()=>{t.select();document.execCommand('copy');backupNow();toast('已複製')})}catch(e){t.select();document.execCommand('copy');backupNow();toast('已複製')}}
function readBakFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bakText').value=r.result;toast('讀好了，請按合併或取代')};r.readAsText(f)}
function parseBak(txt){let d=JSON.parse(String(txt).trim().replace(/^\ufeff/,''));
 if(d&&d.app!=null){if(d.app!=='writeCat'||!d.data)throw new Error('這不是喵喵寫字屋的備份');d=d.data}
 else if(!(d&&Array.isArray(d.kids)&&d.kids.every(k=>k&&Array.isArray(k.earned)&&Array.isArray(k.stk)&&k.ch&&typeof k.ch==='object')))throw new Error('這不是喵喵寫字屋的備份');
 return norm(d)}
function restoreText(){const t=$('#bakText').value;if(!t.trim()){toast('請先貼上備份文字');return null}try{return parseBak(t)}catch(e){toast('看不懂這份備份：'+e.message);return null}}
function unionBy(a,b,key){const m=new Map();for(const x of (a||[]).concat(b||[]))if(x&&!m.has(key(x)))m.set(key(x),x);return [...m.values()]}
/* 合併（冪等）：生字的狀態欄整組取 at 較新的一份，次數與最佳星等取大；錯字本由 ch 推算，所以畢業的字不會被舊備份帶回 */
function mergeCh(x,y){if(!x)return JSON.parse(JSON.stringify(y));if(!y)return x;
 const nw=(y.at||0)>(x.at||0)?y:x,o=JSON.parse(JSON.stringify(nw));
 for(const f of ['an','tr','qz','star','tstar'])o[f]=Math.max(x[f]||0,y[f]||0);o.at=Math.max(x.at||0,y.at||0);return o}
function mergeKid(a,b){
 for(const f of ['earned','stk','spent'])a[f]=unionBy(a[f],b[f],x=>x.id).sort((x,y)=>x.t-y.t);
 const giv=new Set(a.prizes.concat(b.prizes).filter(p=>p.given).map(p=>p.id));a.prizes=unionBy(a.prizes,b.prizes,x=>x.id).sort((x,y)=>x.t-y.t);a.prizes.forEach(p=>{if(giv.has(p.id))p.given=true});
 for(const c in b.ch)a.ch[c]=mergeCh(a.ch[c],b.ch[c]);
 for(const r in b.ruleMiss)a.ruleMiss[r]=Math.max(a.ruleMiss[r]||0,b.ruleMiss[r]);
 for(const t in b.stat){const x=a.stat[t],y=b.stat[t];if(!x||y.n>x.n)a.stat[t]=Object.assign({},y)}
 for(const c in b.cards)if(!a.cards[c]||b.cards[c]>a.cards[c])a.cards[c]=b.cards[c];
 for(const u in b.best)a.best[u]=Math.max(a.best[u]==null?-1:a.best[u],b.best[u]);
 for(const u in b.bestPaid)if(!a.bestPaid[u]||b.bestPaid[u]>a.bestPaid[u])a.bestPaid[u]=b.bestPaid[u];
 if(b.streakPaid>a.streakPaid)a.streakPaid=b.streakPaid;
 a.days=[...new Set(a.days.concat(b.days))].sort().slice(-60);
 for(const f in b.flags)if(!a.flags[f]||b.flags[f]>a.flags[f])a.flags[f]=b.flags[f];
 a.log=unionBy(a.log,b.log,x=>x.t+'|'+x.u+'|'+x.s).sort((x,y)=>y.t-x.t).slice(0,300);
 return a}
function kidsOf(d){return d.kids}
function restoreMerge(){const d=restoreText();if(!d)return;let add=0,mer=0;
 for(const b of kidsOf(d)){const a=S.kids.find(x=>x.id===b.id);if(a){mergeKid(a,b);mer++}else if(S.kids.length<6){S.kids.push(b);add++}}
 if(!S.pin&&d.pin)S.pin=d.pin;
 if(loadFailed){loadFailed=false}save();toast('合併完成：合併 '+mer+' 人、新增 '+add+' 人');parentZone()}
function restoreReplace(){const d=restoreText();if(!d)return;ask('<div class="pz"><h2>確定要用備份「整個取代」現在的資料嗎？</h2><p>現在的紀錄會被覆蓋，無法復原。</p></div>',()=>{S=d;loadFailed=false;save();toast('已還原');parentZone()})}

function resetAfterFail(){ask('<div class="pz"><h2>開始新的存檔？</h2><p>讀不懂的舊存檔仍保留在救援區，不會刪掉。</p></div>',()=>{loadFailed=false;save();parentZone()})}

/* ---- 字形（靜態 SVG，座標和 hanzi-writer 相同：1024 方格、y 軸翻轉 translate(0,900) scale(1,-1)） ---- */
function gridInner(w,col){col=col||'#e8a0a0';return `<rect x="${w*0.012}" y="${w*0.012}" width="${w*0.976}" height="${w*0.976}" fill="none" stroke="${col}" stroke-width="${w*0.024}"/><path d="M${w/2} 0V${w}M0 ${w/2}H${w}" stroke="${col}" stroke-width="${w*0.01}" stroke-dasharray="${w*0.03} ${w*0.025}"/>`}
function numMarks(c,upto,sc){const M=STROKES[c].medians;sc=sc||1;let h='';for(let i=0;i<Math.min(upto,M.length);i++){const p=M[i][0],x=p[0],y=900-p[1];h+=`<circle cx="${x}" cy="${y}" r="${40*sc}" fill="#fff" stroke="#e03131" stroke-width="${7*sc}"/><text x="${x}" y="${y+17*sc}" font-size="${50*sc}" text-anchor="middle" fill="#e03131" font-weight="700" font-family="sans-serif">${i+1}</text>`}return h}
function glyph(c,o){o=o||{};const d=STROKES[c];if(!d)return `<span class="gl">${esc(c)}</span>`;const P0=d.strokes,n=P0.length,up=o.upto==null?n:o.upto,rad=d.radStrokes||[];
 let h=o.grid===false?'':gridInner(1024,o.gridc);h+='<g transform="translate(0,900) scale(1,-1)">';
 for(let i=0;i<n;i++){let col=o.color||'#222',show=i<up||!!(o.also&&o.also.indexOf(i)>=0);if(!show&&o.ghost){col=o.ghost;show=true}if(!show)continue;
  if(o.red===i)col='#e03131';if(o.hl&&o.hl.indexOf(i)>=0)col=o.hlc||'#e03131';if(o.rad&&rad.indexOf(i)>=0)col='#1e6fd9';
  h+=`<path d="${P0[i]}" fill="${col}"${o.tap?` data-i="${i}"`:''}/>`}
 if(o.tap)for(let i=0;i<n;i++)h+=`<polyline points="${d.medians[i].map(p=>p.join(',')).join(' ')}" fill="none" stroke="transparent" stroke-width="110" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:stroke" onclick="${o.tap}(${i})"/>`;
 h+='</g>';if(o.nums)h+=numMarks(c,o.nums);
 const sz=o.size||64,u=o.unit||'px';return `<svg class="${o.cls||'gl'}" width="${sz}${u}" height="${sz}${u}" viewBox="0 0 1024 1024" aria-label="${esc(c)}">${h}</svg>`}

function hwLoad(ch,ok,fail){const d=STROKES[ch];if(d)ok(d);else fail(new Error('沒有筆順資料：'+ch))}
function hwCalc(){return Math.max(220,Math.floor(Math.min(window.innerWidth*0.86,window.innerHeight*0.6,420)))}

function hwEnsure(){if(HW)return HW;if(typeof HanziWriter!=='function')throw new Error('筆順程式沒有載入');
 const s=hwCalc();hwSize=s;hwSizeBox(s);
 HW=new HanziWriter(document.getElementById('hwTarget'),{width:s,height:s,padding:hwPad(s),renderer:'svg',charDataLoader:hwLoad,onLoadCharDataError:()=>toast(T.noData),
  showOutline:true,showCharacter:true,strokeColor:'#222',outlineColor:'#d4d4d4',highlightColor:'#ff9f1c',drawingColor:'#1e6fd9',drawingWidth:Math.max(6,Math.round(s/28)),radicalColor:null,
  strokeAnimationSpeed:SPEEDS[S.speed].a,delayBetweenStrokes:SPEEDS[S.speed].d,strokeFadeDuration:0});

function hwSizeBox(s){const b=document.getElementById('hwBox');b.style.width=s+'px';b.style.height=s+'px';
 const g=document.getElementById('hwGrid');g.setAttribute('width',s);g.setAttribute('height',s);g.setAttribute('viewBox','0 0 '+s+' '+s);g.innerHTML=gridInner(s,'#e57373');
 const o=document.getElementById('hwOver'),p=hwPad(s),sc=(s-2*p)/1024;o.setAttribute('width',s);o.setAttribute('height',s);o.setAttribute('viewBox',(-p/sc)+' '+(-p/sc)+' '+(s/sc)+' '+(s/sc))}

function hwResize(force){if(!HW)return;const b=document.getElementById('hwBox');if(!b||b.parentNode.id==='hwPark')return;const s=hwCalc();if(s===hwSize&&!force)return;
 if(s!==hwSize){hwSize=s;hwSizeBox(s);HW.updateDimensions({width:s,height:s,padding:hwPad(s)})}else hwSizeBox(s);overDraw()}

function overDraw(){const o=document.getElementById('hwOver');if(!o)return;if(!hwChar||!STROKES[hwChar]){o.innerHTML='';return}const M=STROKES[hwChar].medians;let h='';
 if(OV.nums&&S.showNum)h+=numMarks(hwChar,OV.nums);
 if(OV.dot>=0&&M[OV.dot]){const p=M[OV.dot][0];h+=`<circle class="pulse" cx="${p[0]}" cy="${900-p[1]}" r="46" fill="#ff6b6b" opacity=".85"/>`}

/* 觸控防護：只用一根手指（或只用 Apple Pencil）寫；把選定的那一個觸點轉成滑鼠事件交給 hanzi-writer，其他觸點（手掌、第二根手指）全部擋掉 */
/* 觸點先當「候選」：移動超過 5px 才開始寫（送 mousedown）；還沒移動時有新的觸點按下，就換成新的（手掌先壓著不動、再用手指寫也可以）。開始寫之後，其他觸點一律不理。 */
let hwTouchId=null,hwT0=null,hwOn=false;
function hwSvg(){return document.querySelector('#hwTarget svg')}
function hwFire(type,t,onDoc){const ev=new MouseEvent(type,{bubbles:true,cancelable:true,clientX:t.clientX,clientY:t.clientY,view:window});(onDoc?document:hwSvg()).dispatchEvent(ev)}
function hwTouch(e){e.stopPropagation();if(e.cancelable)e.preventDefault();const ts=e.changedTouches;
 for(let i=0;i<ts.length;i++){const t=ts[i];
  if(e.type==='touchstart'){if(hwOn)continue;if(S.pencil&&t.touchType&&t.touchType!=='stylus')continue;hwTouchId=t.identifier;hwT0={clientX:t.clientX,clientY:t.clientY}}
  else if(t.identifier===hwTouchId){
   if(e.type==='touchmove'){if(!hwOn){if(Math.hypot(t.clientX-hwT0.clientX,t.clientY-hwT0.clientY)<5)continue;hwOn=true;hwFire('mousedown',hwT0)}hwFire('mousemove',t)}
   else{if(hwOn)hwFire('mouseup',t,true);hwTouchId=null;hwOn=false}}}}
function hwGuardSetup(){const b=document.getElementById('hwBox');['touchstart','touchmove','touchend','touchcancel'].forEach(t=>b.addEventListener(t,hwTouch,{capture:true,passive:false}))}

function recWrite(k,c,stage,star,mis,model){const r=chRec(k,c),t=today();r.last=t;r.at=Date.now();r.mis=mis.slice();const mx=Math.max.apply(null,mis.concat([0]));if(mx>0)r.s=mis.indexOf(mx);markDay(k);
 if(stage==='trace'){r.tr++;r.tstar=Math.max(r.tstar,star);
  if(star===3&&r.lv===0){r.t3=(r.t3||0)+1;if(r.t3>=2||(r.t3d&&r.t3d!==t))r.lv=1;r.t3d=t}else if(star<3)r.t3=0;
  if(mx>=3)bookAdd(k,r)}
 else{r.qz++;r.star=Math.max(r.star,star);if(star===3&&r.lv>=1)r.lv=2;
  if(inBook(r)){if(star===1){r.box=0;r.due=addDays(t,1)}else if(star===3&&(r.due||'')<=t){if(r.box>=4){r.grad=t;toast(CHAT.grad)}else{r.box++;r.due=addDays(t,INTV[r.box])}}}
  else if(star===1||mx>=3)bookAdd(k,r)}}

function roundChars(id,k){const m=/^l(\d)([ab])$/.exec(id);if(m){const l=LESSONS.find(x=>x.n===+m[1]);if(!l)return [];const h=Math.ceil(l.cs.length/2);return m[2]==='a'?l.cs.slice(0,h):l.cs.slice(h)}

function finishRound(){const k=kid(),w=W;if(!w||w.fin)return;w.fin=1;
 const sc=Math.round(w.res.reduce((s,x)=>s+PCT[x.star],0)/w.res.length),full=sc===100,id=w.id,prev=k.best[id];
 const base=full?2:sc>=80?1:0;let why=null;markDay(k);
 if(!full&&sc>=50){const d=today();
  if(id==='retry')why=T.effRetry;
  else if(prev!=null&&sc>prev&&k.bestPaid[id]!==d){why=T.effBest;k.bestPaid[id]=d}
  else{const st=streak(k);if(st>=3&&st%3===0&&k.streakPaid!==d){why=T.effDays;k.streakPaid=d}}}
 const n=base+(why?1:0);if(n)award(k,n,id==='retry'?'retry':'round');

 setScr('result');if(sc>=80)confetti();sfx(sc>=80?'win':'ok');const total=n+(tk?1:0),line=full?CHAT.r100:sc>=80?CHAT.r80:CHAT.r0;
 paint(`<h1 class="center">🎉 ${Z(T.seeRes)}</h1><div class="score">${sc} ${Z(T.score)}</div>

 <div class="cgrid">${w.res.map(x=>`<div class="ccard">${glyph(x.c,{size:64})}${starStr(x.star)}</div>`).join('')}</div>
 ${total?`<div class="card center"><b>${L(T.gotStk,' '+total+' ',T.zhang)}</b><div>${'<span class="stk">⭐</span>'.repeat(total)}</div>${why?`<div class="muted">${Z(why)}</div>`:''}${tk?`<div class="muted">${Z(T.taskStk)}</div>`:''}<button class="btn sun" onclick="stickerPage()">${Z(T.goStk)}</button></div>`:''}

function taskCheck(k){if(gotToday(k,'task'))return false;const tp=todayPlan(k);if(tp.revDone&&tp.newDone&&tp.gameDone){setFlag(k,'task');award(k,1,'task');return true}return false}

/* ---- 今日任務：錯字複習 ≤3、新字 ≤5、小遊戲 1 局 ---- */
function todayPlan(k){const all=unlockedChars(k);let rev=bookDue(k).slice(0,3);
 if(!rev.length)rev=all.filter(c=>k.ch[c]&&(k.ch[c].qz||k.ch[c].tr)&&k.ch[c].last!==today()).sort((a,b)=>(k.ch[a].last<k.ch[b].last?-1:1)).slice(0,3);
 let nw=all.filter(c=>!k.ch[c]||!(k.ch[c].qz||k.ch[c].tr)).slice(0,5);if(!nw.length)nw=all.slice().sort((a,b)=>(k.ch[a].star-k.ch[b].star)||((k.ch[a].last<k.ch[b].last)?-1:1)).slice(0,5);
 const revDone=gotToday(k,'tRev')||(!rev.length),newDone=gotToday(k,'tNew'),gameDone=gotToday(k,'game');
 return {rev,nw,revDone,newDone,gameDone,next:!revDone?'rev':!newDone?'new':!gameDone?'game':''}}

function sk(c,i){const m=STROKES[c]&&STROKES[c].medians[i];if(!m)return null;const a=m[0],b=m[m.length-1];let len=0;for(let j=1;j<m.length;j++)len+=Math.hypot(m[j][0]-m[j-1][0],m[j][1]-m[j-1][1]);return {dx:b[0]-a[0],dy:b[1]-a[1],len,m}}
const SK={
 heng:s=>s.dx>0&&Math.abs(s.dy)<s.dx*0.4&&s.len>150,
 shu:s=>s.dy<0&&Math.abs(s.dx)<-s.dy*0.45&&s.len>150,
 pie:s=>s.dx<0&&s.dy<0&&s.len>200,
 na:s=>s.dx>0&&s.dy<0&&s.len>300,
 dian:s=>s.len<300,
 tiao:s=>s.dx>0&&s.dy>0,
 zhe:s=>{const m=s.m;let mx=0,mi=0;for(let j=0;j<m.length;j++)if(m[j][0]>mx){mx=m[j][0];mi=j}return mi>0&&mi<m.length-1&&m[mi][0]-m[0][0]>80&&m[mi][1]-m[m.length-1][1]>80},

 <li><b>練習流程：</b>生字頁看筆順動畫（可暫停、逐筆、三種速度、部首上色）→ 描紅 → 空格寫。整課練習一局是半課（5～7 字），新字會先看動畫、描紅，再空格寫；熟練後直接空格寫。每寫完一個字就存檔。</li>
