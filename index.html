<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOJO 數學小花園 v3</title>
<style>
:root{
  --pink:#ff8fb8;--pink-d:#f06292;--pink-l:#ffe3ee;
  --mint:#9be3c9;--mint-d:#4fc3a1;
  --yellow:#ffe58a;--purple:#cdb4f6;--purple-d:#9575cd;
  --ink:#5a4a63;--card:#fffdfb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  font-weight:700;color:var(--ink);font-size:24px;line-height:1.5;
  background:
    radial-gradient(circle at 12% 18%,#fff6 0 40px,transparent 41px),
    radial-gradient(circle at 85% 30%,#fff6 0 60px,transparent 61px),
    radial-gradient(circle at 70% 85%,#fff5 0 50px,transparent 51px),
    linear-gradient(160deg,#ffe1ef 0%,#f3e8ff 50%,#dff6ff 100%);
  background-attachment:fixed;
  user-select:none;-webkit-user-select:none;
}
body.castle::before{content:"🏰";position:fixed;right:-2vmin;bottom:-4vmin;font-size:46vmin;opacity:.18;pointer-events:none;z-index:0}
#appRoot{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 16px 40px}
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:60}

/* 注音 */
.zc{display:inline-flex;align-items:center;vertical-align:middle}
.z{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  font-size:.4em;line-height:1;width:1em;margin:0 .6em 0 .1em;font-weight:700;opacity:.9}
.z i{font-style:normal;display:block}
.z b{position:absolute;left:.92em;bottom:.28em;font-weight:400}

/* 共用 */
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.3em;
  min-height:64px;padding:8px 22px;border-radius:999px;background:var(--pink);color:#fff;
  box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint-d);box-shadow:0 5px 0 #2f9f80}
.btn.purple{background:var(--purple-d);box-shadow:0 5px 0 #6d4fb0}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e6d5ea}
.btn.small{min-height:48px;font-size:18px;padding:4px 16px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 0 #f3d3e2,0 12px 24px #d9a9c033;border:4px solid #fff}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.sp{flex:1}
h1{font-size:38px;margin:6px 0;color:var(--pink-d);text-shadow:0 3px 0 #fff}
h2{font-size:28px;margin:8px 0;color:var(--purple-d)}
.hearts{background:#fff;border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 #f3d3e2;font-size:26px;white-space:nowrap}

/* 吉祥物 */
.mascot{position:relative;display:inline-block;font-size:84px;line-height:1.1}
.mascot .ma{position:absolute;font-size:.4em;line-height:1}
.a-crown{top:-.2em;left:.3em}.a-bow{bottom:-.2em;left:.3em}.a-flower{top:.12em;left:-.2em}.a-wand{right:-.42em;bottom:.1em}
.mascot.idle{animation:bob 2.4s ease-in-out infinite}
.mascot.jump{animation:jump .7s ease}
.mascot.sad{animation:shake .45s ease}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-38px) scale(1.15) rotate(-10deg)}60%{transform:translateY(0) scale(.95)}80%{transform:translateY(-14px) rotate(8deg)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* 首頁 */
.name{font:inherit;font-size:24px;color:var(--ink);border:4px solid var(--pink-l);border-radius:18px;padding:6px 14px;width:9em;background:#fff;user-select:text;-webkit-user-select:text}
.name:focus{outline:none;border-color:var(--pink)}
.grade{display:flex;gap:12px;margin:14px 0}
.grade button{flex:1;min-height:72px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #e6d5ea;font-size:26px}
.grade button.on{background:var(--purple-d);color:#fff;box-shadow:0 5px 0 #6d4fb0}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unit{position:relative;min-height:150px;border-radius:24px;padding:10px 6px;background:#fff;box-shadow:0 6px 0 #f3d3e2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1.35}
.unit:nth-child(3n+1){background:#fff0f6}.unit:nth-child(3n+2){background:#eefbf5}.unit:nth-child(3n){background:#fff9df}
.unit:active{transform:translateY(4px);box-shadow:0 2px 0 #f3d3e2}
.unit .ue{font-size:48px;line-height:1.2}
.unit .best{position:absolute;top:6px;right:10px;font-size:15px;color:#e59a00}
.mix{position:relative;width:100%;margin-top:14px;min-height:120px;border-radius:28px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(120deg,#ffd1e3,#fff3b8,#c9f3e2,#d9c8fb);box-shadow:0 7px 0 #e9a9c6;border:4px solid #fff;text-align:left;line-height:1.5}
.mix:active{transform:translateY(4px);box-shadow:0 3px 0 #e9a9c6}
.mix .ue{font-size:52px;line-height:1}.mix .mt{font-size:28px;color:var(--pink-d)}.mix .ms{font-size:17px}
.mix .best{position:absolute;top:8px;right:16px;font-size:17px;color:#e59a00}
.story{font-size:60px;line-height:1.2}
.mixes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dot{position:absolute;top:-8px;right:-6px;min-width:30px;height:30px;border-radius:15px;background:#ff5252;color:#fff;font-size:18px;line-height:30px;animation:pop 1s infinite}
/* 一頁多題 */
.q{margin-bottom:16px;position:relative;scroll-margin:150px 0 210px}
.q.miss{border-color:var(--pink-d);animation:shake .45s}
.q.right{border-color:var(--mint-d);background:#f3fdf8}
.q.wrong{border-color:#ffb3c7;background:#fff6f9}
.mark{position:absolute;top:6px;left:120px;font-size:50px;line-height:1;animation:pop .5s;z-index:2}
.opt.sel{background:#fff3c9;border-color:#f0c94f;box-shadow:0 6px 0 #f0c94f}
.graded .opt,.graded .inp,.graded .micb{pointer-events:none}
.inp{cursor:pointer}
.inp.act{border-style:solid;box-shadow:0 0 0 6px #ffd1e3}
.spk.micb{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.spk.on{background:var(--pink);animation:pulse 1s ease-in-out infinite}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fffdfbee;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -6px 18px #5a4a6322;border-radius:24px 24px 0 0}
#pad.on{display:block}
#pad .pad{grid-template-columns:repeat(6,1fr);max-width:720px}
#pad .pad button{min-height:62px}
body.padon #appRoot{padding-bottom:210px}
.rec{padding:8px;overflow-x:auto}
.rec table{width:100%;border-collapse:collapse;font-size:19px;text-align:center}
.rec th{color:var(--purple-d);padding:6px 4px;border-bottom:3px solid var(--pink-l);white-space:nowrap}
.rec td{padding:8px 4px;border-bottom:2px dashed var(--pink-l);line-height:1.3}
.rec tr.full td{background:#fffbe6}
.rec small{font-size:14px;color:#a892ad}
.rec td>b{font-size:26px;color:var(--pink-d)}
.mix.retry{background:linear-gradient(120deg,#ffe0e9,#fff3c9);min-height:96px;margin-top:10px}
.chooser{background:#fff8dc;border:4px dashed #f0c94f;border-radius:22px;padding:10px;margin:8px 0;font-size:20px}
.pickb{font-size:56px;line-height:1.1;width:92px;height:92px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #f0c94f;animation:bob 2s ease-in-out infinite}
.pickb:nth-child(2){animation-delay:.3s}.pickb:nth-child(3){animation-delay:.6s}
.pickb:active{transform:translateY(4px);box-shadow:0 1px 0 #f0c94f}
.tray .chooser{font-size:16px}.tray .pickb{font-size:38px;width:52px;height:56px;border-radius:14px}.tray .chooser .row{gap:4px}
.ana{border-collapse:collapse;width:100%;font-size:15px}
.ana th,.ana td{padding:5px 8px;border-bottom:1px solid #eadcef;text-align:left;white-space:nowrap}
.ana .bar{display:inline-block;width:90px;height:10px;border-radius:5px;background:#f0e6f3;vertical-align:middle;overflow:hidden}
.ana .bar i{display:block;height:100%}
/* ===== 生動的畫面:會動的小兔子、飄花瓣、首頁小花園、進場和按鈕動畫 ===== */
.bun{width:1em;height:1.1em;display:block;overflow:visible;filter:drop-shadow(0 4px 3px #d9a9c055)}
.bun .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bun .ear-r{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s ease-in-out infinite}
.bun .ear-l{transform-box:fill-box;transform-origin:50% 100%;animation:ear 7s ease-in-out -2s infinite reverse}
.bun .mouth{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.mascot.sad .mouth{transform:scaleY(-1)}
body.talking .bun .mouth{animation:talkm .3s ease-in-out infinite}
@keyframes talkm{50%{transform:scaleY(1.9) translateY(1px)}}
.mascot.jump .eye{animation:none;transform:scaleY(.25)}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes ear{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(13deg)}90%{transform:rotate(-5deg)}}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s}
#sky span{position:absolute;top:-8vh;opacity:.55;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(4vw,28vh) rotate(90deg)}50%{transform:translate(-3vw,56vh) rotate(180deg)}75%{transform:translate(5vw,84vh) rotate(270deg)}100%{transform:translate(0,116vh) rotate(360deg)}}
body[data-screen=play] #sky,body[data-screen=parent] #sky{opacity:.25}
.garden{position:relative;height:120px;margin:6px 0 4px;border-radius:26px;overflow:hidden;background:linear-gradient(#d8f1ff,#f3fbff 60%);border:4px solid #fff;box-shadow:0 6px 0 #cfe9c9}
.garden .sun{position:absolute;right:14px;top:6px;font-size:36px;animation:spin 14s linear infinite}
.garden .fly{position:absolute;left:-40px;top:22px;font-size:26px;animation:fly 11s ease-in-out infinite}
.garden .flowers2{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;align-items:flex-end;gap:2px;font-size:34px;line-height:1}
.garden .flowers2 span{display:inline-block;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.garden .sprout{font-size:24px}
.garden .hop{position:absolute;bottom:28px;font-size:24px;animation:hop 16s linear infinite}
.garden .hop.b{animation-duration:23s;animation-delay:-9s;font-size:22px}
@keyframes hop{0%{left:-8%;transform:translateY(0)}5%{transform:translateY(-10px)}10%{transform:translateY(0)}15%{transform:translateY(-10px)}20%{transform:translateY(0)}45%{transform:translateY(0)}50%{transform:translateY(-10px)}55%{transform:translateY(0)}80%{transform:translateY(0)}85%{transform:translateY(-10px)}90%{transform:translateY(0)}100%{left:104%;transform:translateY(0)}}
.petb{font-size:46px;width:64px;height:64px;padding:0;border-radius:50%;background:#fff;box-shadow:0 4px 0 #e6d5ea;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.petb .bun{filter:none}
.petb:hover{transform:translateY(-4px) rotate(-6deg)}
.petb.on{background:#ffe3ee;box-shadow:0 4px 0 var(--pink-d);outline:4px solid var(--pink)}
.garden .soil{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(#9bdc8e,#74c56b);border-radius:50% 50% 0 0/14px 14px 0 0;color:#fff;font-size:16px;text-align:center;line-height:32px;text-shadow:0 1px 0 #4d9a45}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30vw,-12px) rotate(8deg)}50%{transform:translate(min(60vw,460px),10px)}75%{transform:translate(min(90vw,700px),-8px) rotate(-8deg)}100%{transform:translate(min(120vw,860px),6px)}}
#appRoot>*{animation:rise .5s cubic-bezier(.2,1.3,.4,1) backwards}
#appRoot>*:nth-child(2){animation-delay:.05s}#appRoot>*:nth-child(3){animation-delay:.1s}#appRoot>*:nth-child(4){animation-delay:.15s}#appRoot>*:nth-child(5){animation-delay:.2s}#appRoot>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{transform:translateY(22px) scale(.97)}}
.unit .ue,.mix .ue{display:inline-block;transition:transform .2s}
.unit:hover .ue,.mix:hover .ue{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.15)}}
.mix{background-size:220% 220%;animation:shimmer 8s ease-in-out infinite}
@keyframes shimmer{50%{background-position:100% 50%}}
.opt.sel,.inp.act{animation:pop2 .28s}
@keyframes pop2{50%{transform:scale(1.07)}}
h1{animation:bob 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#sky{display:none}#appRoot>*,.mix,h1,.garden *,.bun *,.anim *{animation:none!important}}
.kid{min-height:50px;padding:4px 18px;border-radius:999px;background:#fff;box-shadow:0 4px 0 #e6d5ea;font-size:20px}
.kid.on{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.stat{background:#fff;border-radius:18px;padding:8px 14px;border:3px solid var(--pink-l);text-align:left;max-width:100%}
.st{text-align:center;font-size:20px;margin-bottom:4px}
.sr{display:flex;align-items:center;gap:10px;border-top:2px dashed var(--pink-l);padding:4px 0}
.sl{font-size:34px;line-height:1.2;border-right:3px solid var(--pink-l);padding-right:10px}
.sb{font-size:26px;letter-spacing:2px;line-height:1.2}
/* 小兔子對話、答錯解說、拉霸 */
.mascot{cursor:pointer}
/* 首頁、禮物屋等畫面:對話框從最上面滑下來,點一下就收起來;作答時改放在上方固定列,不會蓋到題目和選項 */
#talkBox{position:fixed;left:50%;top:10px;transform:translate(-50%,-220%);transition:transform .35s;z-index:45;background:#fff;border:4px solid var(--pink);border-radius:28px;
  padding:8px 20px 8px 10px;display:flex;align-items:center;gap:8px;font-size:22px;width:max-content;max-width:92vw;box-shadow:0 8px 20px #5a4a6333;cursor:pointer}
#talkBox.on{transform:translate(-50%,0)}
[hidden]{display:none!important}
.phead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:-14px -16px 12px;padding:8px 16px 6px;background:#fdeef6;border-radius:0 0 22px 22px;box-shadow:0 4px 12px #5a4a631f}
.phead .ttl{text-align:center;white-space:nowrap;overflow:hidden;min-width:0}
.ptalk{display:flex;align-items:center;gap:6px;font-size:19px;min-height:46px;margin-top:4px;line-height:1.4}
.ptalk .tav{font-size:30px}
.ptalk.pop span:last-child{animation:fadeUp .4s}
.tav{font-size:44px;line-height:1;flex:none}
.teach{display:flex;gap:8px;align-items:flex-start;margin-top:14px;text-align:left}
.teach>.sp{min-width:0}
#steps .bubble{animation-delay:0s}
.kinds{display:flex;flex-wrap:wrap;gap:10px}
.kindb{min-height:56px;padding:6px 16px;border-radius:20px;background:#fff;box-shadow:0 4px 0 #f3d3e2;font-size:20px}
.kindb:active{transform:translateY(3px);box-shadow:0 1px 0 #f3d3e2}
.bubble.trap{background:#fff3c9;border:3px solid #f0c94f}
.expr.sm{font-size:46px}
.emo.ord{gap:6px 14px;align-items:center;font-size:40px}
.emo.ord span{white-space:normal;text-align:center}
.emo.ord span:first-child,.emo.ord span:last-child{font-size:22px}
.calc{margin-top:12px;font-size:22px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center}
.calc>b{font-size:28px;color:var(--purple-d);font-family:"Comic Sans MS","Segoe UI",sans-serif}
.vert{display:inline-block;font-family:Consolas,"Courier New",monospace;font-size:38px;line-height:1.2;text-align:right;letter-spacing:.2em;padding:0 .3em}
.vert div{white-space:nowrap}
.vert .vl{border-top:4px solid var(--ink)}
.vert .cy{color:var(--pink-d);line-height:.7}
.vert .cy span{display:inline-block;transform:scale(.55);transform-origin:50% 100%}
.bigbtn{font-size:28px;min-height:84px;padding:8px 36px;max-width:100%}
.expr{white-space:nowrap}
.bubble{background:#f6f0ff;border-radius:6px 20px 20px 20px;padding:8px 14px;margin-bottom:8px;font-size:24px;width:fit-content;max-width:100%;animation:fadeUp .4s both}
.bubble:nth-child(2){animation-delay:.25s}.bubble:nth-child(3){animation-delay:.5s}.bubble:nth-child(4){animation-delay:.75s}.bubble:nth-child(5){animation-delay:1s}.bubble:nth-child(n+6){animation-delay:1.25s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.bubble.so{background:#d9f7ea}
.slotcard{margin-bottom:12px}
.reels{display:flex;justify-content:center;gap:10px;margin:12px 0}
.reel{width:92px;height:104px;border-radius:20px;background:#fff;border:6px solid var(--yellow);font-size:60px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 8px 12px #0001}
.reel.stop{border-color:var(--pink-d);animation:pop .4s}
/* 集點貼紙簿 */
.bookwrap{display:grid;grid-template-columns:1fr 190px;gap:14px;align-items:start}
.cardgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border-radius:26px;padding:14px;border:5px dashed var(--pink)}
.slot{aspect-ratio:1;border-radius:50%;border:3px dashed #e6c9d8;display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1;transition:transform .15s}
.slot small{font-size:18px;color:#d6bfd0}
.slot.full{border:3px solid #f0c94f;background:#fffbe6;animation:pop .4s}
.slot.hot{background:#ffe3ee;border-color:var(--pink-d);transform:scale(1.15)}
.tray{background:#fffa;border-radius:26px;padding:12px 8px;text-align:center;min-height:220px;border:4px solid #fff;position:sticky;top:10px}
.stk{font-size:58px;line-height:1.2;display:inline-block;margin:4px;cursor:grab;touch-action:none;animation:bob 2s ease-in-out infinite}
.drag{position:fixed;z-index:80;font-size:72px;line-height:1;pointer-events:none;transform:translate(-50%,-50%) rotate(-10deg);filter:drop-shadow(0 8px 6px #0003)}
.mic.on{background:var(--pink-d);box-shadow:0 5px 0 #c2185b;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{font-size:20px;color:var(--purple-d);margin-bottom:4px}
.tip{font-size:20px;background:#fff8;border-radius:18px;padding:8px 14px;margin:12px 0}

/* 作答 */
.flowers{display:flex;gap:2px;font-size:24px;flex-wrap:wrap}
.flowers span{opacity:.45;transition:transform .3s}
.flowers span.done{opacity:1;animation:pop .5s}
.flowers span.now{opacity:1;transform:scale(1.25)}
@keyframes pop{50%{transform:scale(1.7) rotate(20deg)}}
.qno{color:var(--pink-d);font-size:20px}
.prompt{font-size:32px;margin:4px 0 8px}
.spk{width:52px;height:52px;border-radius:50%;background:var(--yellow);box-shadow:0 4px 0 #e6c84f;font-size:24px;flex:none}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;min-height:90px;margin:6px 0 14px}
.expr{font-size:64px;letter-spacing:2px;color:var(--purple-d);font-family:"Comic Sans MS","Segoe UI",sans-serif}
.emo{font-size:38px;line-height:1.25;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
.emo span{white-space:nowrap}
.gone{opacity:.25;text-decoration:line-through}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{min-height:92px;border-radius:24px;background:#fff;border:4px solid var(--pink-l);box-shadow:0 6px 0 var(--pink-l);font-size:36px;padding:6px}
.opts.long{grid-template-columns:1fr;max-width:420px;margin:0 auto}
.opts.long .opt{min-height:72px;font-size:32px}
.opt{white-space:nowrap}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-l)}
.opt.right{background:#d9f7ea;border-color:var(--mint-d);box-shadow:0 6px 0 var(--mint-d)}
.opt.wrong{background:#f2eef3;border-color:#d9d0dc;box-shadow:none;opacity:.55}
.fill{display:flex;justify-content:center;align-items:center;gap:10px;font-size:40px;margin-bottom:12px}
.inp{min-width:150px;height:84px;border-radius:22px;border:5px dashed var(--pink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--pink-d)}
.inp.right{border-style:solid;border-color:var(--mint-d);color:var(--mint-d);background:#d9f7ea}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.pad button{min-height:68px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #e6d5ea;font-size:34px}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #e6d5ea}
.pad .del{background:#fff3c9;box-shadow:0 5px 0 #e6c84f;font-size:24px}
.pad .ok{background:var(--mint-d);color:#fff;box-shadow:0 5px 0 #2f9f80;font-size:24px}
#fb{min-height:20px;margin-top:14px;text-align:center}
.good{font-size:32px;color:var(--mint-d);animation:pop .5s}
.pts{display:inline-block;background:var(--yellow);color:#b27600;border-radius:999px;padding:0 14px;font-size:24px;vertical-align:middle}
.hint{font-size:28px;color:var(--pink-d)}
.ans{font-size:40px;color:var(--mint-d);vertical-align:middle;margin-left:6px}
.explain{font-size:30px;background:#f6f0ff;border-radius:18px;padding:8px 12px;margin:10px 0;line-height:1.4}
.coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:22px;color:#6b4a00;border:4px solid #0001;box-shadow:0 3px 0 #0002}
.c1{width:46px;height:46px;background:#e7a36b}.c5{width:54px;height:54px;background:#d9dde3}
.c10{width:62px;height:62px;background:#c9ced6;font-size:26px}.c50{width:70px;height:70px;background:#f4cf5a;font-size:28px}
.c100{width:128px;height:62px;border-radius:10px;background:#ffb3b3;font-size:28px;color:#8a2a2a}
.burst{position:fixed;left:50%;top:45%;font-size:38px;pointer-events:none;z-index:55;animation:burst .95s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(220deg);opacity:0}}

/* 結算 */
.big{font-size:92px;color:var(--pink-d);line-height:1.1;font-family:"Comic Sans MS","Segoe UI",sans-serif}
.rainbow{font-size:90px;animation:jump 1s ease infinite}
.newst{font-size:64px;display:inline-block;animation:pop .8s}

/* 禮物屋 */
.gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gift{background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 #f3d3e2;font-size:22px}
.gift.top{background:linear-gradient(160deg,#fff6c9,#ffe3ee);box-shadow:0 5px 0 #f0c94f}
.gift .ge{font-size:52px;line-height:1.2}
.gift .cost{color:var(--pink-d);margin:4px 0 8px}
.tag{display:inline-block;background:#f0c94f;color:#fff;border-radius:999px;padding:0 12px;font-size:18px}
.lack{font-size:18px;color:#a892ad}
.dress{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dress div{background:#fff;border-radius:18px;padding:6px 12px;font-size:18px;text-align:center}
.dress .lock{filter:grayscale(1);opacity:.5}
.dress .de{font-size:36px;line-height:1.2}
.mine{font-size:20px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 12px;margin:6px 0}
.book{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.book div{aspect-ratio:1;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.book .no{background:#fff7;color:#d6c6da;font-size:28px}
.book small{position:absolute;right:4px;bottom:0;font-size:13px;color:var(--pink-d)}

/* 視窗 */
#modalBox{position:fixed;inset:0;background:#5a4a6366;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#modalBox.on{display:flex}
#modalBox .card{max-width:480px;width:100%;text-align:center;animation:pop .35s}

/* 家長專區 */
.parent{font-size:16px;font-weight:400;user-select:text}
.parent h3{margin:16px 0 6px;font-size:18px}
.parent input{font:inherit;padding:6px 8px;border:1px solid #d9c9de;border-radius:8px;min-width:0}
.parent .g{display:grid;grid-template-columns:3em 1fr 1.4fr 4em auto;gap:6px;margin:4px 0;align-items:center}
.parent .btn{min-height:40px;font-size:16px;padding:2px 14px;box-shadow:0 3px 0 var(--pink-d)}
.parent .btn.ghost{box-shadow:0 3px 0 #e6d5ea}
.parent label{display:flex;gap:8px;align-items:center;margin:4px 0}

/* 可以用兩指放大畫面;manipulation 讓快速連點不會變成放大 */
body{touch-action:manipulation;-webkit-touch-callout:none} /* 長按圖案不要跳出系統選單 */
/* 手機上往下拉不要變成「重新整理」:寫到一半被重新整理,這一回合就不見了 */
html,body{overscroll-behavior-y:contain}
/* 小手機:時鐘、直式不要超出卡片;例題教學最後的按鈕可以換行 */
.visual svg,.explain svg,.ckdrag svg{max-width:100%;height:auto}
.tray .pickb{font-size:32px}
.emo span.wrapok{white-space:normal;overflow-wrap:anywhere;min-width:0} /* 一長排的圖案在小螢幕可以換行 */
.plant{min-width:26px;min-height:46px;justify-content:flex-end}
@media (max-width:360px){
  body .an-vert{font-size:26px;gap:2px 8px}body .vf{--cw:44px;font-size:30px}body .vcell{height:52px}body .vcell.sm{width:34px;height:34px}
  #lbtn .btn{font-size:16px;padding:6px 12px;max-width:100%;flex-wrap:wrap}
  .frame .fc{width:36px;height:36px;font-size:23px}
  .teach .btn{flex-wrap:wrap;font-size:14px}
  body .tk b{font-size:15px;padding:2px 1px}
  #fcard .prompt{font-size:22px}
}
/* 手機橫著拿(畫面很矮):數字鍵盤排成一排、上面的標題列不固定,題目才不會被蓋住 */
@media (max-height:480px) and (orientation:landscape){

}
/* 數字配對 */
.gcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.gcard{min-height:96px;border-radius:22px;background:#fff;border:4px solid var(--pink-l);box-shadow:0 6px 0 var(--pink-l);font-size:34px;font-family:"Comic Sans MS","Segoe UI",sans-serif;color:var(--purple-d);white-space:nowrap;padding:4px;transition:transform .15s,opacity .3s}
.gcard.sel{background:#fff3c9;border-color:#f0c94f;box-shadow:0 6px 0 #f0c94f;transform:scale(1.06)}
.gcard.done{opacity:0;transform:scale(.3);pointer-events:none}
.gcard{position:relative}
.gcards.hide .gcard:not(.up){background:var(--purple);border-color:var(--purple-d);box-shadow:0 6px 0 var(--purple-d);color:transparent}
.gcards.hide .gcard:not(.up)::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px}
/* 小小商店 */
.shelf{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.sitem{background:#fff;border-radius:20px;padding:8px 16px;box-shadow:0 5px 0 #f3d3e2;display:flex;flex-direction:column;align-items:center}
.sitem .se{font-size:56px;line-height:1.15}

.gstars{font-size:64px;line-height:1.2}

/* 人物:應用題前面的小頭像、首頁「我的朋友」的按鈕、商店的客人 */
.story .who{font-size:.62em;margin-right:6px;vertical-align:middle;white-space:nowrap}

.cust{font-size:44px;white-space:nowrap}

/* 首頁標題前面的名字:手機上自己佔一行,後面的中文才不會被擠到換行 */
.jo{font-family:"Comic Sans MS","Segoe UI",sans-serif;letter-spacing:1px}

/* 解說裡的十格板(湊十、破十) */
.anim .frame .fc.sm{width:30px;height:30px;font-size:19px;border-radius:8px;border-style:solid;border-color:#eadcef}
.anim .frame .fc.sm i{font-style:normal}
.anim .frame .fg{gap:3px;padding:5px;border-width:3px}
.anim .frame .fg.ten{animation:frameglow .5s both}
@keyframes frameglow{to{border-color:var(--pink-d);background:#ffe3ee}}
/* 用說的:口算問答、問問小老師 */
.vbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}
.vmic{width:110px;height:110px;border-radius:50%;font-size:54px;line-height:1;background:var(--purple);box-shadow:0 7px 0 var(--purple-d);transition:transform .08s}
.vmic:active{transform:translateY(4px);box-shadow:0 3px 0 var(--purple-d)}
.vmic.on{background:var(--pink);box-shadow:0 7px 0 var(--pink-d);animation:pulse 1s ease-in-out infinite}
.vstat{min-height:36px;font-size:22px;color:var(--purple-d);text-align:center}
.inp.good{border-style:solid;border-color:var(--mint-d);color:var(--mint-d);background:#d9f7ea}
@media (max-width:560px){.vmic{width:92px;height:92px;font-size:44px}.vstat{font-size:18px}}
/* 數線跳跳 */
.nline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin:14px 0 6px}
.tk{background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;font-family:"Comic Sans MS","Segoe UI",sans-serif}
.tk .fr{font-size:36px;height:48px;line-height:48px}
.tk .fr.hop{animation:fhop .28s}
@keyframes fhop{50%{transform:translateY(-20px)}}
.tk i{display:block;width:100%;height:12px;border-top:4px solid var(--ink);position:relative;margin-top:8px}
.tk i::before{content:"";position:absolute;left:50%;top:-11px;height:18px;border-left:4px solid var(--ink);transform:translateX(-2px)}
.tk b{font-size:22px;border-radius:10px;padding:2px 4px;min-width:1.6em}
.tk.from b{background:var(--purple);color:#fff}
.tk.hit b{background:var(--mint-d);color:#fff}
.tk.no{animation:shake .4s}
.tk:active b{background:#fff3c9}
@media (max-width:560px){.tk .fr{font-size:30px}.tk b{font-size:18px;padding:2px 3px;min-width:0}}
/* ===== v2:一題一題、動手操作、會動的圖解、學習花園 ===== */
.ver{font-size:14px;color:#a892ad;background:#fff;border-radius:999px;padding:0 10px;margin-left:6px;vertical-align:middle;text-shadow:none}
.streak{background:#fff3c9;border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 #f0c94f;font-size:20px;white-space:nowrap}
.stepmode .q{display:none}.stepmode .q.cur{display:block}
.q.lock .opt,.q.lock .inp,.q.lock .micb,.q.lock .wdg,.q.lock .vf,.graded .wdg,.graded .vf{pointer-events:none}
.opt.bad{background:#f2eef3;border-color:#d9d0dc;box-shadow:none;opacity:.5;pointer-events:none}
#stepBar{text-align:center;margin-top:8px}
/* 十格板、點著數 */
.frame{flex-basis:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.frame .fgs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.frame .fg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border:4px solid var(--purple);border-radius:14px;padding:6px}
.frame .fh{font-size:17px;color:#a892ad}
.fc{position:relative;width:46px;height:46px;border-radius:10px;border:2px dashed #d9c9de;background:#fff;padding:0;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center}
.fc.red::after{content:"🔴"}.fc.blue::after{content:"🔵"}.fc.blue{animation:pop2 .25s}
.fc.x::after{opacity:.25}
.fc.x::before{content:"✕";position:absolute;color:var(--pink-d);font-size:34px;z-index:1}
.tapc{position:relative;display:inline-block;cursor:pointer;padding:0 2px}
.tapc.on{filter:saturate(.4)}
.tapc.on::after{content:attr(data-n);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:1.5em;height:1.5em;line-height:1.5em;border-radius:50%;background:var(--purple-d);color:#fff;font-size:.5em;text-align:center}
/* 撥時鐘、付錢 */
.cw{display:flex;flex-direction:column;align-items:center;gap:8px}
.ckdrag{touch-action:none;cursor:grab;line-height:0}
.cw .btn.small{min-height:52px}
.wallet{min-height:88px;min-width:240px;max-width:100%;background:#fff;border:4px dashed var(--purple);border-radius:20px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.wallet:empty::before{content:"👛";font-size:40px;opacity:.5}
.coinb{background:none;padding:0;transition:transform .1s}.coinb:active{transform:scale(.9)}
/* 直式一位一位填 */
.vf{display:grid;grid-template-columns:repeat(var(--n),var(--cw,58px));gap:4px 6px;justify-content:center;align-items:center;font-family:Consolas,"Courier New",monospace;font-size:40px;line-height:1;margin-bottom:12px}
.vf span{text-align:center}
.vf .ln{grid-column:1/-1;border-top:4px solid var(--ink);height:0}
.vcell{width:100%;height:66px;border-radius:14px;border:4px dashed var(--pink);background:#fff;color:var(--pink-d);padding:0;font-family:inherit;font-size:inherit}
.vcell.sm{width:40px;height:40px;font-size:22px;border-width:3px;border-color:var(--purple);color:var(--purple-d);justify-self:center;border-radius:10px}
.vcell.act{border-style:solid;box-shadow:0 0 0 5px #ffd1e3}
.inp.sm{display:inline-flex;min-width:64px;height:52px;font-size:32px;border-width:4px;border-radius:14px;vertical-align:middle;margin:0 4px}
/* 會動的圖解 */
.anim{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f6f0ff;border-radius:18px;padding:10px;margin:10px 0;font-size:26px;line-height:1.3;max-width:100%}
.lazyanim .anim:not(.go) *{animation-play-state:paused!important}
.pp{display:inline-block;animation:popin .35s both}
@keyframes popin{from{opacity:0;transform:scale(.3)}}
.an-row{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;align-items:flex-end}
.an-row>span{display:inline-flex;flex-wrap:wrap;justify-content:center}
.an-it{display:inline-flex;flex-direction:column;align-items:center;min-width:1.25em}
.an-it small,.an-n,.an-sum,.an-grp b{font-family:"Comic Sans MS","Segoe UI",sans-serif}
.an-it small{font-size:.5em;color:var(--purple-d)}
.an-x{animation:xout .4s both}
@keyframes xout{to{opacity:.22;filter:grayscale(1)}}
.an-sum{font-size:30px;color:var(--mint-d)}
.an-grp{flex-direction:column;align-items:center;background:#fff;border-radius:12px;padding:4px 6px;font-size:15px}
.an-row>.an-grp{display:inline-flex;flex-wrap:nowrap}
.an-grp>span{display:block;max-width:5.6em;line-height:1.15;word-break:break-all;text-align:center}
.an-grp b{font-size:20px;color:var(--pink-d)}
.an-n{background:#fff;border-radius:12px;padding:2px 10px;color:var(--purple-d)}
.an-n.hit{color:var(--mint-d)}
.an-hop{font-size:.6em;color:var(--pink-d);text-align:center;line-height:1.1}
.an-vert{display:inline-grid;gap:2px 12px;font-family:Consolas,"Courier New",monospace;font-size:38px;line-height:1.15;text-align:center}
.an-vert .ln{grid-column:1/-1;border-top:4px solid var(--ink)}
.an-vert .cy{font-size:.5em;color:var(--pink-d);min-height:1.2em}
.an-vert .an-d{color:var(--pink-d)}
.tenbox{border-radius:10px;outline:3px solid transparent;animation:tenhl .5s 1s both}
@keyframes tenhl{to{outline-color:var(--pink-d);background:#ffe3ee}}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(var(--a))}}
/* 學習花園:每個單元一株,越熟練長得越大 */
.garden{height:164px}
.garden .flowers2{gap:0;bottom:38px;padding:0 6px;justify-content:space-around}
.plant{position:relative;background:none;padding:0;display:inline-flex;flex-direction:column;align-items:center;font-size:36px;line-height:1.05;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}

@media (max-width:560px){
  .plant{font-size:26px}.plant.s0{font-size:16px}.plant.s1{font-size:21px}.plant small{font-size:12px}

  .rec table{font-size:15px}.rec td>b{font-size:20px}.rec small{font-size:12px}
  .tip{font-size:17px}
  .bookwrap{grid-template-columns:1fr}

  .slot{font-size:34px}.cardgrid{gap:6px;padding:10px}
  #pad .pad button{min-height:54px;font-size:26px}

}

<body>
<div id="sky"></div>
<div id="appRoot"><div style="text-align:center;padding:40px 0;font-size:28px">🌱 載入中…<div id="bootmsg" style="font:400 15px/1.6 sans-serif;margin-top:14px;white-space:pre-wrap;word-break:break-all;text-align:left;background:#fff;border-radius:12px;padding:10px">步驟 0(檢查程式還沒有執行)</div></div></div>

/* ===== 注音排版:zy('答對了','ㄉㄚˊ ㄉㄨㄟˋ ˙ㄌㄜ'),每個國字對一個注音,其他符號照原樣 ===== */
const HAN=/[一-鿿]/;
function zy(text,z){
  const syl=z?z.trim().split(/\s+/):[];let k=0,out='';
  for(const ch of String(text)){
    if(HAN.test(ch)&&k<syl.length){
      let s=syl[k++],light=false,tone='';
      if(s[0]==='˙'){light=true;s=s.slice(1)}
      if('ˊˇˋ'.includes(s.slice(-1))){tone=s.slice(-1);s=s.slice(0,-1)}
      out+=`<span class="zc">${ch}<span class="z">${light?'<i>˙</i>':''}${[...s].map(c=>`<i>${esc(c)}</i>`).join('')}${tone?`<b>${tone}</b>`:''}</span></span>`;
    }else out+=esc(ch);
  }
  if(z&&[...String(text)].filter(c=>HAN.test(c)).length!==syl.length)console.warn('注音數量不符:',text);
  return out;
}

function beep(f,at,d,type='sine',v=.16){
  try{

    if(AC.state!=='running')AC.resume(); // 手機切到別的 App 再回來,聲音會被暫停,要叫醒它
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

function speak(t,force,done){ // force 是按喇叭鈕時,就算關掉聲音也唸;done 是全部唸完以後要做的事(語音問答用)
  try{

    // 一句一句唸:句子之間有自然的停頓,也避開有些瀏覽器長句唸到一半停掉的問題
    const parts=(speakable(t).match(/[^。!?!?;]+[。!?!?;]*/g)||[]).map(s=>s.trim()).filter(s=>/[一-鿿\d]/.test(s));
    if(!parts.length)return;
    const seq=++speakSeq,base=S.pitch||1.4,rate=S.rate||1;
    const say=i=>{
      if(seq!==speakSeq)return;
      if(i>=parts.length){talking(false);if(done)done();return}
      const s=parts[i],u=new SpeechSynthesisUtterance(s),ex=/[!!]$/.test(s),qu=/[??]$/.test(s);
      // 驚嘆句高一點、快一點,問句慢一點,聽起來比較有表情
      u.lang='zh-TW';u.pitch=Math.min(2,base+(ex?.15:0));u.rate=rate*(ex?1.06:qu?.94:1);
      const v=bestVoice();if(v)u.voice=v;
      let moved=false;const nx=()=>{if(!moved){moved=true;say(i+1)}};
      u.onstart=()=>{if(seq===speakSeq)talking(true)};u.onend=u.onerror=nx;
      setTimeout(nx,1500+s.length*600); // 萬一瀏覽器沒有回報唸完,也不會卡住

      if(!voiceWaited&&!speechSynthesis.getVoices().length){

function cnNum(s){
  const D={零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9},U={十:10,百:100,千:1000};
  let t=0,cur=0;for(const ch of s){if(ch in D)cur=D[ch];else{t+=(cur||1)*U[ch];cur=0}}
  return t+cur;
}
const norm=s=>String(s).replace(/[\s,。,.?!?!、]/g,'').replace(CN,m=>cnNum(m));
const HOMO={衣:'一',醫:'一',依:'一',餓:'二',兒:'二',而:'二',耳:'二',山:'三',傘:'三',散:'三',寺:'四',似:'四',死:'四',肆:'四',是:'十',事:'十',市:'十',
  午:'五',舞:'五',無:'五',屋:'五',我:'五',溜:'六',流:'六',劉:'六',留:'六',起:'七',氣:'七',妻:'七',期:'七',吧:'八',爸:'八',把:'八',拔:'八',
  酒:'九',久:'九',就:'九',舊:'九',石:'十',實:'十',時:'十',食:'十',林:'零',靈:'零',另:'零',鈴:'零',白:'百',擺:'百'};
function matchAnswer(text,q){ // 回傳填數字題的數字或選擇題的選項編號,聽不懂回傳 null
  const h=norm(text);let n=(h.match(/\d+/)||[])[0];
  // 「二十」「三十五」的「十」被聽成「是」:整句剛好是「數字 + 是 (+ 數字)」時當成幾十幾
  const tens=String(text).replace(/[\s,。,.?!?!]/g,'').match(/^([一二兩三四五六七八九])[是事市]([一二三四五六七八九])?$/);
  if(tens)n=String(cnNum(tens[1]+'十'+(tens[2]||'')));
  // 小朋友說數字常被聽成同音字(「十」聽成「是」、「六」聽成「溜」),聽不出數字時換回來再試一次
  if(n==null)n=(norm([...String(text)].map(c=>HOMO[c]||c).join('')).match(/\d+/)||[])[0];
  if(q.type==='f')return n==null?null:+n;
  const ps=q.opts.map(o=>norm(o.s||plain(o.h)));
  if(tens){const i=ps.findIndex(p=>parseInt(p)===+n);if(i>=0)return i}
  let best=-1;ps.forEach((p,i)=>{if(h.includes(p)&&(best<0||p.length>ps[best].length))best=i});
  if(best>=0)return best;
  if(n!=null){const hit=ps.map((p,i)=>parseInt(p)===+n?i:-1).filter(i=>i>=0);if(hit.length===1)return hit[0]}
  return null;
}

function gAdd(type,lo,hi,op,hard){ // op:1 加法、0 減法、不給就隨機;hard:1 一定要跨過十、0 一定不用、不給就隨機
  const fruit=pick(['🍎','🍓','🍊','🌸']);let n=0;
  if(op==null?R(0,1):op){
    let s,a,b;do{s=R(lo,hi);a=R(1,s-1);b=s-a}while(hard!=null&&(a%10+b%10>=10)!==!!hard&&++n<60);
    return num(Z(T.calc),expr(`${a} + ${b} = ?`)+frameHtml('add',a,b),s,type,{say:`${a} 加 ${b} 等於多少`,ex:emoRow(fruit,a)+'➕'+emoRow(fruit,b),calc:`${a} + ${b} = ${s}`,
      // 兩個一位數加起來超過十:講「湊十」(圖會把小的那個數拆開);其他的講「接著往後數」
      teach:a<10&&b<10&&s>10?[[MK.ten]]:[[TT.from,a,TT.countOn,b,TT.ge,'。'],[TT.put,a,TT.and,b,TT.join,'。']]});
  }
  let a,b;do{a=R(lo,hi);b=R(1,Math.min(a,10))}while(hard!=null&&(a%10<b%10)!==!!hard&&++n<60);
  return num(Z(T.calc),expr(`${a} − ${b} = ?`)+frameHtml('sub',a,b),a-b,type,{say:`${a} 減 ${b} 等於多少`,ex:emoRow(fruit,a,b),calc:`${a} − ${b} = ${a-b}`,
    // 十幾減幾、個位不夠減:講「從 10 裡面拿」(圖會把十幾排成一個十和幾個一)
    teach:a>10&&a<20&&b<10&&a%10<b?[[MK.breakTen]]:[[TT.from,a,TT.takeAway,b,TT.ge,'。'],[TT.leftQ]]});
}
function gAdd2(type,op,hard){ // hard:1 一定要進位/借位、0 一定不用、不給就隨機
  let a,b,n=0;
  if(op==null?R(0,1):op){
    do{a=R(11,79);b=R(11,99-a)}while(hard!=null&&(a%10+b%10>=10)!==!!hard&&++n<60);
    const o=a%10+b%10,c=o>=10;
    return num(Z(T.calc),expr(`${a} + ${b} = ?`),a+b,type,{say:`${a} 加 ${b} 等於多少`,ex:vert(a,'+',b,a+b),calc:`${a} + ${b} = ${a+b}`,
      teach:[[TT.ones,':',`${a%10} + ${b%10} = ${o}`],...(c?[[TT.carry]]:[]),[TT.tens,':',`${a/10|0} + ${b/10|0}${c?' + 1':''} = ${(a/10|0)+(b/10|0)+(c?1:0)}`]]});
  }
  do{a=R(22,99);b=R(11,a-1)}while(hard!=null&&(a%10<b%10)!==!!hard&&++n<60);
  const br=a%10<b%10;
  return num(Z(T.calc),expr(`${a} − ${b} = ?`),a-b,type,{say:`${a} 減 ${b} 等於多少`,ex:vert(a,'−',b,a-b),calc:`${a} − ${b} = ${a-b}`,

}

function wp(type,e,ans,unit,ex,ds,tip,parts){ // tip 是答錯時的關鍵提示
  const teach=[Array.isArray(tip[0])?tip:[tip]]; // tip 可以是一句話,也可以是好幾段接起來的一行
  // 二年級的題目有三成會多講一個用不到的數字(年紀),練習判斷哪些數字要用
  if(parts[1]===W.has&&(parts[2]>20||ans>24)&&R(0,9)<3){
    parts=[parts[0],W.thisYear,R(6,9),W.sui,C,...parts.slice(1)];teach.push([TT.noAge]);
  }
  const s=line(parts);
  // 題目裡提到的人物,把她們的圖示畫在前面(一位或兩位)
  const who=[...new Set(parts.filter(p=>p&&p.e).map(p=>p.e))].map(x=>`<span class="who">${x}</span>`).join('');
  return num(s.h,`<div class="story">${who}${e}</div>`,ans,type,{unit:Z(unit),say:s.say,ds,teach:[...teach,[TT.formula,':',`${ex} = ${ans}`]]});
}

function wdOpts(ans){const o=shuffle([0,1,2,3,4,5,6].filter(i=>i!==ans)).slice(0,2);return [ans,...o].map(i=>({h:Z(wd(i)),ok:i===ans}))}
function gCal1(type){ // 一年級:明天、昨天、後天
  const s=pick(SHIFT);
  if(type==='c'){
    const t=R(0,6),ans=(t+s.d+7)%7,p=line([CAL.today,wd(t),',',s.w,CAL.isWd,'?']);
    return lab(p.h,calV,wdOpts(ans),{say:p.say,teach:[[s.tip],[CAL.order]]});
  }
  const m=R(1,12),d=R(3,26),p=line([CAL.today,m,CAL.month,d,CAL.day,',',s.w,CAL.is,m,CAL.monthDay,'?']);
  return num(p.h,calV,d+s.d,'f',{unit:Z(CAL.day),say:p.say,ds:[1,2],teach:[[s.tip],[`${d} ${s.d>0?'+':'−'} ${Math.abs(s.d)} = ${d+s.d}`]]});
}
function gCal2(type){ // 二年級:再過幾天、幾個星期、下個星期
  if(type==='c'){
    const t=R(0,6),n=R(2,6),ans=(t+n)%7,p=line([CAL.today,wd(t),',',CAL.after,n,CAL.days,CAL.isWd,'?']);
    return lab(p.h,calV,wdOpts(ans),{say:p.say,teach:[[CAL.order],[CAL.countFrom]]});
  }
  if(R(0,1)){
    const n=R(2,9),p=line([n,CAL.weeksQ,'?']);
    return num(p.h,calV,7*n,'f',{unit:Z(CAL.days),say:p.say,ds:[1,7,2],teach:[[CAL.week7],[`7 × ${n} = ${7*n}`]]});
  }
  const t=R(0,6),d=R(1,20),p=line([CAL.today,d,CAL.day,wd(t),',',CAL.next,wd(t),CAL.isDay,'?']);
  return num(p.h,calV,d+7,'f',{unit:Z(CAL.day),say:p.say,ds:[1,7],teach:[[CAL.sameDay],[`${d} + 7 = ${d+7}`]]});

  total:['一共有幾個?','ㄧˊ ㄍㄨㄥˋ ㄧㄡˇ ㄐㄧˇ ˙ㄍㄜ'],moreQ:['多幾個','ㄉㄨㄛ ㄐㄧˇ ˙ㄍㄜ'],

function gStat(type){ // 看統計圖:三種水果各有幾個
  const fr=shuffle(['🍎','🍌','🍇','🍓','🍊','🍉']).slice(0,3),s=new Set();while(s.size<3)s.add(R(2,9));
  const n=[...s],sum=n[0]+n[1]+n[2],ge=Z(TT.ge),list=fr.map((e,i)=>`${e} ${n[i]}`).join('、');
  const v=`<div class="stat"><div class="st">${Z(ST.title)}</div>${fr.map((e,i)=>`<div class="sr"><span class="sl">${e}</span><span class="sb">${e.repeat(n[i])}</span></div>`).join('')}</div>`;
  const total=()=>num(Z(ST.total),v,sum,type,{unit:ge,say:'一共有幾個',ds:[1,2],teach:[[ST.tip],[`${n.join(' + ')} = ${sum}`]]});
  if(type==='c'){
    if(R(0,1))return total();
    const big=R(0,1),t=big?Math.max(...n):Math.min(...n);
    return lab(Z(big?ST.most:ST.least),v,fr.map((e,i)=>({h:e,ok:n[i]===t})),{say:big?'哪一種最多':'哪一種最少',teach:[[ST.tip],[list]]});
  }
  if(R(0,1))return total();
  let [i,j]=shuffle([0,1,2]);if(n[i]<n[j])[i,j]=[j,i];
  const p=line([fr[i],W.bi,fr[j],ST.moreQ,'?']);
  return num(p.h,v,n[i]-n[j],'f',{unit:ge,say:'比比看,多幾個',ds:[1,2],teach:[[ST.tip],[list],[`${n[i]} − ${n[j]} = ${n[i]-n[j]}`]]});
}

const CALC_KINDS=/^(add|sub|mul|box|w[A-Z])/; // 這些題型才用算式去推「常見錯誤」
function autoTraps(q,kind){
  const t={},ans=q.ans;if(ans==null)return t;
  const put=(v,k)=>{if(Number.isInteger(v)&&v>=0&&v!==ans&&!(v in t))t[v]=k};
  Object.entries(q.traps||{}).forEach(([v,k])=>put(+v,k));
  const c=q.calc||'';let m;
  if(kind==='ruler'){if((m=c.match(/^(\d+) − (\d+) = /))&&+m[2]>0)put(+m[1],'endOnly')}
  else if(kind==='clock2'){if(m=c.match(/^(\d+) × 5 = /))put(+m[1],'numeral')}
  else if(/^money/.test(kind))put(c.split('+').length,'coins');
  else if(m=c.match(/^(\d+) \+ 1 \+ (\d+) = /))put(+m[1]+ +m[2],'self');
  else if(CALC_KINDS.test(kind)&&(m=c.match(/^(\d+) ([+−×]) (\d+) = (\d+)$/))&&+m[4]===ans){
    const a=+m[1],b=+m[3];
    if(m[2]==='+'){
      if(Math.max(a,b)>=10&&a%10+b%10>=10)put(ans-10,'carry'); // 一位數加一位數不算
      if(a>99&&a%100+b%100>=100)put(ans-100,'carry');
      put(Math.abs(a-b),'useAdd');
    }else if(m[2]==='−'){
      if(a%10<b%10){
        const A=String(a).padStart(3,'0'),B=String(b).padStart(3,'0');
        put(+[0,1,2].map(i=>Math.abs(A[i]-B[i])).join(''),'bigSmall');put(ans+10,'borrow');
      }
      put(a+b,'useSub');
    }else put(a+b,'addNotMul');
  }
  return t;
}
function rebuildOpts(q){ // 選擇題的錯誤選項優先放「常見錯誤」,不夠再用原本的
  if(q.type!=='c'||q.ans==null)return;
  const old=q.opts.filter(o=>!o.ok).map(o=>parseInt(plain(o.h)));
  const wrong=[...new Set([...shuffle(Object.keys(q.traps).map(Number)).slice(0,2),...old])].filter(v=>v!==q.ans).slice(0,2);
  q.opts=shuffle([q.ans,...wrong]).map(n=>({h:n+q.unit,ok:n===q.ans}));
}

function gBox(type,g2){ // 填空格:□ + 5 = 12
  const k=R(0,3);let a,b,c,v,ans,calc,tip=BOXT.whole;
  if(k<2){ // a + b = c
    c=g2?R(30,99):R(6,20);a=g2?R(11,c-11):R(1,c-1);b=c-a;
    if(k===0){v=`□ + ${b} = ${c}`;ans=a;calc=`${c} − ${b} = ${a}`}else{v=`${a} + □ = ${c}`;ans=b;calc=`${c} − ${a} = ${b}`}
  }else{ // a − b = c

    // 一題一題的時候,以第一次作答為準(第二次才答對的也算還不熟)
    const step=G.mode==='step',ok=step?!!G.first[i]:isRight(i);
    s.h=((s.h||'')+(ok?1:0)).slice(-8); // 最近 8 題的對錯,用來調整難度
    if(ok){s.r++;s.due=Math.max(0,s.due-1)}

  });
}

/* ===== 作答:10 題排在同一頁,全部寫完再一起對答案 ===== */
function start(id){
  if(id==='retry'&&!dueKinds().length)return home();
  newPet();
  const u=unitOf(id),types=shuffle([...'cccccfffff']),qs=[],seen=new Set();
  const w1=findUnit('w1'),w2=findUnit('w2'),o1=UNITS[1].filter(x=>x!==w1),o2=UNITS[2].filter(x=>x!==w2);
  // 綜合題跟著年級:一年級全部出一年級的題目;二年級是一年級 3 題在前、二年級 7 題在後
  const g1=S.grade===1,step=S.mode!=='test';
  const list=id==='mix'?(g1?shuffle([w1,w1,w1,w1,...shuffle(o1).slice(0,6)]):[...shuffle([w1,pick(o1),pick(o1)]),...shuffle([w2,w2,w2,w2,...shuffle(o2).slice(0,3)])])
    :id==='mix2'?(g1?shuffle([...UNITS[1],pick(UNITS[1])]):[...shuffle(UNITS[1]).slice(0,3),...shuffle(UNITS[2]).slice(0,7)])
    :id==='retry'?retryList()
    :id.startsWith('k:')?Array(10).fill({gen:t=>genKind(kindById(id.slice(2)),t)})
    :Array(10).fill(u);
  list.forEach((x,i)=>{
    let q,k,n=0;
    do{q=x.gen(types[i]);k=q.p+'|'+q.v+'|'+q.ansH}while(seen.has(k)&&++n<20);
    seen.add(k);qs.push(q);
  });
  // mode:step 一題一題(馬上對答案,答錯可以再試一次)、test 整頁寫完再一起對答案
  // vd:直式每一格填的數字;wst:操作題現在的樣子;tries/first/trap1/pts:一題一題時每題試了幾次、第一次對不對、第一次犯的錯、得幾分
  G={u,qs,ans:Array(qs.length).fill(null),act:null,cell:null,done:false,mode:step?'step':'test',cur:0,vd:[],wst:[],tries:[],first:[],trap1:[],pts:[],hinted:[],last:[],combo:0};
  sfx.tap();
  show('play',`
  <div class="phead">
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost small" onclick="goHome()">🏠</button><span class="sp ttl">${u.e} ${Z(u.t)}</span><span class="hearts" id="progBox"></span></div>
    <div class="ptalk" id="playTalk"></div>
  </div>
  <div id="res"></div>
  ${qs.map(qCard).join('')}
  <div id="sub" style="text-align:center;margin-top:8px"><div class="hint" id="subMsg"></div>
    ${step?'<div id="stepBar"></div>':`<button class="btn mint bigbtn" onclick="submit()">✅ ${Z(T.submit)}</button>`}</div>`);
  if(step){app.classList.add('stepmode');stepShow(0,true);talk(T.introStep,true);speak(T.introStep[0]+qSay(qs[0]))} // 開場白說完,接著唸第一題else{prog();talk(T.intro)}
}
function qCard(q,i){
  const body=q.type==='c'
    ?`<div class="opts ${q.opts.some(o=>o.h.includes('class="zc"')||/ [+−×] /.test(o.h))?'long':''}">${q.opts.map((o,j)=>`<button class="opt" onclick="choose(${i},${j})">${o.h}</button>`).join('')}</div>`
    :q.type==='m'?`<div class="wdg">${widgetHtml(q,i)}</div>`
    :q.vf?vfHtml(q,i)
    :`<div class="fill"><span class="inp" id="inp${i}" onclick="focusFill(${i})">?</span><span>${q.unit}</span></div>`;
  return `<div class="card q" id="q${i}">
    <div class="row" style="flex-wrap:nowrap"><div class="qno sp">${Z(T.qn1)} ${i+1} ${Z(T.qn2)}</div>
      <button class="spk" onclick="speak(qSay(G.qs[${i}]),true)">🔊</button>${SR&&!micOff&&q.type!=='m'?`<button class="spk micb" id="mic${i}" onclick="listen(${i})">🎤</button>`:''}</div>
    <div class="prompt">${q.p}</div>${q.v?`<div class="visual">${q.v}</div>`:''}${body}
    <div class="heard" id="h${i}"></div><div id="fb${i}"></div></div>`;
}
function prog(){
  const n=G.ans.filter(a=>a!=null).length,p=$('#progBox');
  if(G.mode==='step'){if(p)p.textContent=`✏️ ${Math.min(G.cur+1,G.qs.length)} / ${G.qs.length}`+(G.combo>=2?` 🔥${G.combo}`:'');return} // 一題一題:顯示現在是第幾題
  if(p)p.textContent=`✏️ ${n} / ${G.qs.length}`;
  // 寫到第 3、6 題時小兔子加油,全部寫完時提醒按確定(各說一次)
  G.said=G.said||{};
  if((n===3||n===6)&&!G.said[n]){G.said[n]=1;talk(pick(CHAT.play))}
  if(n===G.qs.length&&!G.said.all){G.said.all=1;talk(T.allDone)}
}
function choose(i,j){
  if(G.done||qLocked(i))return;
  if(document.querySelectorAll(`#q${i} .opt`)[j].classList.contains('bad'))return; // 已經選錯過的選項不能再選(用說的也一樣)
  G.ans[i]=j;sfx.tap();
  document.querySelectorAll(`#q${i} .opt`).forEach((b,k)=>b.classList.toggle('sel',k===j));
  $('#q'+i).classList.remove('miss');prog();
}
const qLocked=i=>$('#q'+i).classList.contains('lock'); // 一題一題時,對完答案的題目就鎖住,用點的、用說的都不能再改
// 按數字鍵盤的「好」:收起鍵盤;一題一題時順便把「確定」鈕捲到看得到的地方
function padDone(){closePad();if(G&&G.mode==='step'&&!G.done)$('#stepBar').scrollIntoView({block:'nearest',behavior:'smooth'})}
function setFill(i,s){
  if(qLocked(i))return;
  if(G.qs[i].vf){ // 直式:把數字從個位往左一格一格放進去(語音回答會用到)
    const d=G.vd[i],n=d.r.length;s=String(s).slice(-n).padStart(n,' ');d.r=[...s].map(c=>c===' '?'':c);vfDraw(i);return vfSync(i);
  }
  G.ans[i]=s===''?null:s;$('#inp'+i).textContent=s||'?';$('#q'+i).classList.remove('miss');prog();
}
function focusFill(i){
  if(G.done)return;sfx.tap();closePad();G.act=i;
  $('#inp'+i).classList.add('act');$('#pad').classList.add('on');document.body.classList.add('padon');

function closePad(){
  if(G){G.act=null;G.cell=null}document.querySelectorAll('.inp.act,.vcell.act').forEach(e=>e.classList.remove('act'));
  $('#pad').classList.remove('on');document.body.classList.remove('padon');

function key(k){
  if(scr==='lesson')return lessonKey(k); // 例題教學裡「一起做」的填空
  if(scr==='shop')return shopKey(k); // 小小商店算總價
  if(scr==='vquiz')return vqKey(k); // 口算問答改用按的回答
  const i=G&&G.act;if(i==null||G.done)return;sfx.tap();
  if(G.cell)return vfKey(k); // 直式的小格子
  let s=G.ans[i]||'';
  if(k==='ok')return padDone();
  if(k==='del')s=s.slice(0,-1);else if(s.length<4)s=s==='0'?k:s+k;
  setFill(i,s);
}
$('#pad').innerHTML=`<div class="pad">${[1,2,3,4,5].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button class="del" onclick="key('del')">${Z(T.del)}</button>
  ${[6,7,8,9,0].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button class="ok" onclick="key('ok')">${Z(T.yes)}</button></div>`;

const isRight=i=>{const q=G.qs[i];return q.type==='c'?!!q.opts[G.ans[i]].ok:q.type==='m'?G.ans[i]===q.mAns:Number(G.ans[i])===q.ans};
function submit(){
  if(G.done)return;
  const miss=G.qs.map((_,i)=>i).filter(i=>G.ans[i]==null);
  if(miss.length){
    miss.forEach(i=>{const c=$('#q'+i);c.classList.remove('miss');void c.offsetWidth;c.classList.add('miss')});
    $('#subMsg').innerHTML=`🤔 ${Z(T.miss1)} ${miss.length} ${Z(T.miss2)}`;sfx.bad();speak(`還有${miss.length}題沒寫喔!`);
    $('#q'+miss[0]).scrollIntoView({block:'center',behavior:'smooth'});return;
  }
  const g=G,STEP=450;g.done=true;closePad();hush();$('#sub').innerHTML='';app.classList.add('graded');
  // 一題一題批改:答對蓋章、噴星星,答錯顯示正確答案和圖解
  g.qs.forEach((q,i)=>setTimeout(()=>{

function calcHtml(q,i){ // 答對:列出算式,想看完整解說可以按按鈕

/* 解說要短:一年級的孩子拼注音還很慢,字一多就不看了。
   所以只放「一句重點 + 一張會動的圖(沒有圖才列算式)+ 答案」,而且會唸出來;其他的句子收在「多看一點」裡 */
function teachHtml(q,i,right){
  const ls=q.teach.map(line),open=right?T.teachOpenOk:T.teachOpen,sq=s=>plain(s).replace(/\s/g,'');
  // 解說或圖解裡已經有同一條算式就不重複列
  const calc=q.calc&&q.ex!==q.calc&&!ls.some(l=>sq(l.h).includes(sq(q.calc)))?q.calc:'';
  // 答案剛好是常見的算錯方式,就先點出來
  const trap=right?null:TRAP[(q.traps||{})[givenVal(i)]];
  const an=animHtml(q),pic=an||(q.ex?`<div class="explain">${q.ex}</div>`:''),first=ls[0],rest=ls.slice(1);
  const nowCalc=an?'':calc,moreCalc=an?calc:''; // 會動的圖裡已經有算式,就把算式收到「多看一點」
  const tidy=a=>a.filter(Boolean).join('。').replace(/([。!?!?])。/g,'$1');
  q.teachSay=tidy([open[0],trap&&trap.tip[0],first&&first.say,nowCalc&&'算式:'+sayOps(nowCalc),T.so[0]+(q.ansS||plain(q.ansH))]);
  q.moreSay=tidy([...rest.map(l=>l.say),moreCalc&&'算式:'+sayOps(moreCalc)]);
  const more=rest.length||moreCalc;
  return `<div class="teach"><div class="tav">${bunnySvg()}</div><div class="sp">
    ${trap?`<div class="bubble trap">💡 ${Z(trap.tip)}</div>`:''}${first?`<div class="bubble">${first.h}</div>`:''}
    ${pic}${nowCalc?`<div class="bubble">🧮 ${nowCalc}</div>`:''}
    <div class="bubble so">${Z(T.so)}<span class="ans">${q.ansH}</span></div>
    ${more?`<div class="more" hidden>${rest.map(l=>`<div class="bubble">${l.h}</div>`).join('')}${moreCalc?`<div class="bubble">🧮 ${Z(TT.formula)}:${moreCalc}</div>`:''}</div>`:''}
    <div class="row"><button class="btn purple small" onclick="speak(G.qs[${i}].teachSay,true)">🔊 ${Z(T.hearTeach)}</button>
      ${more?`<button class="btn ghost small" onclick="moreTeach(this,${i})">➕ ${Z(T.more)}</button>`:''}</div></div></div>`;
}

function finish(){

  const step=G.mode==='step',sc=step?G.pts.reduce((a,b)=>a+(b||0),0):G.qs.filter((_,i)=>isRight(i)).length*10,full=sc===100,id=G.u.id,wrong=10-sc/10;
  const n=full?3:sc>=80?1:0; // 80 分以上可以選 1 張貼紙,100 分選 3 張
  // 努力也有獎勵(一回合最多多 1 張,滿分已經有 3 張就不再加):練完錯題、比自己上次進步、連續練習 3 天
  const dk=dayKey(),prev=S.best[id];let why=null;
  S.days=S.days||[];if(!S.days.includes(dk))S.days=[...S.days,dk].slice(-60);
  if(!full&&sc>=50){

    else if(streak()>=3&&streak()%3===0&&S.streakPaid!==dk){why=T.bDays;S.streakPaid=dk}

  // 成績紀錄:時間、名字、題目、分數、這次得到幾張、當時一共有幾張貼紙(含還沒貼、還沒選的)
  S.log.unshift({t:Date.now(),n:S.name,u:id,s:sc,p:n+bonus,own:pts()+S.tray.length+S.owed});S.log.length=Math.min(S.log.length,500);
  save();

    <h2>${full?'🌟 '+Z(T.perfect):n?'🌟 '+Z(T.near):Z(T.keep)}</h2>
    ${why?`<div class="tip">🎁 ${Z(why)}</div>`:''}
    ${n+bonus?'<div id="pickBox"></div>':`<div class="tip">🌟 ${Z(T.need80)}</div>`}
    ${full||step?'':`<div class="tip">👇 ${Z(T.review)}</div>`}
    <div class="row center">${again}</div>
  </div>`;
  renderPick();
  $('#sub').innerHTML=`<div class="row center">${again}</div>`;
  scrollTo({top:0,behavior:'smooth'});talk(full?T.perfect:step?(n?T.near:T.keep):T.lookDown,true);
  // 一題一題的時候每題都已經講解過了,這裡就不用再提醒往下看
  const nm=S.name||'',teach=(why?why[0]:'')+(step?'':`有${wrong}題寫錯了,等一下往下看,${pet().kind[0]}老師教你喔!`);
  if(full){sfx.win();confetti(220);setTimeout(()=>confetti(120),900);speak(`哇!${nm}好厲害!一百分!可以選三張貼紙,快選你喜歡的吧!`)}
  else if(n){sfx.win();confetti(90);speak(`${nm}得到${sc}分,很棒喔!選一張你喜歡的貼紙吧!`+teach)}
  else{sfx.ok();confetti(20);speak(`${nm}得到${sc}分,沒關係,加油加油!`+teach)}
}

function lessonStep(){
  const s=L.steps[L.n];if(!s||L.wait)return;

  L.n++;

  sfx.tap();speak(s.say);
  if(s.so){burst();sfx.ok();const o=$('#lopts');if(o)o.children[L.q.opts.findIndex(x=>x.ok)].classList.add('right')}

  if(!L.val||(k!=='ok'&&L.val.length<s.fill.length))return; // 位數夠了或按「好」才對答案
  const ok=L.val===s.fill;

const CAN_DL=location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname);
let dlAsText=''; // 設了標題就不下載,改成顯示文字讓人複製
function download(name,text,type){
  if(dlAsText){const t=dlAsText;dlAsText='';return showText(t,text.replace(/^﻿/,''))}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));

}

function exportBackup(){
  save();const asText=!!dlAsText;

function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{input.value='';restoreText(r.result)};
  r.readAsText(f);
}
function restoreText(text){
  let o=null;try{o=JSON.parse(text)}catch(e){}
  if(!o||o.app!=='mathGarden'||!o.data||typeof o.data!=='object')return note('這不是JOJO 數學小花園的備份。');
  ask('還原後會蓋掉現在這台裝置上的所有資料,確定嗎?',()=>{
    try{localStorage.setItem(KEY,JSON.stringify(o.data))}catch(e){}

}

function book(quiet){

  let n=Math.max(BIG,Math.ceil(S.card.length/5)*5);
  if(S.tray.length&&n-filled()<1)n+=5;
  while(S.card.length<n)S.card.push(null);
  show('book',`
  <div class="row">${homeBtn()}<span class="sp"></span>${ptsBadge()}</div>
  <h1 style="text-align:center">📒 ${Z(T.myBook)}</h1>
  <div class="bookwrap">
    <div class="cardgrid">${S.card.map((e,i)=>e?`<div class="slot full">${e}</div>`:`<div class="slot" data-i="${i}"><small>${i===BIG-1?'🎁':i+1}</small></div>`).join('')}</div>
    <div class="tray">${S.owed>0?chooserHtml():''}<div>${Z(T.newStk)}</div>
      ${S.tray.length?S.tray.map((e,i)=>`<span class="stk" onpointerdown="stkDown(event,${i})">${e}</span>`).join('')+`<div class="lack">✨ ${Z(T.dragHint)}</div>`:`<div class="lack" style="margin-top:12px">${Z(T.noStk)}</div>`}
    </div>
  </div>
  <div class="tip center">🎁 ${Z(T.rule2)}</div>
  <div class="row center"><button class="btn" onclick="gifts()">🎁 ${Z(T.giftHouse)}</button></div>`);
}
let drag=null;
const slotAt=(x,y)=>{const t=document.elementFromPoint(x,y);return t&&t.closest('.slot:not(.full)')};
function stkDown(e,i){
  e.preventDefault();if(drag)return;
  const g=document.createElement('span');g.className='drag';g.textContent=S.tray[i];document.body.appendChild(g);
  drag={i,g,el:e.currentTarget,x0:e.clientX,y0:e.clientY,moved:false};drag.el.style.opacity=.25;stkMove(e);
  addEventListener('pointermove',stkMove);addEventListener('pointerup',stkUp);addEventListener('pointercancel',stkUp);
}
function stkMove(e){
  const d=drag;if(!d)return;
  d.g.style.left=e.clientX+'px';d.g.style.top=e.clientY+'px';
  if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>8)d.moved=true;
  document.querySelectorAll('.slot.hot').forEach(s=>s.classList.remove('hot'));
  const s=slotAt(e.clientX,e.clientY);if(s)s.classList.add('hot');
}
function stkUp(e){
  removeEventListener('pointermove',stkMove);removeEventListener('pointerup',stkUp);removeEventListener('pointercancel',stkUp);
  const d=drag;drag=null;if(!d)return;d.g.remove();
  let s=e.type==='pointerup'?slotAt(e.clientX,e.clientY):null;
  if(!s&&!d.moved&&e.type==='pointerup')s=document.querySelector('.slot:not(.full)'); // 不會拖的話,點一下也會貼到第一個空格
  if(s)place(d.i,+s.dataset.i);else{d.el.style.opacity=1;document.querySelectorAll('.slot.hot').forEach(x=>x.classList.remove('hot'))}
}
function place(ti,si){
  if(S.card[si]||S.tray[ti]==null)return;
  S.card[si]=S.tray.splice(ti,1)[0];S.total++;save();
  const n=pts();book(true);sfx.ok();burst();
  if(n===BIG){sfx.win();confetti(220);speak('哇!集滿二十張貼紙了!可以換大獎囉!')}
  else speak(pick(['貼好了!好漂亮喔!','耶!又多一張貼紙了!','好棒!貼紙越來越多了!']));
}

/* 家長密碼(S.pin,4 到 8 個數字,只存在這台裝置):第一次打開遊戲就請爸媽設定。

   忘記密碼時改答一題兩位數乘兩位數(小朋友不會算);連錯 5 次要等 30 秒 */
let gate=null,gateFails=0,gateLock=0; // gate:忘記密碼(或還沒有密碼)時出的乘法題;有密碼時是 null
function pinSetup(){
  modal(`<div class="parent" style="font-size:17px"><h3 style="margin-top:0">🔒 給爸媽:請${S.pin?'輸入新的':'先設定'}家長密碼</h3>

    <p><input id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="4 到 8 個數字" style="width:11em;text-align:center"></p>
    <p><input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="再輸入一次" style="width:11em;text-align:center"></p>
    <div id="pinMsg" style="color:#f06292;min-height:1.4em"></div>
    <div class="row center"><button class="btn" onclick="pinSave()">設定好了</button>${S.pin?'<button class="btn ghost" onclick="closeModal()">取消</button>':''}</div>
    <p style="color:#8a7a90;font-size:14px;text-align:left">密碼只存在這台裝置上。忘記的時候,在輸入密碼的畫面按「忘記密碼」,答對一題兩位數乘法就能進去重新設定。</p></div>`);
  $('#pin1').focus();
}
function pinSave(){
  const a=$('#pin1').value.trim(),b=$('#pin2').value.trim(),msg=t=>{$('#pinMsg').textContent=t};
  if(!/^\d{4,8}$/.test(a))return msg('密碼要 4 到 8 個數字。');
  if(a!==b)return msg('兩次輸入的不一樣,請再輸入一次。');
  S.pin=a;save();closeModal();
  if(scr==='parent')parentZone();
}
function parentGate(forgot){
  const usePin=!!S.pin&&!forgot;
  gate=usePin?null:[R(12,19),R(12,19)];
  modal(`<div class="parent"><h3>家長專區</h3><p>${usePin?'請輸入家長密碼':`請回答:${gate[0]} × ${gate[1]} = ?`}</p>
  <p><input id="gateIn" type="${usePin?'password':'number'}" inputmode="numeric" autocomplete="off" style="width:8em;text-align:center"></p>
  <div id="gateMsg" style="color:#f06292;min-height:1.4em"></div>
  <div class="row center"><button class="btn" onclick="gateCheck()">確定</button><button class="btn ghost" onclick="closeModal()">取消</button></div>
  ${usePin?'<p><button class="btn ghost" onclick="parentGate(true)">忘記密碼</button></p>':''}</div>`);
  $('#gateIn').focus();
}
function gateCheck(){
  const inp=$('#gateIn'),msg=t=>{$('#gateMsg').textContent=t};
  if(Date.now()<gateLock)return msg(`錯太多次了,請等 ${Math.ceil((gateLock-Date.now())/1000)} 秒再試。`);
  const v=inp.value.trim(),ok=gate?v!==''&&+v===gate[0]*gate[1]:v===S.pin;
  if(ok){gateFails=0;closeModal();return parentZone()}
  inp.value='';inp.focus();
  if(++gateFails>=5){gateFails=0;gateLock=Date.now()+30000;return msg('錯太多次了,請等 30 秒再試。')}
  msg(gate?'答案不對,再算一次。':'密碼不對。');
}

/* ===== 連續練習幾天 ===== */
const dayKey=(t=Date.now())=>{const d=new Date(t);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function streak(){ // 到今天(今天還沒練就算到昨天)為止,連續幾天有練習
  const ds=new Set(S.days||[]);let n=0,t=Date.now();
  if(!ds.has(dayKey(t)))t-=864e5;
  while(ds.has(dayKey(t))){n++;t-=864e5}
  return n;
}
const streakBadge=()=>{const n=streak();return n?`<span class="streak">🔥 ${Z(T.streak1)} ${n} ${Z(T.day)}</span>`:''};

/* ===== 十格板和點著數:放在題目上的小教具,自己動手排一排、數一數,答案還是要自己填 ===== */
const FR={add:['點格子,放上藍色圓點','ㄉㄧㄢˇ ㄍㄜˊ ˙ㄗ ㄈㄤˋ ㄕㄤˋ ㄌㄢˊ ㄙㄜˋ ㄩㄢˊ ㄉㄧㄢˇ'],sub:['點圓點,把它拿走','ㄉㄧㄢˇ ㄩㄢˊ ㄉㄧㄢˇ ㄅㄚˇ ㄊㄚ ㄋㄚˊ ㄗㄡˇ']};
function frameHtml(mode,a,b){ // add:a 個紅點,空格可以點上藍點;sub:點紅點拿走;bond:b 是全部有幾格
  const tot=mode==='bond'?b:(mode==='add'?a+b:a)>10?20:10,grp=[];
  const cells=Array.from({length:tot},(_,k)=>`<button class="fc ${k<a?'red':''}" onclick="fcell(this,'${mode}')"></button>`);
  for(let k=0;k<tot;k+=10)grp.push(`<div class="fg">${cells.slice(k,k+10).join('')}</div>`);
  return `<div class="frame"><div class="fgs">${grp.join('')}</div><span class="fh">${Z(mode==='sub'?FR.sub:FR.add)}</span></div>`;
}
function fcell(el,mode){
  if(el.closest('.lock'))return;sfx.tap();
  if(mode==='sub'){if(el.classList.contains('red'))el.classList.toggle('x')}
  else if(!el.classList.contains('red'))el.classList.toggle('blue');
}
function tapRow(e,n){ // 跟 emoRow 一樣五個一組,每一個都可以點:點一個、標一個號碼
  let h='';
  for(let i=0;i<n;i+=5){let g='';for(let j=i;j<Math.min(i+5,n);j++)g+=`<span class="tapc" onclick="tapc(this)">${e}</span>`;h+=`<span>${g}</span>`}
  return `<div class="emo">${h}</div>`;
}
function tapc(el){
  if(el.closest('.lock'))return;
  const on=el.closest('.emo').querySelectorAll('.tapc.on').length;
  if(el.classList.contains('on')){if(+el.dataset.n===on){el.classList.remove('on');sfx.tap()}return} // 只有最後一個可以取消
  el.dataset.n=on+1;el.classList.add('on');beep(500+on*30,0,.08);speak(String(on+1));
}

function mClock(g2,hard){ // 一年級撥整點和半點;二年級撥幾點幾分(基本題只到 30 分)
  let h=R(1,12);const m=g2?(hard===0?R(1,6):R(1,11))*5:R(0,1)*30;

  return man(p.h,{k:'clock',snap:g2?5:30},h+':'+m,line(when).h,{say:p.say,ex:clockSvg(h,m),clk:{h,m},

function mCoins(g2){
  const den=g2?[100,50,10,5,1]:[10,5,1],plan=g2?[[100,R(0,2)],[50,R(0,1)],[10,R(0,4)],[5,R(0,1)],[1,R(0,4)]]:[[10,R(0,2)],[5,R(0,1)],[1,R(0,4)]];

const walletHtml=i=>G.wst[i].map((v,k)=>`<button class="coinb" onclick="coinDel(${i},${k})"><span class="coin c${v}">${v}</span></button>`).join('');

const wLocked=i=>!G||G.done||scr!=='play'||$('#q'+i).classList.contains('lock');
function ckSet(i,t){
  if(wLocked(i))return;
  t=((t%720)+720)%720;G.wst[i]=t;
  // 只轉動指針,不重畫整個時鐘:拖到一半把手指按著的東西換掉,iPad 上會收不到後面的拖曳
  const el=$('#ck'+i);el.querySelector('.hh').setAttribute('transform',`rotate(${t/2} 100 100)`);el.querySelector('.mh').setAttribute('transform',`rotate(${t%60*6} 100 100)`);
  G.ans[i]=(Math.floor(t/60)||12)+':'+t%60;$('#q'+i).classList.remove('miss');prog();
}
function ckAdd(i,d){sfx.tap();ckSet(i,G.wst[i]+d)}
let ckD=null;
function ckDown(e,i){
  e.preventDefault();if(wLocked(i))return;
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){} // 手指滑出時鐘外面也繼續跟著
  ckD=i;ckMove(e);addEventListener('pointermove',ckMove);addEventListener('pointerup',ckUp);addEventListener('pointercancel',ckUp);
}
function ckMove(e){ // 長針指向手指的方向;繞過 12 的時候短針跟著往前或往後一格
  const i=ckD;if(i==null)return;
  const r=$('#ck'+i).getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<12)return;
  const st=G.qs[i].w.snap,t=G.wst[i],mm=Math.round((Math.atan2(dx,-dy)*180/Math.PI+360)%360/6/st)*st%60;
  let d=mm-t%60;if(d>30)d-=60;if(d<-30)d+=60;
  if(d)ckSet(i,t+d);
}
function ckUp(){ckD=null;removeEventListener('pointermove',ckMove);removeEventListener('pointerup',ckUp);removeEventListener('pointercancel',ckUp)}
function coinUpd(i){
  const l=G.wst[i];$('#wl'+i).innerHTML=walletHtml(i);
  G.ans[i]=l.length?String(l.reduce((a,b)=>a+b,0)):null;$('#q'+i).classList.remove('miss');prog();

function coinAdd(i,v){if(wLocked(i)||G.wst[i].length>=15)return;sfx.tap();G.wst[i].push(v);G.wst[i].sort((a,b)=>b-a);coinUpd(i)}
function coinDel(i,k){if(wLocked(i))return;sfx.tap();G.wst[i].splice(k,1);coinUpd(i)}

/* ===== 直式一位一位填:上面的小格子可以記進位、借位(不算分),下面的大格子是答案 ===== */
function vfHtml(q,i){
  const {a,op,b}=q.vf,n=Math.max(String(a).length,String(b).length,op==='+'?String(a+b).length:0);
  const d=G.vd[i]=G.vd[i]||{r:Array(n).fill(''),c:Array(n).fill('')};
  const dig=(x,k)=>String(x).padStart(n,' ')[k].trim();
  const row=(lead,f)=>`<span>${lead}</span>`+Array.from({length:n},(_,k)=>f(k)).join('');
  return `<div class="vf" id="vf${i}" style="--n:${n+1}">
    ${row('',k=>k<n-1?`<button class="vcell sm" id="vc${i}_${k}" onclick="vfFocus(${i},'c',${k})">${d.c[k]}</button>`:'<span></span>')}
    ${row('',k=>`<span>${dig(a,k)}</span>`)}${row(op,k=>`<span>${dig(b,k)}</span>`)}<span class="ln"></span>
    ${row('',k=>`<button class="vcell" id="vr${i}_${k}" onclick="vfFocus(${i},'r',${k})">${d.r[k]}</button>`)}</div>`;
}
function vfFocus(i,t,k,quiet){
  if(wLocked(i))return;if(!quiet)sfx.tap();
  closePad();G.act=i;G.cell={t,k};
  $(`#v${t}${i}_${k}`).classList.add('act');$('#pad').classList.add('on');document.body.classList.add('padon');
  $('#q'+i).scrollIntoView({block:'nearest',behavior:'smooth'});
}
function vfDraw(i){const d=G.vd[i];d.r.forEach((x,k)=>{$(`#vr${i}_${k}`).textContent=x});d.c.forEach((x,k)=>{const e=$(`#vc${i}_${k}`);if(e)e.textContent=x})}
function vfSync(i){ // 個位填了才算有寫;中間漏一格就當作寫錯
  const r=G.vd[i].r,s=r.map(x=>x||' ').join('').trim();
  G.ans[i]=r[r.length-1]===''?null:s.includes(' ')?'x':s;$('#q'+i).classList.remove('miss');prog();
}
function vfKey(k){
  const i=G.act,{t,k:c}=G.cell,d=G.vd[i];
  if(k==='ok')return padDone();
  d[t][c]=k==='del'?'':k;vfDraw(i);vfSync(i);
  if(k!=='del'&&t==='r'&&c>0)vfFocus(i,'r',c-1,true); // 填完一格,自動跳到左邊那一格(從個位往左算)
}

/* ===== 一題一題:一次看一題,按確定馬上知道對不對;第一次答錯給提示再試一次,第二次才看解說 ===== */
function stepShow(i,quiet){
  G.cur=i;G.tapAt=Date.now();closePad();
  document.querySelectorAll('.q').forEach((c,k)=>c.classList.toggle('cur',k===i));
  $('#stepBar').innerHTML=stepBtns(i);
  $('#subMsg').innerHTML='';prog();scrollTo(0,0);
  if(!quiet)speak(qSay(G.qs[i])); // 換到下一題就先把題目唸一次
}
function stepCheck(){
  const i=G.cur,q=G.qs[i],c=$('#q'+i);if(G.done||c.classList.contains('lock'))return;
  // 按鈕會在同一個位置換成「下一題」,連按兩下的第二下不算,才不會一下子用掉第二次機會或跳過解說
  if(Date.now()-G.tapAt<TAP_GAP)return;
  const shake=()=>{c.classList.remove('miss');void c.offsetWidth;c.classList.add('miss')};
  if(G.ans[i]==null){shake();sfx.bad();$('#subMsg').innerHTML='🤔 '+Z(T.notYet);return speak(T.notYet[0])}
  // 第二次機會要換一個答案才算,不小心又按到確定不會白白用掉
  if(G.tries[i]===1&&String(G.ans[i])===G.last[i]){shake();$('#subMsg').innerHTML='🤔 '+Z(T.change);return speak(T.change[0])}
  closePad();$('#subMsg').innerHTML='';G.tapAt=Date.now();
  const ok=isRight(i),first=G.tries[i]==null,last=i===G.qs.length-1;
  if(first){G.first[i]=ok;if(!ok)G.trap1[i]=(q.traps||{})[givenVal(i)]} // 錯題本和弱點分析看第一次的答案
  const nextBtn=`<button class="btn bigbtn" onclick="stepNext()">${last?'🏁 '+Z(T.seeScore):Z(T.next)+' ➡️'}</button>`;
  if(ok){
    G.pts[i]=first?10:5;c.classList.add('lock','right');c.insertAdjacentHTML('afterbegin',`<span class="mark">${first?'💮':'👍'}</span>`);
    $('#fb'+i).innerHTML=calcHtml(q,i);sfx.ok();
    const r=c.getBoundingClientRect();burst(r.right-50,Math.min(Math.max(r.top+30,60),innerHeight-60),9);
    // 連續第一次就答對:3、5、7、10 題時特別慶祝;第二次才答對的,稱讚她沒有放棄
    G.combo=first?G.combo+1:0;prog();
    if([3,5,7,10].includes(G.combo)){confetti(60);talk([`連續答對 ${G.combo} 題!`,'ㄌㄧㄢˊ ㄒㄩˋ ㄉㄚˊ ㄉㄨㄟˋ ㄊㄧˊ'])}
    else talk(pick(first?PRAISE:PRAISE2));
    $('#stepBar').innerHTML=nextBtn;return;
  }
  sfx.bad();shake();
  if(first){ // 再想一想:選錯的選項變灰,答案剛好是常見的算錯方式就先提醒
    G.tries[i]=1;G.combo=0;G.last[i]=String(G.ans[i]);prog();const trap=TRAP[G.trap1[i]];
    if(q.type==='c'){const b=c.querySelectorAll('.opt')[G.ans[i]];b.classList.remove('sel');b.classList.add('bad');G.ans[i]=null}
    $('#fb'+i).innerHTML=`<div class="teach"><div class="tav">${bunnySvg()}</div><div class="sp"><div class="bubble">${Z(T.again)}</div>${trap?`<div class="bubble trap">💡 ${Z(trap.tip)}</div>`:''}</div></div>`;
    talk(T.again,true);return speak(T.again[0]+(trap?trap.tip[0]:''));
  }
  G.pts[i]=0;c.classList.add('lock','wrong');c.insertAdjacentHTML('afterbegin','<span class="mark">❌</span>');
  if(q.type==='c')c.querySelectorAll('.opt').forEach((b,k)=>{if(q.opts[k].ok)b.classList.add('right');else if(k===G.ans[i])b.classList.add('wrong')});
  $('#fb'+i).innerHTML=teachHtml(q,i);speak(q.teachSay);$('#stepBar').innerHTML=nextBtn;
  $('#fb'+i).scrollIntoView({block:'nearest',behavior:'smooth'});
}
const TAP_GAP=400; // 毫秒
function stepNext(){
  if(Date.now()-G.tapAt<TAP_GAP)return;
  hush();if(G.cur<G.qs.length-1)return stepShow(G.cur+1);
  // 十題都做完:把每一題都攤開來可以回頭看,再算成績
  G.done=true;closePad();app.classList.remove('stepmode');app.classList.add('graded');$('#stepBar').innerHTML='';finish();
}

/* ===== 會動的圖解:解說和例題教學用。依照算式(q.calc)和題型畫,回傳空字串就用原本不會動的圖 ===== */
const pp=(h,t,cls='')=>`<span class="pp ${cls}" style="animation-delay:${t.toFixed(2)}s">${h}</span>`; // t 秒後跳出來
function animHtml(q){
  const k=q.kind||'',m=plain(q.calc||'').replace(/\s/g,'').match(/^(\d+)([+−×])(\d+)=(\d+)$/);let h='';
  if(k==='clock2'&&q.clk)h=clockAnim(q.clk.h,q.clk.m);
  else if(m){
    const a=+m[1],op=m[2],b=+m[3],r=+m[4];
    if(/^seq/.test(k))h=seqAnim(a,b,r);
    else if(op==='×')h=a*b<=81?(k==='share'?mulAnim(r/a,a):mulAnim(a,b)):'';
    else if(VF.test(k))h=vertAnim(a,op,b,r);

/* 十格板的圖:讓「湊十」和「從 10 裡面拿」看得見。cells(每一格放什麼, 幾秒後整個框亮起來) */
const tenFrame=(cells,glow)=>`<div class="fg${glow!=null?' ten':''}"${glow!=null?` style="animation-delay:${glow.toFixed(2)}s"`:''}>${cells.map(c=>`<span class="fc sm">${c}</span>`).join('')}</div>`;
const popDot=(e,t)=>`<i class="pp" style="animation-delay:${t.toFixed(2)}s">${e}</i>`;
function makeTenAnim(a,b){ // 湊十:大的數先放好,把小的數拆開,先補滿 10,剩下的放到第二個框
  const x=Math.max(a,b),y=Math.min(a,b),n=10-x,m=y-n,t1=1+n*.4+.3,t2=t1+.5+m*.4+.3;
  const f1=Array.from({length:10},(_,k)=>k<x?'🔴':popDot('🔵',1+(k-x)*.4));
  const f2=Array.from({length:10},(_,k)=>k<m?popDot('🔵',t1+.5+k*.4):'');
  return `${pp(`${y} = ${n} + ${m}`,.3,'an-n')}<div class="frame"><div class="fgs">${tenFrame(f1,t1)}${tenFrame(f2)}</div></div>${pp(`10 + ${m} = ${x+y}`,t2,'an-sum')}`;
}
function breakTenAnim(a,b){ // 破十:十幾排成一個 10 和幾個 1,從 10 裡面拿走 b 個,剩下的和旁邊的合起來
  const o=a-10,t1=.8+b*.4+.3;
  const f1=Array.from({length:10},(_,k)=>k>=10-b?`<i class="an-x" style="animation-delay:${(.8+(k-(10-b))*.4).toFixed(2)}s">🔴</i>`:'🔴');
  const f2=Array.from({length:10},(_,k)=>k<o?'🔴':'');
  return `<div class="frame"><div class="fgs">${tenFrame(f1)}${tenFrame(f2)}</div></div>${pp(`10 − ${b} = ${10-b}`,t1,'an-n')}${pp(`${10-b} + ${o} = ${a-b}`,t1+.9,'an-sum')}`;
}
function addAnim(a,b){ // 從 a 開始,再往後一個一個數
  if(a<10&&b<10&&a+b>10)return makeTenAnim(a,b);
  let t=.4,g='';
  const first=Array.from({length:a},(_,i)=>`<span class="an-it">🔴<small>${i===a-1?a:'&nbsp;'}</small></span>`).join('');
  for(let i=1;i<=b;i++){t+=.45;g+=`<span class="an-it pp" style="animation-delay:${t.toFixed(2)}s">🔵<small>${a+i}</small></span>`}
  return `<div class="an-row"><span>${first}</span><span>${g}</span></div>${pp(`${a} + ${b} = ${a+b}`,t+.6,'an-sum')}`;
}
function subAnim(a,b){ // 後面的 b 個一個一個拿走
  if(a>10&&a<20&&b<10&&a%10<b)return breakTenAnim(a,b);
  let t=.5,g='';
  for(let i=0;i<a;i++){const x=i>=a-b;if(x)t+=.4;g+=`<span class="an-it ${x?'an-x':''}" ${x?`style="animation-delay:${t.toFixed(2)}s"`:''}>🔴<small>${x?'&nbsp;':i+1}</small></span>`}

}
function mulAnim(a,b){ // b 組,每組 a 個,一組一組出現,下面是數到幾了
  let t=.2,g='';

function seqAnim(x,st,ans){ // x 是題目裡最後一個數,每次多 st

const GAME_MODES={ten:{e:'🔟',t:['湊成 10','ㄘㄡˋ ㄔㄥˊ']},twenty:{e:'🧮',t:['湊成 20','ㄘㄡˋ ㄔㄥˊ']},mul:{e:'✖️',t:['乘法配對','ㄔㄥˊ ㄈㄚˇ ㄆㄟˋ ㄉㄨㄟˋ']}};

    cards=ks.flatMap(k=>[{h:k,v:k},{h:sum-k,v:sum-k}]);
  }else{ // 幾個算式和它們的答案,答案都不一樣
    const seen=new Set(),ps=[];let n=0;
    while(ps.length<np&&n++<300){const a=R(2,9),b=R(2,9);if(!seen.has(a*b)){seen.add(a*b);ps.push([a,b])}}
    cards=ps.flatMap(([a,b])=>[{h:`${a} × ${b}`,v:a*b,x:1},{h:a*b,v:a*b,x:0}]);
  }

}
function gPick(i){
  const c=M.cards[i];if(M.busy||c.done)return;
  if(M.sel===i){if(M.hide)return;M.sel=null;$('#gc'+i).classList.remove('sel');return sfx.tap()} // 再點一次就取消(蓋牌時翻開了就不能反悔)
  if(M.sel==null){M.sel=i;$('#gc'+i).classList.add('sel','up');return sfx.tap()}
  const j=M.sel,d=M.cards[j],ea=$('#gc'+i),eb=$('#gc'+j);M.sel=null;ea.classList.add('up');
  if(M.sum?c.v+d.v===M.sum:c.x!==d.x&&c.v===d.v){
    c.done=d.done=true;M.left--;ea.classList.add('done');eb.classList.add('done');sfx.ok();
    const r=ea.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8);
    speak(M.sum?`${d.v}和${c.v}合起來是${M.sum}`:sayOps(String((c.x?c:d).h))+'等於'+c.v);
    if(!M.left)setTimeout(()=>{if(scr==='game')gameEnd()},700);
    return;
  }
  // 配錯:兩張搖一搖再放開(蓋牌時多停一下讓她看清楚,再蓋回去)
  M.miss++;M.busy=true;sfx.bad();if(!M.hide)mascotAnim('sad');ea.classList.add('sel','no');eb.classList.add('no');

}

/* ===== 數線跳跳:青蛙在數線上,往前跳是加、往後跳是減;從 0 開始幾個一跳是乘法。點青蛙會跳到的地方 =====
   一局 6 題,不計時。答對了青蛙會一格一格跳過去;同一題點錯兩次,青蛙會示範一次再換下一題 */
Object.assign(T,{frog:['數線跳跳','ㄕㄨˋ ㄒㄧㄢˋ ㄊㄧㄠˋ ㄊㄧㄠˋ'],fDone:['全部跳完了!','ㄑㄩㄢˊ ㄅㄨˋ ㄊㄧㄠˋ ㄨㄢˊ ˙ㄌㄜ']});
const FG={at:['青蛙在','ㄑㄧㄥ ㄨㄚ ㄗㄞˋ'],fwd:['往前跳','ㄨㄤˇ ㄑㄧㄢˊ ㄊㄧㄠˋ'],back:['往後跳','ㄨㄤˇ ㄏㄡˋ ㄊㄧㄠˋ'],

const FROG_ROUNDS=6;
let F=null;
function frog(mode){
  mode=mode==='add'||mode==='skip'?mode:S.grade===1?'add':'skip';
  F={mode,round:0,miss:0,busy:false};sfx.tap();
  show('frog',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts" id="fprog"></span></div>

  <div class="row center">${[['add','➕',FG.mAdd],['skip','✖️',FG.mSkip]].map(([k,e,t])=>`<button class="kid ${k===mode?'on':''}" onclick="frog('${k}')">${e} ${Z(t)}</button>`).join('')}</div>

function frogNext(){
  if(scr!=='frog')return;
  if(F.round>=FROG_ROUNDS){$('#fcard').remove();return playEnd(F.miss,`frog('${F.mode}')`,T.fDone)}
  F.round++;F.tries=0;F.busy=false;let p;
  // 數線一次只畫一段:平板畫 11 格;手機螢幕窄,畫 7 格、跳的格數也少一點,每一格才夠大、點得準
  const N=innerWidth<500?7:11,far=N-2;
  if(F.mode==='add'){ // 畫出來的這一段一定包含起點和終點
    const fwd=R(0,1),n=R(2,far),from=fwd?R(0,20-n):R(n,20),to=fwd?from+n:from-n;
    const lo=Math.min(21-N,Math.max(0,R(Math.max(from,to)-(N-1),Math.min(from,to))));
    F.vals=Array.from({length:N},(_,k)=>lo+k);F.from=from;F.to=to;F.calc=`${from} ${fwd?'+':'−'} ${n} = ${to}`;
    p=line([FG.at,from,',',fwd?'➡️ ':'⬅️ ',fwd?FG.fwd:FG.back,n,FG.ge]);
  }else{
    const st=pick([2,5,10]),n=R(2,N-1);
    F.vals=Array.from({length:N},(_,k)=>k*st);F.from=0;F.to=st*n;F.calc=`${st} × ${n} = ${st*n}`;
    p=line([FG.from,0,FG.start,st,',',FG.jump,n,FG.times]);
  }
  F.say=p.say;F.at=F.vals.indexOf(F.from);
  $('#fprog').textContent=`🐸 ${F.round} / ${FROG_ROUNDS}`;
  $('#fcard').innerHTML=`<div class="row" style="flex-wrap:nowrap"><div class="prompt sp">${p.h}</div><button class="spk" onclick="speak(F.say,true)">🔊</button></div>
    <div class="nline">${F.vals.map((v,k)=>`<button class="tk ${k===F.at?'from':''}" id="tk${k}" onclick="frogPick(${k})"><span class="fr">${k===F.at?'🐸':''}</span><i></i><b>${v}</b></button>`).join('')}</div>
    <div id="fmsg" style="text-align:center;min-height:44px"></div>`;
  speak(p.say);
}
function frogHop(k,done){ // 青蛙從現在的位置一格一格跳到第 k 格
  const d=Math.sign(k-F.at);let n=0;
  const step=()=>{
    if(scr!=='frog')return;
    if(F.at===k)return done();
    $('#tk'+F.at).querySelector('.fr').textContent='';F.at+=d;
    const f=$('#tk'+F.at).querySelector('.fr');f.textContent='🐸';f.classList.remove('hop');void f.offsetWidth;f.classList.add('hop');
    beep(440+ ++n*40,0,.1);setTimeout(step,300);
  };
  step();
}
function frogPick(k){
  if(F.busy||k===F.at)return;
  const target=F.vals.indexOf(F.to),show=()=>{$('#tk'+target).classList.add('hit');$('#fmsg').innerHTML=pp(F.calc,0,'an-sum')};
  if(k===target){
    F.busy=true;
    return frogHop(target,()=>{show();sfx.ok();const r=$('#tk'+target).getBoundingClientRect();burst(r.left+r.width/2,r.top+20,8);speak(sayOps(F.calc));setTimeout(frogNext,1500)});
  }
  F.miss++;F.tries++;sfx.bad();mascotAnim('sad');
  const t=$('#tk'+k);t.classList.remove('no');void t.offsetWidth;t.classList.add('no');
  if(F.tries>=2){F.busy=true;setTimeout(()=>frogHop(target,()=>{show();speak(sayOps(F.calc));setTimeout(frogNext,2200)}),500)} // 示範一次
  else speak(T.again[0]);
}

const SHP={title:['小小商店','ㄒㄧㄠˇ ㄒㄧㄠˇ ㄕㄤ ㄉㄧㄢˋ'],buy:['我要買這些!','ㄨㄛˇ ㄧㄠˋ ㄇㄞˇ ㄓㄜˋ ㄒㄧㄝ'],

  change:['元,要找多少元?','ㄩㄢˊ ㄧㄠˋ ㄓㄠˇ ㄉㄨㄛ ㄕㄠˇ ㄩㄢˊ'],
  give:['點錢幣,把要找的錢放到盤子裡。','ㄉㄧㄢˇ ㄑㄧㄢˊ ㄅㄧˋ ㄅㄚˇ ㄧㄠˋ ㄓㄠˇ ˙ㄉㄜ ㄑㄧㄢˊ ㄈㄤˋ ㄉㄠˋ ㄆㄢˊ ˙ㄗ ㄌㄧˇ'],
  more:['還不夠喔!','ㄏㄞˊ ㄅㄨˊ ㄍㄡˋ ㄛ'],less:['太多了喔!','ㄊㄞˋ ㄉㄨㄛ ˙ㄌㄜ ㄛ'],thanks:['謝謝你!','ㄒㄧㄝˋ ˙ㄒㄧㄝ ㄋㄧˇ'],
  done:['今天的客人都買完了!','ㄐㄧㄣ ㄊㄧㄢ ˙ㄉㄜ ㄎㄜˋ ㄖㄣˊ ㄉㄡ ㄇㄞˇ ㄨㄢˊ ˙ㄌㄜ']};
const SHOP_ITEMS=[['🍎','蘋果'],['🍌','香蕉'],['🍪','餅乾'],['🧃','果汁'],['🍞','麵包'],['✏️','鉛筆'],['🍬','糖果'],['🥛','牛奶'],['🍓','草莓'],['🎈','氣球']];
const SHOP_ROUNDS=4;
let P=null;
function shop(){
  P={round:0,miss:0,g2:S.grade===2};sfx.tap();
  show('shop',`
  <div class="row">${homeBtn()}<span class="sp"></span><span class="hearts" id="sprog"></span></div>

  shopNext();
}
function shopNext(){
  if(scr!=='shop')return;
  if(P.round>=SHOP_ROUNDS){$('#scard').remove();return playEnd(P.miss,'shop()',SHP.done)}
  P.round++;P.step=1;P.val='';P.tray=[];P.tries=0;P.busy=false;
  P.cust=pick(WHO.filter(w=>w!==P.cust)); // 客人是喬妹、煜煜、柚子,輪流來(不會連續兩次同一位)
  P.items=shuffle(SHOP_ITEMS).slice(0,2).map(([e,n])=>({e,n,p:P.g2?R(5,45):R(1,9)}));
  P.total=P.items[0].p+P.items[1].p;
  P.pay=P.g2?(P.total<50?50:100):(P.total<10?10:20); // 客人付的錢一定比總價多,所以一定要找錢

const shopShake=id=>{const e=$(id);e.classList.remove('miss');e.animate([{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'none'}],{duration:300})};
function shopKey(k){ // 第一步:算總價(位數夠了或按「好」就對答案)
  if(!P||P.step!==1||P.busy)return;sfx.tap();
  if(k==='del')P.val=P.val.slice(0,-1);else if(k!=='ok'&&P.val.length<3)P.val=P.val==='0'?k:P.val+k;
  $('#sinp').textContent=P.val||'?';

  const toPay=()=>{P.step=2;P.tries=0;closePad();shopDraw();speak(`客人付了${P.pay}元,要找多少元?`)};
  if(+P.val===P.total){sfx.ok();burst();return toPay()}
  P.miss++;P.tries++;sfx.bad();shopShake('#sinp');P.val='';
  if(P.tries>=2){ // 錯兩次:把算式和答案寫出來,再往下
    P.busy=true;$('#sinp').textContent=P.total;$('#smsg').innerHTML=pp(`${P.items[0].p} + ${P.items[1].p} = ${P.total}`,0,'an-sum');
    speak(sayOps(`${P.items[0].p} + ${P.items[1].p} = ${P.total}`));return setTimeout(()=>{if(scr==='shop'){P.busy=false;toPay()}},2200);
  }
  $('#sinp').textContent='?';$('#smsg').innerHTML=`<span class="hint">${Z(T.again)}</span>`;speak(T.again[0]);
